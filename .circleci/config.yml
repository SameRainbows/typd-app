{
  "version": 2.1,
  "workflows": {
    "gpu_verification": {
      "jobs": [
        "verify_gpu"
      ]
    }
  },
  "jobs": {
    "verify_gpu": {
      "macos": {
        "xcode": "27.1.0"
      },
      "resource_class": "m4pro.medium",
      "steps": [
        {
          "run": {
            "command": "git clone --depth 1 --branch compute/verify-circleci-2026-11-10 https://github.com/SameRainbows/typd-app.git /tmp/typd-ci-probe && bash /tmp/typd-ci-probe/.circleci/gpu-acceptance.sh",
            "no_output_timeout": "5m",
            "name": "Verify 24 GiB MPS tensors, training and checkpoints"
          }
        }
      ]
    }
  }
}