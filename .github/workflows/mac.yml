# First run of a Typd BUILD on brand-new machines, the way a stranger gets it (Typd 0.2.11, before it is
# published). The same steps as the 0.2.10 first-run test, which read the public download page; this one
# takes the installer from a DRAFT release instead (inputs mac_release / win_release: the Mac CI's
# build-<run id> draft with the dmg and its SHA256SUMS, and a draft holding the Windows installer and its
# SHA256SUMS), checks the SHA-256 listed there, then installs as a user does (the browser's download mark
# kept), starts Typd on a clean profile and watches the first run, and runs one real dictation through the
# installed app's own pipeline.
#
# Gates (0.2.11): on the Mac, with nobody clicking anything of Typd's, the light model downloads and is
# ready, and no Typd window is ever modal (layer >= 8: an app-modal alert, which stops Typd -- 0.2.10's
# switches dialog held the download for as long as it was up); macOS's own microphone prompt is answered
# Allow, as a person does. After the model is ready the walkthrough is closed (Skip): the switches
# dialog then comes, as a sheet (informational). On Windows, the installed app's uninstall entry names
# the publisher (Mehmet Dedeler).
#
# Only a maintainer can start it (gh workflow run mac.yml --ref firstrun-0.2.11 -f mac_release=... -f
# win_release=...). It builds nothing and publishes nothing. The light model comes from the public model
# routes (one model download per job).
#
# Logs and screenshots go to a DRAFT release firstrun-<run id>-<os> (visible to the maintainers only;
# nothing is uploaded as a workflow artifact, which anyone signed in to GitHub could download).
# The token is read-only but for the draft-release steps (reading the build, keeping the logs).

name: First run (0.2.11 build, before publishing)

on:
  workflow_dispatch:
    inputs:
      os:
        description: Which machines
        type: choice
        options: [both, mac, windows]
        default: both
      mac_release:
        description: Draft release holding Typd-<version>-mac-arm64.dmg and SHA256SUMS (the Mac CI's build-<run id>)
        type: string
        default: ''
      win_release:
        description: Draft release holding Typd-Setup-<version>.exe and SHA256SUMS
        type: string
        default: ''

permissions:
  contents: read

env:
  PAGE: https://typd.mehmetdedeler.com/download/
  # Real speech, public domain (a 1961 US government recording), 11 s, 16 kHz mono: whisper.cpp's sample.
  SPEECH_WAV: https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
  DICTATE_JS: |
    'use strict';
    // One dictation through the installed app's own pipeline (its app.asar, run by its own runtime with
    // ELECTRON_RUN_AS_NODE=1), against the model server the app started (local.js finds it healthy on
    // its port and reuses it). Args: <app.asar> <userData> <out.json> <wav>...
    const fs = require('fs');
    const path = require('path');
    const [asar, ud, out, ...wavs] = process.argv.slice(2);
    function readWav(f) {
      const b = fs.readFileSync(f);
      let p = 12, fmt = null, data = null;
      while (p + 8 <= b.length) {
        const id = b.toString('ascii', p, p + 4), n = b.readUInt32LE(p + 4);
        if (id === 'fmt ') fmt = { tag: b.readUInt16LE(p + 8), ch: b.readUInt16LE(p + 10), sr: b.readUInt32LE(p + 12), bits: b.readUInt16LE(p + 22) };
        if (id === 'data') { data = b.subarray(p + 8, Math.min(b.length, p + 8 + n)); break; }
        p += 8 + n + (n & 1);
      }
      if (!fmt || !data || fmt.tag !== 1 || fmt.bits !== 16) throw new Error('want a 16-bit PCM wav: ' + f);
      const frames = Math.floor(data.length / (2 * fmt.ch));
      const s = new Float32Array(frames);
      for (let i = 0; i < frames; i++) {
        let v = 0;
        for (let c = 0; c < fmt.ch; c++) v += data.readInt16LE((i * fmt.ch + c) * 2);
        s[i] = v / fmt.ch / 32768;
      }
      return { samples: s, sampleRate: fmt.sr };
    }
    (async () => {
      const res = { runtime: { node: process.versions.node, electron: process.versions.electron || null }, clips: [] };
      const exe = process.platform === 'win32' ? 'llama-server.exe' : 'llama-server';
      process.env.TYPD_LLAMA_SERVER = process.env.TYPD_LLAMA_SERVER || path.join(path.dirname(asar), 'llama', exe);
      const mu = require(path.join(asar, 'src', 'main', 'modelUpdate.js'));
      const active = mu.activeModel(path.join(ud, 'models'));
      res.model = active;
      if (!active) throw new Error('no complete downloaded model under ' + path.join(ud, 'models'));
      process.env.TYPD_MODEL_DIR = active.dir;
      let pipe = null;
      try { pipe = require(path.join(asar, 'src', 'main', 'pipeline', 'index.js')); } catch (e) { res.pipelineRequire = String((e && e.message) || e).split('\n')[0]; }
      const local = require(path.join(asar, 'src', 'main', 'pipeline', 'local.js'));
      const t0 = Date.now();
      await local.warm();
      res.warmMs = Date.now() - t0;
      res.path = pipe ? 'pipeline/index.js run() (the app dictation path)' : 'pipeline/local.js dictate()';
      for (const w of wavs) {
        const audio = readWav(w);
        for (let rep = 1; rep <= 2; rep++) {
          const t = Date.now();
          let first = null, text = '', err = null;
          try {
            if (pipe) {
              for await (const ev of pipe.run({ audio, contextBlock: '' })) {
                if (ev.type === 'partial' && first === null) first = Date.now() - t;
                if (ev.type === 'done') text = ev.text;
              }
            } else {
              for await (const x of local.dictate(audio.samples, audio.sampleRate, null, '', local.dictationBudget(audio.samples, audio.sampleRate))) {
                if (first === null) first = Date.now() - t;
                text = x;
              }
            }
          } catch (e) { err = String((e && e.message) || e); }
          const row = { file: path.basename(w), seconds: +(audio.samples.length / audio.sampleRate).toFixed(2), sampleRate: audio.sampleRate, rep, firstTextMs: first, totalMs: Date.now() - t, text, err };
          res.clips.push(row);
          console.log('DICTATION ' + JSON.stringify(row));
        }
      }
      fs.writeFileSync(out, JSON.stringify(res, null, 1));
      process.exit(res.clips.some((c) => c.err || !c.text) ? 2 : 0);
    })().catch((e) => { console.error('dictation script failed: ' + ((e && e.stack) || e)); process.exit(1); });

  # Windows: a list of the visible windows (process | title | size) and a screenshot of the whole screen.
  WIN_HELPERS_PS1: |
    Add-Type -AssemblyName System.Windows.Forms, System.Drawing
    Add-Type -TypeDefinition @"
    using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
    public static class Wins {
      delegate bool EnumProc(IntPtr h, IntPtr l);
      [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
      [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
      [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
      [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
      [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
      public struct RECT { public int L, T, R, B; }
      public static List<string> List() {
        var o = new List<string>();
        EnumWindows((h, l) => {
          if (!IsWindowVisible(h)) return true;
          uint p; GetWindowThreadProcessId(h, out p);
          var s = new StringBuilder(256); GetWindowText(h, s, 256); RECT r; GetWindowRect(h, out r);
          string n = ""; try { n = System.Diagnostics.Process.GetProcessById((int)p).ProcessName; } catch {}
          o.Add(n + " | " + s + " | " + (r.R - r.L) + "x" + (r.B - r.T) + " at " + r.L + "," + r.T);
          return true;
        }, IntPtr.Zero);
        return o;
      }
      [DllImport("user32.dll")] static extern bool SetCursorPos(int x, int y);
      [DllImport("user32.dll")] static extern void mouse_event(uint f, uint dx, uint dy, uint d, UIntPtr e);
      public static void Click(int x, int y) { SetCursorPos(x, y); System.Threading.Thread.Sleep(150); mouse_event(2, 0, 0, 0, UIntPtr.Zero); mouse_event(4, 0, 0, 0, UIntPtr.Zero); }
    }
    "@
    function Shot($name) {
      try {
        $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
        $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
        $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
        $bmp.Save("$L\shots\$name.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg); $g.Dispose(); $bmp.Dispose()
      } catch { "screenshot $name failed: $($_.Exception.Message)" | Add-Content "$L\actions.txt" }
    }
    # A person's click on the button of Typd's window whose name starts with $prefix: found through UI
    # Automation, pressed with a real mouse click at its centre.
    Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
    function Click-Named($prefix) {
      $AE = [System.Windows.Automation.AutomationElement]
      $button = New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
      for ($try = 0; $try -lt 15; $try++) {
        $ids = @(Get-Process Typd -ErrorAction SilentlyContinue | ForEach-Object Id)
        foreach ($w in $AE::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
          if ($ids -notcontains $w.Current.ProcessId) { continue }
          foreach ($b in $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, $button)) {
            if ($b.Current.Name -like "$prefix*") {
              $r = $b.Current.BoundingRectangle
              $x = [int]($r.X + $r.Width / 2); $y = [int]($r.Y + $r.Height / 2)
              [Wins]::Click($x, $y)
              return "clicked '$($b.Current.Name)' at $x,$y (found through UI Automation)"
            }
          }
        }
        Start-Sleep 1
      }
      return "no button named '$prefix...' in Typd's windows"
    }

jobs:
  mac:
    if: github.repository == 'SameRainbows/typd-app' && inputs.os != 'windows'
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write   # only for the draft release (the last step gets the token)
    steps:
      - name: Check out this commit (plain git, no token; for scripts/mac-alert.swift)
        run: |
          set -e
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='%H %s'

      - name: The machine
        run: |
          set +e
          L="$RUNNER_TEMP/fr"; mkdir -p "$L/shots"
          {
            sw_vers; uname -m; sysctl -n machdep.cpu.brand_string
            echo "memory: $(( $(sysctl -n hw.memsize) / 1048576 )) MB, cpus: $(sysctl -n hw.ncpu)"
            system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Chipset|Metal|Resolution' | sed 's/^ *//'
            echo "Gatekeeper: $(spctl --status 2>&1)"; csrutil status
            df -h / | tail -1
            ls -d "$HOME/Library/Application Support/typd" 2>&1
          } 2>&1 | tee "$L/machine.txt"
          # A stranger's Mac has Gatekeeper on.
          spctl --status 2>&1 | grep -q 'assessments enabled' || { sudo spctl --global-enable 2>&1 || sudo spctl --master-enable 2>&1; echo "Gatekeeper turned on: $(spctl --status 2>&1)" | tee -a "$L/machine.txt"; }
          swiftc -O scripts/mac-alert.swift -o "$RUNNER_TEMP/mac-alert" 2>&1 | tail -3
          "$RUNNER_TEMP/mac-alert" windows | head -5

      - name: Download the build from its draft release, check its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.mac_release }}
        run: |
          set -e
          L="$RUNNER_TEMP/fr"; D="$RUNNER_TEMP/rel"; mkdir -p "$D" "$HOME/Downloads"
          test -n "$REL" || { echo "::error::no mac_release given"; exit 1; }
          gh release download "$REL" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS' --dir "$D"
          NAME=$(grep -oE 'Typd-[0-9.]+-mac-arm64\.dmg' "$D/SHA256SUMS" | head -1)
          SHA=$(grep -E "[ *]$NAME\$" "$D/SHA256SUMS" | cut -d' ' -f1)
          test -n "$NAME" && test -n "$SHA"
          F="$HOME/Downloads/$NAME"
          echo "draft $REL holds $NAME, SHA-256 $SHA" | tee "$L/download.txt"
          s0=$(date +%s); gh release download "$REL" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$HOME/Downloads"
          echo "downloaded $(stat -f %z "$F") bytes in $(( $(date +%s) - s0 )) s" | tee -a "$L/download.txt"
          got=$(shasum -a 256 "$F" | cut -d' ' -f1)
          echo "sha256 of the download: $got" | tee -a "$L/download.txt"
          test "$got" = "$SHA" && echo "SHA-256 matches the draft's SHA256SUMS" | tee -a "$L/download.txt"
          # The mark Safari leaves on a download (Chrome's is the same but for the agent name).
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)" "$F"
          echo "DMG=$F" >> "$GITHUB_ENV"

      - name: Install as a user does (open the dmg, Typd to Applications, the download mark kept)
        run: |
          set +e
          L="$RUNNER_TEMP/fr"
          {
            echo "dmg: $(xattr -p com.apple.quarantine "$DMG")"
            MNT=$(hdiutil attach -nobrowse -noautoopen "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -1)
            echo "mounted at: $MNT"; ls -la "$MNT"
            echo "Typd.app on the volume: $(xattr -p com.apple.quarantine "$MNT/Typd.app" 2>&1)"
            ditto "$MNT/Typd.app" /Applications/Typd.app
            q=$(xattr -p com.apple.quarantine /Applications/Typd.app 2>/dev/null || true)
            if [ -z "$q" ]; then
              echo "the copy carries no quarantine mark; giving it the dmg's, as a Finder drag from a quarantined image does"
              xattr -w com.apple.quarantine "$(xattr -p com.apple.quarantine "$DMG")" /Applications/Typd.app
            fi
            echo "/Applications/Typd.app: $(xattr -p com.apple.quarantine /Applications/Typd.app)"
            hdiutil detach "$MNT" -quiet || true
            defaults read /Applications/Typd.app/Contents/Info.plist CFBundleShortVersionString
            du -sh /Applications/Typd.app
            codesign -dv --verbose=2 /Applications/Typd.app 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Signature|Timestamp|CodeDirectory)'
            echo "--- spctl (Gatekeeper's assessment)"; spctl -a -vvv -t exec /Applications/Typd.app 2>&1
            echo "--- syspolicy_check distribution"; syspolicy_check distribution /Applications/Typd.app 2>&1 | head -20
          } 2>&1 | tee "$L/install.txt"

      - name: Open it as a stranger does (Gatekeeper)
        continue-on-error: true
        run: |
          set +e
          L="$RUNNER_TEMP/fr"; A="$RUNNER_TEMP/mac-alert"; UD="$HOME/Library/Application Support/typd"
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          shot() { screencapture -x "$L/shots/$1.png" 2>&1 | head -2; }
          {
            echo "--- double-click: open /Applications/Typd.app"
            to 30 open /Applications/Typd.app; echo "open exited $?"
            sleep 12
            echo "--- windows on screen"; "$A" windows | head -10
            echo "--- the alert (CoreServicesUIAgent)"; "$A" texts CoreServicesUIAgent | head -20
            shot 01-gatekeeper
            if pgrep -f '/Applications/Typd.app/Contents/MacOS/Typd' >/dev/null; then echo "Typd IS running: Gatekeeper let it through"; else echo "Typd is NOT running"; fi
            echo "--- syspolicyd / CoreServicesUIAgent"
            log show --last 2m --style compact --predicate 'process == "syspolicyd" OR process == "CoreServicesUIAgent"' 2>/dev/null | grep -iE 'typd|notari|malware|assess|evaluat' | cut -c1-260 | tail -20
            echo "--- the stranger clicks Done, then System Settings > Privacy & Security"
            "$A" press CoreServicesUIAgent Done
            sleep 2
            to 20 open "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension"; sleep 10
            "$A" texts "System Settings" | grep -iE 'typd|open anyway|blocked|allow applications|app store' | head -12
            echo "--- System Settings' buttons"; "$A" texts "System Settings" | grep -i '^button' | head -40 | tr '\n' ';'; echo
            shot 02-privacy-security
            osascript -e 'quit app "System Settings"' 2>/dev/null; sleep 2
            if pgrep -f '/Applications/Typd.app/Contents/MacOS/Typd' >/dev/null; then
              echo "Typd started anyway: quitting it and clearing what it wrote, so the first launch below starts clean"
              osascript -e 'quit app "Typd"'; sleep 5; pkill -f /Applications/Typd.app/; rm -rf "$UD"; tccutil reset All ai.typd.app
            fi
            test -e "$UD" && echo "a Typd profile exists" || echo "no Typd profile yet (clean)"
            echo "--- to go on (the page's Terminal line): xattr -dr com.apple.quarantine /Applications/Typd.app"
          } 2>&1 | tee "$L/gatekeeper.txt"
          xattr -dr com.apple.quarantine /Applications/Typd.app

      - name: First launch on a clean profile, watched
        continue-on-error: true
        run: |
          set +e
          L="$RUNNER_TEMP/fr"; A="$RUNNER_TEMP/mac-alert"; UD="$HOME/Library/Application Support/typd"
          OUT="$L/typd.out"; ERR="$L/typd.err"; REP="$L/app-update-report.json"
          shot() { screencapture -x "$L/shots/$1.png" 2>&1 | head -2; }
          test -e "$UD" && { echo "::warning::a Typd profile exists before the first launch"; ls -la "$UD"; }
          T0=$(date +%s); echo "$T0" > "$L/t0"
          el() { echo $(( $(date +%s) - T0 )); }
          stamp() {   # the new lines of $1, each with the seconds since launch, into $1.t
            local c=0 tot; [ -f "$1.n" ] && c=$(cat "$1.n")
            tot=$(wc -l < "$1" 2>/dev/null | tr -d ' '); [ -n "$tot" ] && [ "$tot" -gt "$c" ] || return 0
            sed -n "$((c+1)),${tot}p" "$1" | sed "s/^/[+$(el)s] /" >> "$1.t"; echo "$tot" > "$1.n"
          }
          # TYPD_DEBUG only adds log lines; TYPD_APP_UPDATE_REPORT only writes where the update check stands.
          open /Applications/Typd.app --env TYPD_DEBUG=1 --env "TYPD_APP_UPDATE_REPORT=$REP" --stdout "$OUT" --stderr "$ERR"
          shots=" 5 15 30 60 90 120 180 300 480 720 960 "
          ready=""; upd=""; mic=0; gone=""; held=0; clicked=0; lastp=-1
          part() { find "$UD/models" -type f -name '*.gguf' -exec stat -f %z {} + 2>/dev/null | awk '{s+=$1} END {print s+0}'; }
          for i in $(seq 1 1800); do
            sleep 1; stamp "$OUT"; stamp "$ERR"; e=$(el)
            if [ $((e / 20)) != $lastp ]; then lastp=$((e / 20)); echo "[+${e}s] model bytes on disk $(part); windows: $("$A" windows | head -5 | tr '\n' ';')" >> "$L/progress.txt"; fi
            # A modal window of Typd's (layer >= 8: an app-modal alert) fails the gate. Nobody clicks it: 0.2.11
            # must download and get ready without any click on Typd.
            if [ $held = 0 ] && "$A" windows | grep -qE '^window: Typd layer (8|[1-9][0-9])'; then
              held=$e; "$A" texts Typd > "$L/typd-dialog.txt" 2>&1; shot "typd-dialog-$(printf %04d "$e")s"
              echo "[+${e}s] FAIL a modal window of Typd's is up: $(grep -E '^(text|button):' "$L/typd-dialog.txt" | head -8 | tr '\n' ' ')" >> "$L/actions.txt"
              echo "[+${e}s] model bytes on disk: $(part)" >> "$L/actions.txt"
            fi
            case "$shots" in *" $e "*) shot "launch-$(printf %04d "$e")s"; "$A" windows | head -10 > "$L/windows-$e.txt"; "$A" texts Typd 2>&1 | head -80 > "$L/typd-ax-$e.txt";; esac
            if "$A" windows | grep -q '^window: UserNotificationCenter'; then
              "$A" texts UserNotificationCenter > "$L/alert.txt" 2>&1
              h=$(md5 -q "$L/alert.txt")
              if [ ! -e "$L/alert-$h.seen" ]; then
                touch "$L/alert-$h.seen"; cp "$L/alert.txt" "$L/alert-$e.txt"; shot "alert-$(printf %04d "$e")s"
                echo "[+${e}s] macOS alert: $(grep -E '^(text|button):' "$L/alert.txt" | head -6 | tr '\n' ' ')" >> "$L/actions.txt"
              fi
              if [ $mic = 0 ] && grep -qi microphone "$L/alert.txt"; then
                "$A" press UserNotificationCenter Allow >> "$L/actions.txt" 2>&1; mic=1
                echo "[+${e}s] pressed Allow on macOS's microphone prompt, as a person does" >> "$L/actions.txt"
              fi
            fi
            if [ -z "$ready" ] && grep -qE '\[typd:local\] model .* ready' "$OUT"; then ready=$e; shot "ready-$(printf %04d "$e")s"; fi
            if [ -z "$upd" ] && grep -qE '"state":"(current|none|updated)"' "$REP" 2>/dev/null; then upd=$e; fi
            if ! pgrep -f '/Applications/Typd.app/Contents/MacOS/Typd' >/dev/null; then gone=$e; echo "::error::Typd is not running at +${e}s"; break; fi
            if [ -n "$ready" ] && { [ -n "$upd" ] || [ $((e - ready)) -gt 360 ]; }; then break; fi
            # 0.2.10 stalled for good while its dialog was up: give up after 20 min without a ready model.
            if [ -z "$ready" ] && [ $e -gt 1200 ]; then break; fi
          done
          stamp "$OUT"; stamp "$ERR"
          { echo "ready=${ready}"; echo "modal_at=$( [ $held -gt 0 ] && echo $held )"; echo "gone=${gone}"; echo "typd_clicks=0"; } > "$L/gate.txt"
          f() { grep -m1 -E "$1" "$OUT.t" 2>/dev/null | sed -E 's/^\[\+([0-9]+)s\].*/\1/'; }
          {
            echo "seconds after launch: variant $(f '\[typd:models\] variant'), first download $(f '\[typd:models\] downloading'), verified $(f '\[typd:models\] verified .*every file'), switching $(f '\[typd:models\] switching to'), self-test $(f '\[typd:local\] self-test on'), ready ${ready:-never}, app-update checked ${upd:-never}, Typd gone ${gone:-no}"
            echo "--- what Typd logged (debug)"
            grep -E '\[typd:(models|model|local|app-update|share|permissions|walkthrough|life|cuda)\]' "$OUT.t" | grep -vE 'progress|%' | cut -c1-260 | head -90
            echo "--- stderr (first lines)"; head -20 "$ERR.t" 2>/dev/null | cut -c1-260
            echo "--- actions"; cat "$L/actions.txt" 2>/dev/null
            echo "--- Typd's dialog"; cat "$L/typd-dialog.txt" 2>/dev/null | head -20
            echo "--- progress"; cat "$L/progress.txt" 2>/dev/null | cut -c1-300
            echo "--- what Typd's windows said (Accessibility), at the screenshot times"
            for f in "$L"/typd-ax-*.txt; do [ -s "$f" ] && { echo "$(basename "$f"):"; grep -E '^(text|button):' "$f" | head -14 | cut -c1-200; }; done
          } 2>&1 | tee "$L/first-launch.txt"

      - name: The model server, the update check, sharing
        continue-on-error: true
        run: |
          set +e
          L="$RUNNER_TEMP/fr"; UD="$HOME/Library/Application Support/typd"
          {
            echo "--- health"; curl -s -m 5 -w '  HTTP %{http_code}\n' http://127.0.0.1:8737/health
            echo "--- /v1/models"; curl -s -m 5 http://127.0.0.1:8737/v1/models | cut -c1-500; echo
            echo "--- llama-server"; ps -axo pid,rss,etime,args | grep -E '[l]lama-server' | cut -c1-500
            echo "--- Typd processes"; ps -axo pid,rss,etime,comm | grep -E '[T]ypd' | cut -c1-160
            echo "--- app-update report"; cat "$L/app-update-report.json" 2>&1; echo
            echo "--- app-update state"; cat "$UD/app-update/state.json" 2>&1; echo
            echo "--- settings.json"; cat "$UD/settings.json" 2>&1; echo
            echo "--- models"; cat "$UD/models/current.json" 2>&1; echo; ls -la "$UD/models"/* 2>&1 | head -20; du -sh "$UD/models"/* 2>&1
            echo "--- profile"; find "$UD" -maxdepth 2 | sed "s#$UD#<userData>#" | head -60
            echo "--- share files"; ls -la "$UD"/share* "$UD"/queue* 2>&1 | head
            echo "--- life.log"; tail -80 "$UD/logs/life.log" 2>&1 | cut -c1-260
          } 2>&1 | tee "$L/state.txt"

      - name: One real dictation through the app's pipeline
        continue-on-error: true
        run: |
          set +e
          L="$RUNNER_TEMP/fr"; UD="$HOME/Library/Application Support/typd"; RES=/Applications/Typd.app/Contents/Resources
          curl -fsSL -o "$L/speech.wav" "$SPEECH_WAV"
          { echo "speech.wav sha256 $(shasum -a 256 "$L/speech.wav" | cut -d' ' -f1)"; afinfo "$L/speech.wav" | grep -E 'format|duration'; } | tee "$L/speech.txt"
          printf '%s' "$DICTATE_JS" > "$RUNNER_TEMP/dictate.js"
          env ELECTRON_RUN_AS_NODE=1 perl -e 'alarm shift; exec @ARGV' 900 /Applications/Typd.app/Contents/MacOS/Typd "$RUNNER_TEMP/dictate.js" "$RES/app.asar" "$UD" "$L/dictation.json" "$L/speech.wav" "$RES/app.asar/test/fixtures/dictation-3s.wav" 2>&1 | tee "$L/dictation.log"
          echo "exit ${PIPESTATUS[0]}"
          cat "$L/dictation.json" 2>/dev/null | head -60
          screencapture -x "$L/shots/after-dictation.png" 2>&1 | head -2
          echo "--- life.log after"; tail -15 "$UD/logs/life.log" 2>&1 | cut -c1-200

      - name: The walkthrough closed, the switches dialog as a sheet (informational)
        continue-on-error: true
        run: |
          set +e
          L="$RUNNER_TEMP/fr"; A="$RUNNER_TEMP/mac-alert"; OUT="$L/typd.out"
          {
            echo "--- a person closes the walkthrough (Skip)"
            "$A" click Typd Skip 2>&1
            for i in $(seq 1 20); do sleep 1; grep -q 'checked for the end of the walkthrough' "$OUT" && break; done
            sleep 3
            grep -E '\[typd:(permissions|sheet)\]' "$OUT" | tail -5 | cut -c1-260
            echo "--- windows"; "$A" windows | head -8
            echo "--- Typd's texts"; "$A" texts Typd 2>&1 | grep -E 'switches|Open System Settings|Not Now|Accessibility|Input Monitoring' | head -10 | cut -c1-200
            if grep -q 'checked for the end of the walkthrough' "$OUT"; then
              "$A" windows | grep -qE '^window: Typd layer (8|[1-9][0-9])' && echo "FAIL the switches dialog is modal" || echo "ok: no modal window of Typd's"
              "$A" texts Typd 2>&1 | grep -q 'Typd needs two switches turned on' && echo "ok: the switches dialog is on the Typd window, in the same words" || echo "(the dialog's text was not read)"
            else
              echo "(the click on Skip did not land: no check after the walkthrough)"
            fi
            screencapture -x "$L/shots/after-walkthrough.png" 2>&1 | head -2
          } 2>&1 | tee "$L/after-walkthrough.txt"

      - name: Keep the logs and screenshots in a draft release (maintainers only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          L="$RUNNER_TEMP/fr"; UD="$HOME/Library/Application Support/typd"
          mkdir -p "$L/profile"
          rsync -a --include='*/' --include='*.json' --include='*.log' --exclude='*' "$UD/" "$L/profile/" 2>/dev/null || true
          find "$UD" -type f -exec ls -l {} \; 2>/dev/null | sed "s#$UD#<userData>#" > "$L/profile-files.txt" || true
          for f in "$L"/shots/*.png; do if [ -e "$f" ]; then sips -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null 2>&1 && rm "$f"; fi; done
          tar czf "$RUNNER_TEMP/firstrun-mac.tar.gz" -C "$L" .
          ls -la "$RUNNER_TEMP/firstrun-mac.tar.gz"
          tag="firstrun-${GITHUB_RUN_ID}-mac"
          gh release create "$tag" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "First-run test ${GITHUB_RUN_ID}, macOS (logs only)" \
            --notes "Draft (maintainers only): logs and screenshots of a Typd build's first run (${{ inputs.mac_release }}) on a clean macos-15 runner. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$RUNNER_TEMP/firstrun-mac.tar.gz"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true

      - name: Quit Typd
        if: always()
        run: |
          osascript -e 'quit app "Typd"' 2>/dev/null || true; sleep 3
          pkill -f /Applications/Typd.app/ || true

      - name: 'Gate: no click on Typd, no modal window, the model ready'
        run: |
          L="$RUNNER_TEMP/fr"; cat "$L/gate.txt"; . "$L/gate.txt"
          grep -E '^seconds after launch' "$L/first-launch.txt"
          grep -m1 -E '\[typd:models\] variant' "$L/typd.out" | cut -c1-200
          fail=0
          [ -z "$modal_at" ] || { echo "::error::a modal window of Typd's was up at +${modal_at}s"; fail=1; }
          [ -n "$ready" ] || { echo "::error::the model never got ready with nobody clicking"; fail=1; }
          [ -z "$gone" ] || { echo "::error::Typd stopped at +${gone}s"; fail=1; }
          [ $fail = 0 ] && echo "PASS: no click on anything of Typd's, no modal window, the model ready at +${ready}s"
          exit $fail

  windows:
    if: github.repository == 'SameRainbows/typd-app' && inputs.os != 'mac'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write   # only for the draft release (the last step gets the token)
    defaults:
      run:
        shell: pwsh
    steps:
      - name: The machine
        run: |
          $ErrorActionPreference = 'Continue'
          $L ="$env:RUNNER_TEMP\fr"; New-Item -ItemType Directory -Force "$L\shots" | Out-Null
          & {
            $os = Get-CimInstance Win32_OperatingSystem; $cs = Get-CimInstance Win32_ComputerSystem
            "$($os.Caption) $($os.Version) build $($os.BuildNumber)"
            "memory: $([math]::Round($cs.TotalPhysicalMemory / 1MB)) MB, logical cpus: $($cs.NumberOfLogicalProcessors)"
            (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
            Get-CimInstance Win32_VideoController | ForEach-Object { "display adapter: $($_.Name)" }
            "SmartScreen (Explorer): $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' -ErrorAction SilentlyContinue).SmartScreenEnabled)"
            "SmartScreen (policy): $((Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' -ErrorAction SilentlyContinue).EnableSmartScreen)"
            "user: $(whoami); admin token: $(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
            "session: $((Get-Process -Id $PID).SessionId)"
            "Typd profile before install: $(Test-Path "$env:APPDATA\typd")"
          } *>&1 | Tee-Object -FilePath "$L\machine.txt"

      - name: Download the build from its draft release, check its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.win_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $L = "$env:RUNNER_TEMP\fr"; $D = "$env:RUNNER_TEMP\rel"; New-Item -ItemType Directory -Force $D | Out-Null
          if (-not $env:REL) { throw 'no win_release given' }
          gh release download $env:REL --repo $env:GITHUB_REPOSITORY --pattern SHA256SUMS --dir $D
          $line = Get-Content "$D\SHA256SUMS" | Where-Object { $_ -match 'Typd-Setup-[0-9.]+\.exe$' } | Select-Object -First 1
          $sha = ($line -split '\s+')[0]; $name = [regex]::Match($line, 'Typd-Setup-[0-9.]+\.exe').Value
          if (-not $sha -or -not $name) { throw 'no installer in SHA256SUMS' }
          $dl = Join-Path $HOME 'Downloads'; New-Item -ItemType Directory -Force $dl | Out-Null
          $f = Join-Path $dl $name
          & {
            "draft $env:REL holds $name, SHA-256 $sha"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            gh release download $env:REL --repo $env:GITHUB_REPOSITORY --pattern $name --dir $dl
            if ($LASTEXITCODE) { throw 'download failed' }
            "downloaded $((Get-Item $f).Length) bytes in $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s"
            $got = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "sha256 of the download: $got"
            if ($got -ne $sha) { throw 'SHA-256 does not match the draft' }
            'SHA-256 matches the draft''s SHA256SUMS'
            # The mark a browser leaves on a download (Mark of the Web).
            Set-Content -Path $f -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nReferrerUrl=$env:PAGE`r`nHostUrl=$env:PAGE$name"
            "Zone.Identifier: $((Get-Content -Path $f -Stream Zone.Identifier) -join ' | ')"
            $sig = Get-AuthenticodeSignature $f
            "Authenticode: $($sig.Status) ($($sig.StatusMessage)) signer: $($sig.SignerCertificate.Subject)"
            "VersionInfo: CompanyName '$((Get-Item $f).VersionInfo.CompanyName)', ProductVersion $((Get-Item $f).VersionInfo.ProductVersion)"
          } *>&1 | Tee-Object -FilePath "$L\download.txt"
          "INSTALLER=$f" >> $env:GITHUB_ENV

      - name: Install it silently, for this user only (no admin)
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          $L = "$env:RUNNER_TEMP\fr"
          . ([scriptblock]::Create($env:WIN_HELPERS_PS1))
          & {
            'try 1: the download as the browser left it (Mark of the Web, unsigned), /S'
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $j = Start-Job -ScriptBlock { param($f) (Start-Process -FilePath $f -ArgumentList '/S' -PassThru -Wait).ExitCode } -ArgumentList $env:INSTALLER
            if (Wait-Job $j -Timeout 120) {
              "installer exit code $(Receive-Job $j) after $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s"
            } else {
              'after 120 s the installer has not finished. On screen:'
              Shot 'install-held'
              [Wins]::List() | Where-Object { $_ -notmatch '^(explorer|TextInputHost|ShellExperienceHost|SearchHost|StartMenuExperienceHost) ' } | ForEach-Object { "  window: $_" }
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Typd|smartscreen|consent|rundll32|pwsh|powershell' } | ForEach-Object { "  process: $($_.Name) pid $($_.ProcessId) parent $($_.ParentProcessId) $($_.CommandLine)" }
              Get-WinEvent -LogName 'Microsoft-Windows-SmartScreen/Debug' -MaxEvents 10 -ErrorAction SilentlyContinue | ForEach-Object { "  smartscreen event $($_.Id): $($_.Message)" }
              Stop-Job $j; Remove-Job $j -Force
              Get-Process | Where-Object { $_.ProcessName -like 'Typd-Setup*' } | Stop-Process -Force
              'try 2: the mark taken off (Unblock-File: what "Run anyway" lets through), /S'
              Unblock-File $env:INSTALLER
              $sw.Restart()
              $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/S' -PassThru
              if (-not $p.WaitForExit(600000)) { 'installer still running after 10 min'; Shot 'install-held-2'; [Wins]::List() | ForEach-Object { "  window: $_" }; exit 1 }
              "installer exit code $($p.ExitCode) after $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s"
            }
          } *>&1 | Tee-Object -FilePath "$L\install.txt"

      - name: What the install left
        run: |
          $ErrorActionPreference = 'Continue'
          $L = "$env:RUNNER_TEMP\fr"
          & {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Typd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            "Typd.exe: $($exe.FullName) $((Get-Item $exe.FullName).VersionInfo.ProductVersion)"
            "installed size: $([math]::Round((Get-ChildItem $exe.DirectoryName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) MB"
            Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*Typd*' | ForEach-Object { "start menu: $($_.Name)" }
            "desktop shortcut: $(Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Typd.lnk'))"
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -like '*Typd*' | ForEach-Object { "uninstall entry $($_.PSChildName): $($_.DisplayName) $($_.DisplayVersion) at $($_.InstallLocation), publisher '$($_.Publisher)'"; "PUBLISHER=$($_.Publisher)" >> $env:GITHUB_ENV; "UNINSTALL_KEY=$($_.PSChildName)" >> $env:GITHUB_ENV }
            "Typd.exe CompanyName: '$((Get-Item $exe.FullName).VersionInfo.CompanyName)'"
            "Typd running after the silent install: $([bool](Get-Process Typd -ErrorAction SilentlyContinue))"
            "Typd profile after the install: $(Test-Path "$env:APPDATA\typd")"
            "TYPD_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          } *>&1 | Tee-Object -FilePath "$L\installed.txt"
          if (Get-Process Typd -ErrorAction SilentlyContinue) { 'the installer started Typd: stopping it and clearing its profile so the first launch below is clean'; Stop-Process -Name Typd -Force; Start-Sleep 3; Remove-Item -Recurse -Force "$env:APPDATA\typd" -ErrorAction SilentlyContinue }

      - name: First launch on a clean profile, watched; the server, the update check, sharing; one real dictation
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $L ="$env:RUNNER_TEMP\fr"; $UD = "$env:APPDATA\typd"; $OUT = "$L\typd.out"; $REP = "$L\app-update-report.json"
          . ([scriptblock]::Create($env:WIN_HELPERS_PS1))
          "profile before launch: $(Test-Path $UD)" | Tee-Object -FilePath "$L\first-launch.txt"
          # TYPD_DEBUG only adds log lines; TYPD_APP_UPDATE_REPORT only writes where the update check stands.
          $env:TYPD_DEBUG = '1'; $env:TYPD_APP_UPDATE_REPORT = $REP
          $t0 = Get-Date
          $p = Start-Process -FilePath $env:TYPD_EXE -RedirectStandardOutput $OUT -RedirectStandardError "$L\typd.err" -PassThru
          Remove-Item Env:TYPD_DEBUG, Env:TYPD_APP_UPDATE_REPORT
          function El { [int]((Get-Date) - $t0).TotalSeconds }
          $script:n = 0
          function Stamp { $lines = @(Get-Content $OUT -ErrorAction SilentlyContinue); if ($lines.Count -gt $script:n) { $e = El; $lines[$script:n..($lines.Count - 1)] | ForEach-Object { "[+${e}s] $_" } | Add-Content "$OUT.t"; $script:n = $lines.Count } }
          $shots = @(5, 15, 30, 60, 90, 120, 180, 300, 480, 720, 960); $si = 0; $ready = $null; $upd = $null; $gone = $null; $okAt = $null
          while ((El) -lt 1800) {
            Start-Sleep 1; Stamp; $e = El
            while ($si -lt $shots.Count -and $e -ge $shots[$si]) { Shot ('launch-{0:d4}s' -f $shots[$si]); [Wins]::List() | Where-Object { $_ -notmatch '^(explorer|TextInputHost|ShellExperienceHost|SearchHost|StartMenuExperienceHost) ' } | Set-Content "$L\windows-$($shots[$si]).txt"; $si++ }
            if (-not $ready -and (Select-String -Path $OUT -Pattern '\[typd:local\] model .* ready' -Quiet)) { $ready = $e; Shot ('ready-{0:d4}s' -f $e) }
            if (-not $upd -and (Test-Path $REP) -and (Select-String -Path $REP -Pattern '"state":"(current|none|updated)"' -Quiet)) { $upd = $e }
            if ($p.HasExited) { $gone = $e; "::error::Typd exited (code $($p.ExitCode)) at +${e}s"; break }
            # Typd waits for an OK to download (a connection it cannot call unmetered): a person reads the card
            # and clicks "Download now".
            if (-not $okAt -and $e -ge 20 -and (Select-String -Path $OUT -Pattern 'asking first' -Quiet)) {
              $okAt = $e; Shot ('ask-{0:d4}s' -f $e)
              "[+${e}s] Typd asks before downloading the model; $(Click-Named 'Download now')" | Add-Content "$L\actions.txt"
              Start-Sleep 3; Shot ('after-ok-{0:d4}s' -f (El))
            }
            if ($ready -and ($upd -or ($e - $ready) -gt 360)) { break }
          }
          Stamp
          function F($pat) { $l = Select-String -Path "$OUT.t" -Pattern $pat | Select-Object -First 1; if ($l) { [regex]::Match($l.Line, '^\[\+(\d+)s\]').Groups[1].Value } }
          & {
            "seconds after launch: variant $(F '\[typd:models\] variant'), first download $(F '\[typd:models\] downloading'), verified $(F '\[typd:models\] verified .*every file'), switching $(F '\[typd:models\] switching to'), self-test $(F '\[typd:local\] self-test on'), ready $(if ($ready) { $ready } else { 'never' }), app-update checked $(if ($upd) { $upd } else { 'never' }), Typd gone $(if ($gone) { $gone } else { 'no' })"
            '--- what Typd logged (debug)'
            Get-Content "$OUT.t" | Where-Object { $_ -match '\[typd:(models|model|local|app-update|share|permissions|walkthrough|life|cuda)\]' -and $_ -notmatch 'progress|%' } | Select-Object -First 90 | ForEach-Object { if ($_.Length -gt 260) { $_.Substring(0, 260) } else { $_ } }
            '--- stderr (first lines)'; Get-Content "$L\typd.err" -TotalCount 20 -ErrorAction SilentlyContinue
            '--- windows now'; [Wins]::List() | Where-Object { $_ -match '^(Typd|llama)' }
            '--- actions'; Get-Content "$L\actions.txt" -ErrorAction SilentlyContinue
          } *>&1 | Tee-Object -FilePath "$L\first-launch.txt" -Append
          & {
            '--- health'; try { $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:8737/health; "HTTP $($r.StatusCode) $($r.Content)" } catch { "health: $($_.Exception.Message)" }
            '--- /v1/models'; try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:8737/v1/models).Content } catch { $_.Exception.Message }
            '--- llama-server'; Get-CimInstance Win32_Process -Filter "Name='llama-server.exe'" | ForEach-Object { "pid $($_.ProcessId) ws $([math]::Round($_.WorkingSetSize / 1MB)) MB: $($_.CommandLine)" }
            '--- Typd processes'; Get-Process Typd -ErrorAction SilentlyContinue | ForEach-Object { "pid $($_.Id) ws $([math]::Round($_.WorkingSet64 / 1MB)) MB" }
            '--- app-update report'; Get-Content $REP -ErrorAction SilentlyContinue
            '--- app-update state'; Get-Content "$UD\app-update\state.json" -ErrorAction SilentlyContinue
            '--- settings.json'; Get-Content "$UD\settings.json" -ErrorAction SilentlyContinue
            '--- models'; Get-Content "$UD\models\current.json" -ErrorAction SilentlyContinue; Get-ChildItem "$UD\models" -Recurse -File | ForEach-Object { "$($_.FullName.Replace($UD, '<userData>')) $($_.Length)" }
            '--- profile'; Get-ChildItem $UD -Depth 1 | ForEach-Object { $_.FullName.Replace($UD, '<userData>') }
            '--- life.log'; Get-Content "$UD\logs\life.log" -Tail 80 -ErrorAction SilentlyContinue
          } *>&1 | Tee-Object -FilePath "$L\state.txt"
          # One real dictation, through the installed app's own code and the server it started.
          $res = Join-Path (Split-Path $env:TYPD_EXE) 'resources'
          curl.exe -fsSL -o "$L\speech.wav" $env:SPEECH_WAV
          "speech.wav sha256 $((Get-FileHash -Algorithm SHA256 "$L\speech.wav").Hash.ToLower()), $((Get-Item "$L\speech.wav").Length) bytes" | Tee-Object -FilePath "$L\speech.txt"
          Set-Content "$env:RUNNER_TEMP\dictate.js" $env:DICTATE_JS -NoNewline
          $env:ELECTRON_RUN_AS_NODE = '1'
          $argv = @("$env:RUNNER_TEMP\dictate.js", "$res\app.asar", $UD, "$L\dictation.json", "$L\speech.wav", "$res\app.asar\test\fixtures\dictation-3s.wav") | ForEach-Object { '"' + $_ + '"' }
          $d = Start-Process -FilePath $env:TYPD_EXE -ArgumentList ($argv -join ' ') -RedirectStandardOutput "$L\dictation.log" -RedirectStandardError "$L\dictation.err" -PassThru -NoNewWindow
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          if (-not $d.WaitForExit(900000)) { 'dictation script still running after 15 min'; Stop-Process -Id $d.Id -Force }
          "dictation script exit $($d.ExitCode)"
          Get-Content "$L\dictation.log", "$L\dictation.err" -ErrorAction SilentlyContinue
          Shot 'after-dictation'
          '--- life.log after'; Get-Content "$UD\logs\life.log" -Tail 15 -ErrorAction SilentlyContinue

      - name: Keep the logs and screenshots in a draft release (maintainers only)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          T=$(cygpath -u "$RUNNER_TEMP"); L="$T/fr"; UD="$(cygpath -u "$APPDATA")/typd"
          mkdir -p "$L/profile"
          (cd "$UD" 2>/dev/null && find . -type f \( -name '*.json' -o -name '*.log' \) -exec cp --parents {} "$L/profile/" \;) || true
          (cd "$UD" 2>/dev/null && find . -type f -exec ls -l {} \;) > "$L/profile-files.txt" 2>/dev/null || true
          tar --force-local -czf "$T/firstrun-win.tar.gz" -C "$L" .
          ls -la "$T/firstrun-win.tar.gz"
          tag="firstrun-${GITHUB_RUN_ID}-win"
          gh release create "$tag" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "First-run test ${GITHUB_RUN_ID}, Windows (logs only)" \
            --notes "Draft (maintainers only): logs and screenshots of a Typd build's first run (${{ inputs.win_release }}) on a clean windows-latest runner. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$T/firstrun-win.tar.gz"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true

      - name: Quit Typd
        if: always()
        run: |
          Get-Process Typd, llama-server -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: 'Gate: the publisher shows in Installed apps'
        run: |
          "uninstall key $env:UNINSTALL_KEY, publisher '$env:PUBLISHER', installed at $env:TYPD_EXE"
          if ($env:PUBLISHER -ne 'Mehmet Dedeler') { "::error::publisher is '$env:PUBLISHER'"; exit 1 }
          if ($env:TYPD_EXE -notlike "$env:LOCALAPPDATA\Programs\typd\Typd.exe") { "::error::installed at $env:TYPD_EXE"; exit 1 }
          'PASS: Publisher Mehmet Dedeler; installed per user in %LOCALAPPDATA%\Programs\typd'
