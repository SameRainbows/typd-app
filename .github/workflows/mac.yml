    # From the 8 GB Mac test (mem8gb), unchanged. Every second: llama-server / harness / hog RSS, the system's memory state; every 2 s llama-server's footprint.
    import json, os, re, subprocess, sys, time
    out, phasef, stopf, hogpidf = sys.argv[1:5]
    def sh(*a):
        try: return subprocess.run(a, capture_output=True, text=True, timeout=10).stdout
        except Exception: return ''
