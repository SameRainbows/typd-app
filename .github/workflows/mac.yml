# Diagnosis only (public branch mac-mic-diag): what macOS's privacy service (TCC) does when the
# PUBLISHED Typd 0.2.6 asks for the microphone at its first launch, on macOS 14, 15, 26 and 27.
#
# A Mac user on macOS 27 could not give Typd the microphone: Typd was not in Privacy & Security >
# Microphone. This downloads the public dmg (sha256 checked against the CI record), installs it in
# /Applications as a user would, launches it through LaunchServices on a fresh TCC state and records
# tccd's own log lines for the request: a prompt, or a policy refusal with no prompt and no record.
# The same app re-signed several ways is the comparison: ad hoc; Typd's certificate with the
# microphone entitlement (no hardened runtime); hardened runtime with and without it. It also reads
# the shipped icon.icns with Apple's iconutil and shows what iconutil itself writes.
#
# Started by hand only (gh workflow run mac.yml --ref mac-mic-diag). Builds nothing, publishes
# nothing, uploads nothing. Only the signing step gets the certificate secrets; its keychain is
# deleted at the end.

name: macOS

on:
  workflow_dispatch:
    inputs:
      wait:
        description: Seconds to watch each launch
        type: string
        default: '25'

permissions:
  contents: read

jobs:
  mic:
    if: github.repository == 'SameRainbows/typd-app'
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DMG_URL: https://typd-collect.mehmetdedeler.com/download/Typd-0.2.6-mac-arm64.dmg
      DMG_SHA256: 7f1da973c286cf8053ce6126954f27b3f9f383da24fcd86ca695a68a566ccbeb
      WAIT: ${{ inputs.wait || '25' }}
    steps:
      - name: Check out this commit (plain git, no token)
        run: |
          set -e
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='%H %s'

      - name: Node.js 24 (nodejs.org, sha256 pinned)
        env:
          NODE_VERSION: v24.22.0
          NODE_SHA256: 6a9724d9b50a5f22b4816cded441b5a8d9ddae546191a5e5b7efa5a5e2ee26d5   # node-v24.22.0-darwin-arm64.tar.gz
        run: |
          set -e
          f="node-$NODE_VERSION-darwin-arm64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://nodejs.org/dist/$NODE_VERSION/$f"
          echo "$NODE_SHA256  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-$NODE_VERSION-darwin-arm64/bin" >> "$GITHUB_PATH"

      - name: The machine
        run: |
          set +e +o pipefail
          sw_vers; uname -a; csrutil status || true; id
          ls -la "$HOME/Library/Application Support/com.apple.TCC/" 2>&1 || true
          sudo find /private/var/containers/Data/ProtectedSystem -name 'TCC.db' 2>/dev/null | head || true
          tccutil --help 2>&1 | head -20 || true

      - name: The published 0.2.6 dmg (sha256 checked), installed in /Applications
        run: |
          set -e
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/Typd.dmg" "$DMG_URL"
          echo "$DMG_SHA256  $RUNNER_TEMP/Typd.dmg" | shasum -a 256 -c -
          mnt="$RUNNER_TEMP/dmg"; mkdir -p "$mnt"
          hdiutil attach "$RUNNER_TEMP/Typd.dmg" -nobrowse -readonly -mountpoint "$mnt"
          ditto "$mnt/Typd.app" /Applications/Typd.app
          hdiutil detach "$mnt"
          ditto /Applications/Typd.app "$RUNNER_TEMP/shipped/Typd.app"
          xattr -lr /Applications/Typd.app | head -5 || true

      - name: The shipped app's signature, entitlements, flags, Info.plists
        run: |
          set +e +o pipefail
          APP=/Applications/Typd.app
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -3
          codesign -dvvv "$APP" 2>&1 | grep -vE '^(Sealed|Page size|CDHash|Hash type|Internal)'
          echo "--- entitlements (main)"; codesign -d --entitlements - --xml "$APP" 2>&1; echo
          for h in "$APP"/Contents/Frameworks/*.app; do
            echo "--- $(basename "$h"): $(codesign -dv "$h" 2>&1 | grep -E '^(CodeDirectory|Runtime)' | tr '\n' ' ')"
            codesign -d --entitlements - --xml "$h" 2>&1 | head -c 400; echo
            plutil -extract NSMicrophoneUsageDescription raw -o - "$h/Contents/Info.plist" 2>&1 | head -1
          done
          echo "--- designated"; codesign -d -r- "$APP" 2>&1 | grep designated
          echo "--- main Info.plist usage keys"; plutil -p "$APP/Contents/Info.plist" | grep -E 'Usage|CFBundleIdentifier|LSUIElement|CFBundleIcon'
          spctl --assess --type execute -vv "$APP" 2>&1 || true

      - name: The shipped icon.icns, read by Apple's iconutil; what iconutil writes itself
        run: |
          set +e +o pipefail
          APP=/Applications/Typd.app
          cat > "$RUNNER_TEMP/icns.py" <<'EOF'
          import struct, sys
          b = open(sys.argv[1], 'rb').read(); o = 8
          while o < len(b):
              t, l = b[o:o+4].decode('latin1'), struct.unpack('>I', b[o+4:o+8])[0]
              d = b[o+8:o+l]
              kind = 'png %dx%d' % struct.unpack('>II', d[16:24]) if d[:4] == b'\x89PNG' else ('ARGB' if d[:4] == b'ARGB' else 'raw %d B' % len(d))
              print('  %s %7d %s' % (t, l, kind)); o += l
          EOF
          echo "--- shipped icon.icns entries"; python3 "$RUNNER_TEMP/icns.py" "$APP/Contents/Resources/icon.icns"
          rm -rf "$RUNNER_TEMP/shipped.iconset"
          iconutil -c iconset "$APP/Contents/Resources/icon.icns" -o "$RUNNER_TEMP/shipped.iconset" 2>&1 || echo "iconutil could not read it"
          for f in "$RUNNER_TEMP/shipped.iconset"/*.png; do [ -e "$f" ] && echo "  $(basename "$f"): $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}')"; done
          echo "--- an iconset made from assets/typd.png with sips, then iconutil -c icns"
          s="$RUNNER_TEMP/typd.iconset"; mkdir -p "$s"
          for n in 16 32 128 256 512; do
            sips -z $n $n assets/typd.png --out "$s/icon_${n}x${n}.png" >/dev/null
            sips -z $((n*2)) $((n*2)) assets/typd.png --out "$s/icon_${n}x${n}@2x.png" >/dev/null
          done
          iconutil -c icns "$s" -o "$RUNNER_TEMP/typd.icns"
          python3 "$RUNNER_TEMP/icns.py" "$RUNNER_TEMP/typd.icns"
          shasum -a 256 "$RUNNER_TEMP/typd.icns"

      - name: Dependencies and the dictation model (for a real dictation attempt)
        run: |
          set -e
          npm ci
          node scripts/fetch-model.js --accept-license | tail -3

      - name: Round 4 -- run from ~/Downloads first, then moved to /Applications (a stale LaunchServices entry)
        env:
          TYPD_MODEL_DIR: ${{ github.workspace }}/models/typd-dictate
        run: |
          set +e +o pipefail
          cat > "$RUNNER_TEMP/ax.swift" <<'EOF2'
          import Cocoa
          import ApplicationServices
          // ax <process name> [press <button title>]: the process's windows, texts and buttons, through Accessibility.
          let args = CommandLine.arguments
          print("  AX trusted: \(AXIsProcessTrusted())")
          func attr(_ e: AXUIElement, _ n: String) -> String {
            var v: CFTypeRef?
            guard AXUIElementCopyAttributeValue(e, n as CFString, &v) == .success, let x = v else { return "" }
            return (x as? String) ?? ""
          }
          var pressed = false
          func walk(_ e: AXUIElement, _ d: Int) {
            let role = attr(e, kAXRoleAttribute), title = attr(e, kAXTitleAttribute), value = attr(e, kAXValueAttribute), desc = attr(e, kAXDescriptionAttribute)
            if !(title.isEmpty && value.isEmpty && desc.isEmpty) || role == "AXWindow" || role == "AXButton" {
              print("  " + String(repeating: "  ", count: d) + "\(role) title=\"\(title)\" value=\"\(value)\" desc=\"\(desc)\"")
            }
            if args.count >= 4, args[2] == "press", role == "AXButton", title.replacingOccurrences(of: "\u{2019}", with: "'") == args[3], !pressed {
              let r = AXUIElementPerformAction(e, kAXPressAction as CFString); pressed = true; print("  pressed \"\(title)\": \(r.rawValue)")
            }
            var k: CFTypeRef?
            if d < 10, AXUIElementCopyAttributeValue(e, kAXChildrenAttribute as CFString, &k) == .success, let kids = k as? [AXUIElement] { for c in kids { walk(c, d + 1) } }
          }
          let apps = NSWorkspace.shared.runningApplications.filter { $0.localizedName == args[1] || $0.bundleIdentifier == args[1] || ($0.executableURL?.lastPathComponent ?? "") == args[1] }
          if apps.isEmpty { print("  no process \(args[1])") }
          for a in apps { print("  process \(a.localizedName ?? "?") pid \(a.processIdentifier)"); walk(AXUIElementCreateApplication(a.processIdentifier), 0) }
          EOF2
          swiftc -O "$RUNNER_TEMP/ax.swift" -o "$RUNNER_TEMP/ax" 2>&1 | tail -3
          cat > "$RUNNER_TEMP/wins.swift" <<'EOF2'
          import CoreGraphics
          import Foundation
          let skip = ["Window Server", "Dock", "Control Center", "SystemUIServer", "Wallpaper", "Notification Center", "Spotlight", "TextInputMenuAgent"]
          let list = (CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]]) ?? []
          for w in list {
            let owner = w[kCGWindowOwnerName as String] as? String ?? "?"
            let layer = w[kCGWindowLayer as String] as? Int ?? 0
            let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
            if layer >= 0 && layer < 25 && !skip.contains(owner) { print("  window (front first): \(owner) layer \(layer) \(b["Width"] ?? 0)x\(b["Height"] ?? 0) at \(b["X"] ?? 0),\(b["Y"] ?? 0)") }
          }
          EOF2
          swiftc -O "$RUNNER_TEMP/wins.swift" -o "$RUNNER_TEMP/wins" 2>&1 | tail -3
          swiftc -O scripts/mac-ui.swift -o "$RUNNER_TEMP/mac-ui" 2>&1 | tail -3
          NEWDB=$(sudo find /private/var/containers/Data/ProtectedSystem -name 'TCC.db' -path '*com.apple.TCC*' 2>/dev/null)
          rows() {
            for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" $NEWDB; do
              sudo test -f "$db" || continue
              r=$(sudo sqlite3 "$db" "SELECT service||' auth_value='||auth_value||' reason='||auth_reason FROM access WHERE client LIKE 'ai.typd%';" 2>&1 | tr '\n' ';')
              echo "  user TCC.db $(echo "$db" | sed 's#.*/ProtectedSystem/\(........\).*#<ProtectedSystem>/\1#'): ${r:-no rows for ai.typd.app}"
            done
          }
          shot() {   # shot <name>: a screenshot, printed as base64 JPEG between markers
            screencapture -x "$RUNNER_TEMP/$1.png" 2>&1 | head -2
            sips -s format jpeg -s formatOptions 50 --resampleWidth 1000 "$RUNNER_TEMP/$1.png" --out "$RUNNER_TEMP/$1.jpg" >/dev/null 2>&1
            echo "SHOT-BEGIN $1"; base64 -i "$RUNNER_TEMP/$1.jpg" | fold -w 900; echo "SHOT-END $1"
          }
          look() { echo "  -- $1"; "$RUNNER_TEMP/wins" | head -12; "$RUNNER_TEMP/ax" UserNotificationCenter | head -30; }
          mics() { echo "  -- tccd lines about the microphone ($1)"; grep -iE 'Microphone' "$RUNNER_TEMP/tcc2.log" | cut -c1-360 | tail -n "${2:-25}"; }
          fresh() {
            pkill -f /Applications/Typd.app/Contents/MacOS/Typd; sleep 2
            killall UserNotificationCenter 2>/dev/null; sleep 1
            tccutil reset Microphone ai.typd.app >/dev/null 2>&1; tccutil reset All ai.typd.app >/dev/null 2>&1
            rm -rf "$HOME/Library/Application Support/typd"
          }
          launch() {   # launch <out> [walk]: as Finder starts it; the walkthrough on with "walk"
            set -- "$1" "${2:-}"
            extra="--env TYPD_NO_WALKTHROUGH=1"; [ "$2" = walk ] && extra=""
            # shellcheck disable=SC2086
            open /Applications/Typd.app --env TYPD_DEBUG=1 --env TYPD_NO_MODEL_UPDATE=1 --env TYPD_NO_APP_UPDATE=1 --env TYPD_NO_SHARE=1 --env "TYPD_MODEL_DIR=$TYPD_MODEL_DIR" $extra --stdout "$1" --stderr "$1.err"
          }
          ditto "$RUNNER_TEMP/shipped/Typd.app" "$RUNNER_TEMP/clean/Typd.app"
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # to <seconds> <cmd...>: never hang the step
          tcc() { echo "  -- tccd ($1)"; grep -aE 'kTCCServiceMicrophone|_CFBundleCreateUnique|CFBundle.*failed|ai\.typd\.app' "$RUNNER_TEMP/tcc4.log" | grep -aE 'AUTHREQ_PROMPTING|AUTHREQ_RESULT|Handling access request to kTCCServiceMicrophone|_CFBundleCreateUnique|failed|disallow|Refus' | cut -c1-300 | tail -n 12; : > "$RUNNER_TEMP/tcc4.log"; }
          ls_paths() { echo "  -- LaunchServices knows ai.typd.app at:"; to 60 "$LSREG" -dump 2>/dev/null | grep -aE '^(path|identifier):' | grep -aB1 'ai\.typd\.app$' | grep -a '^path' | sed 's/^/    /' | sort -u | head; }
          typd_lines() { grep -ahE '^\[typd:(permissions|life)\].*(microphone|off for|launch)' "$1" "$1.err" 2>/dev/null | head -6 | sed 's/^/  /'; }
          stop_all() { pkill -f '/Typd.app/Contents/MacOS/Typd'; sleep 2; killall UserNotificationCenter 2>/dev/null; sleep 1; }
          go() {   # go <app> <out>
            rm -rf "$HOME/Library/Application Support/typd"
            to 20 open "$1" --env TYPD_DEBUG=1 --env TYPD_NO_MODEL_UPDATE=1 --env TYPD_NO_APP_UPDATE=1 --env TYPD_NO_SHARE=1 --env TYPD_NO_WALKTHROUGH=1 --stdout "$2" --stderr "$2.err" || echo "  open did not return (exit $?)"
            sleep 10
            "$RUNNER_TEMP/wins" | grep -E 'UserNotificationCenter|CoreServicesUIAgent|Typd' | head -4
            "$RUNNER_TEMP/ax" UserNotificationCenter | grep -E 'AXStaticText' | head -1
          }
          sudo log stream --level debug --style compact --predicate 'subsystem == "com.apple.TCC" OR process == "tccd"' > "$RUNNER_TEMP/tcc4.log" 2>&1 &
          lp=$!
          stop_all; rm -rf /Applications/Typd.app "$HOME/Downloads/Typd.app"; tccutil reset Microphone ai.typd.app >/dev/null
          echo "=================== D1. first run from ~/Downloads (prompt left unanswered), then moved to /Applications, reset, opened from there"
          ditto "$RUNNER_TEMP/clean/Typd.app" "$HOME/Downloads/Typd.app"
          go "$HOME/Downloads/Typd.app" "$RUNNER_TEMP/d1a.out"; tcc "run from Downloads"; typd_lines "$RUNNER_TEMP/d1a.out"
          stop_all
          mv "$HOME/Downloads/Typd.app" /Applications/Typd.app
          tccutil reset Microphone ai.typd.app
          ls_paths
          go /Applications/Typd.app "$RUNNER_TEMP/d1b.out"; tcc "moved, reset, opened from /Applications"; typd_lines "$RUNNER_TEMP/d1b.out"
          echo "=================== D2. first run from ~/Downloads, answered Don't Allow, then that copy deleted and a fresh one installed in /Applications"
          stop_all; rm -rf /Applications/Typd.app; tccutil reset Microphone ai.typd.app >/dev/null
          ditto "$RUNNER_TEMP/clean/Typd.app" "$HOME/Downloads/Typd.app"
          go "$HOME/Downloads/Typd.app" "$RUNNER_TEMP/d2a.out"
          "$RUNNER_TEMP/ax" UserNotificationCenter press "Don't Allow" | grep -E 'pressed|no process'
          sleep 3; tcc "Downloads copy, Don't Allow"; typd_lines "$RUNNER_TEMP/d2a.out"
          stop_all
          rm -rf "$HOME/Downloads/Typd.app"
          ditto "$RUNNER_TEMP/clean/Typd.app" /Applications/Typd.app
          ls_paths
          go /Applications/Typd.app "$RUNNER_TEMP/d2b.out"; tcc "Downloads copy deleted, the /Applications copy opened (no reset)"; typd_lines "$RUNNER_TEMP/d2b.out"
          stop_all
          tccutil reset Microphone ai.typd.app
          go /Applications/Typd.app "$RUNNER_TEMP/d2c.out"; tcc "...after tccutil reset"; typd_lines "$RUNNER_TEMP/d2c.out"
          echo "=================== D3. the coordinator's fix: lsregister -u the old copy, lsregister -f /Applications, reset, open"
          stop_all
          to 30 "$LSREG" -u "$HOME/Downloads/Typd.app" 2>&1 | head -2
          to 30 "$LSREG" -f /Applications/Typd.app 2>&1 | head -2
          tccutil reset Microphone ai.typd.app
          ls_paths
          go /Applications/Typd.app "$RUNNER_TEMP/d3.out"; tcc "after lsregister -u/-f + reset"; typd_lines "$RUNNER_TEMP/d3.out"
          stop_all
          sudo kill $lp; true

      - name: Remove the signing keychain
        if: always()
        run: bash scripts/mac-signing-import.sh --delete
