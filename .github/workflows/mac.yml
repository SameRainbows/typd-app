        lora = next(iter(sorted(kit.glob("lora_v3*.gguf"))), None)
        tpl = kit / "chat_template.jinja" if (kit / "chat_template.jinja").exists() else None
        gemma4 = "gemma-4" in a.model_file.lower() and tpl is not None
