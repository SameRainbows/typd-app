    #!/bin/bash
    # The results job: this run's results folder (on this Mac, in the typdworker account) -> a DRAFT release of this
    # private repository (only people with write access can see a draft), then the local copy is deleted.
    #   publish.sh TAG_PREFIX TITLE
    set -u
    J=$(cd "$(dirname "$0")" && pwd)
    . "$J/lib.sh"
    R=$(results_dir)
    [ -d "$R" ] || { note "no results folder $R (the job made none)"; exit 1; }
    tag="$1-${GITHUB_RUN_ID}"
    body=$(mktemp)
    { echo "$2 - run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; echo
      [ -f "$R/summary.md" ] && cat "$R/summary.md"
      [ -f "$R/label_stats.json" ] && { echo '```'; cat "$R/label_stats.json"; echo '```'; }
      [ -f "$R/teacher_stats.json" ] && { echo '```'; cat "$R/teacher_stats.json"; echo '```'; }
    } > "$body"
    tar czf "$HOME/typd-results/$tag.tar.gz" -C "$R" .
    ls -la "$HOME/typd-results/$tag.tar.gz"
    draft_release "$tag" "$2 ($GITHUB_RUN_ID)" "$body" "$HOME/typd-results/$tag.tar.gz" || { note "could not create the draft release"; exit 1; }
    note "draft release $tag created"
    rm -rf "$R" "$HOME/typd-results/$tag.tar.gz" "$body"
  F_JOBS_TEACHER_SH: |
    #!/bin/bash
    # Job (c) on the Mac worker: P2d's finished text for Phase 1 clips (distillation targets for the 0.6B student).
    # Public-corpus audio in (Emilia, NaturalVoices, YODAS2, Localized Narratives), text out; never anyone's recordings.
    #   teacher.sh fetch SHARD          the shard (FLACs + manifest) from this private repo's prerelease teacher-in-SHARD
    #   teacher.sh run SHARD [SLOTS]    P2d on the shipped app's llama.cpp (Metal); resumable (teacher.py)
    # The model: the full model through the app's own updater (public route, signed manifest: p2d_1p7b), cached; or,
    # with MODEL_RELEASE=<tag>, a private release holding model.json ({"model": ..., "mmproj": ...}) and those two files.
    set -u
    J=$(cd "$(dirname "$0")" && pwd)
    . "$J/lib.sh"
    W=$HOME/typd-work/teacher
    case ${1:-} in
      fetch)
        shard=$2
        rm -rf "$W/$shard/in"; mkdir -p "$W/$shard/in"   # outputs of an earlier run of this shard stay: it resumes
        release_get "teacher-in-$shard" "teacher-in-$shard.tar" "$W/$shard/in.tar" || exit 1
        tar xf "$W/$shard/in.tar" -C "$W/$shard/in" && rm -f "$W/$shard/in.tar"
        note "shard $shard: $(wc -l < "$W/$shard/in/manifest.jsonl" | tr -d ' ') clips, $(du -sh "$W/$shard/in" | cut -f1)"
        ;;
      run)
        shard=$2 slots=${3:-4}
        R=$(results_dir); mkdir -p "$R/out"
        T=$(mktemp -d "${TMPDIR:-/tmp}/typd-teacher.XXXXXX")
        trap 'rm -rf "$T"' EXIT
        ensure_uv || exit 1
        ensure_app "$T" | tee -a "$R/app.txt"; [ -x "$T/Typd.app/Contents/MacOS/Typd" ] || exit 1
        APP=$T/Typd.app/Contents/MacOS/Typd; export APP_ASAR=$T/Typd.app/Contents/Resources/app.asar
        LLAMA_SERVER=$T/Typd.app/Contents/Resources/llama/llama-server
        if [ -n "${MODEL_RELEASE:-}" ]; then
          MD=$CACHE/teacher-models/$MODEL_RELEASE
          if [ ! -f "$MD/.ok" ]; then
            mkdir -p "$MD"; release_get "$MODEL_RELEASE" model.json "$MD/model.json" || exit 1
            for k in model mmproj; do f=$(jq -r ".$k" "$MD/model.json"); release_get "$MODEL_RELEASE" "$f" "$MD/$f" || exit 1; done
            touch "$MD/.ok"
          fi
        else
          MD=$(ensure_model "${TEACHER_VARIANT:-full}" "$R/fetch-model.log") || exit 1
        fi
        MD=${MD%/}
        { echo "model folder: $MD"; cat "$MD/model.json"; } | tee -a "$R/app.txt"
        py --with soundfile==0.14.0 --with numpy==2.4.6 python -I "$J/teacher.py" --in "$W/$shard/in" --out "$W/$shard/out" \
          --model "$MD/$(jq -r .model "$MD/model.json")" --mmproj "$MD/$(jq -r .mmproj "$MD/model.json")" \
          --server "$LLAMA_SERVER" --slots "$slots" ${TEACHER_ARGS:-}
        rc=$?
        cp -R "$W/$shard/out" "$R/"
        for f in teacher_stats.json teacher_server.log summary.md; do [ -f "$W/$shard/$f" ] && mv -f "$W/$shard/$f" "$R/"; done
        exit $rc
        ;;
      *) sed -n '2,7p' "$0"; exit 64;;
    esac
  F_JOBS_TEACHER_PY: |
    """Job (c): P2d writes its finished text for Phase 1 clips, the distillation targets for the 0.6B student.
    The request is eval/local_eval.py's (the research PC's own decode): no system prompt, the clip as WAV, the assistant
    prefilled with "language English<asr_text>", temperature 0, up to 1024 tokens; llama-server is the one inside the
    shipped Typd app (its llama.cpp with Typd's patches), on Metal, on 127.0.0.1 only. Audio in, text out.

        teacher.py --in SHARD_DIR --out OUT_DIR --model GGUF --mmproj GGUF --server LLAMA_SERVER [--slots 4]

    SHARD_DIR: manifest.jsonl ({id, source, duration_s, audio: "audio/<id>.flac"}) and the FLACs (16 kHz mono).
    OUT_DIR/teacher.jsonl: {id, source, duration_s, teacher, lang, model, ms, out_tok}; resumable (ids already written are
    skipped). OUT_DIR/../teacher_stats.json: throughput (clips/h, audio hours per hour) and the estimate for all of
    Phase 1 (92,085 clips, 581.4 h in data/author/inputs_p1/_index.json).
    """
    import argparse, base64, hashlib, io, json, os, re, socket, subprocess, sys, threading, time, urllib.request
    from concurrent.futures import ThreadPoolExecutor
    from pathlib import Path

    import soundfile as sf

    T0 = time.time()
    PHASE1_CLIPS, PHASE1_HOURS = 92085, 581.4


    def say(*a):
        print(time.strftime("%H:%M:%S") + f" [{time.time() - T0:6.0f}s] " + " ".join(str(x) for x in a), flush=True)


    def wav_b64(path):
        w, sr = sf.read(path, dtype="float32")
        if sr != 16000:
            raise ValueError(f"{path}: {sr} Hz, want 16000")
        buf = io.BytesIO()
        sf.write(buf, w, 16000, format="WAV", subtype="PCM_16")
        return base64.b64encode(buf.getvalue()).decode(), len(w) / 16000


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--in", dest="inp", required=True)
        ap.add_argument("--out", required=True)
        ap.add_argument("--model", required=True)
        ap.add_argument("--mmproj", required=True)
        ap.add_argument("--server", required=True)
        ap.add_argument("--slots", type=int, default=4)
        ap.add_argument("--ctx", type=int, default=4096, help="per slot")
        ap.add_argument("--prefill", default="language English<asr_text>")
        ap.add_argument("--max-tokens", type=int, default=1024)
        ap.add_argument("--limit", type=int, default=0)
        a = ap.parse_args()
        inp, out = Path(a.inp), Path(a.out)
        out.mkdir(parents=True, exist_ok=True)
        rows = [json.loads(l) for l in open(inp / "manifest.jsonl", encoding="utf-8") if l.strip()]
        dst = out / "teacher.jsonl"
        done = set()
        if dst.exists():
            for l in open(dst, encoding="utf-8"):
                try:
                    done.add(json.loads(l)["id"])
                except ValueError:
                    pass   # a torn last line from a stopped run
        todo = [r for r in rows if r["id"] not in done]
        if a.limit:
            todo = todo[: a.limit]
        model_id = Path(a.model).name
        say(f"{len(rows)} clips in the shard, {len(done)} already written, {len(todo)} to do; model {model_id}")
        with socket.socket() as s:
            s.bind(("127.0.0.1", 0))
            port = s.getsockname()[1]
        args = [a.server, "-m", a.model, "--mmproj", a.mmproj, "--host", "127.0.0.1", "--port", str(port), "-ngl", "99",
                "-c", str(a.ctx * a.slots), "-np", str(a.slots), "--cache-ram", "0", "--no-webui"]
        say("server:", " ".join(Path(x).name if "/" in x else x for x in args[1:]))
        logf = open(out.parent / "teacher_server.log", "a")
        p = subprocess.Popen(args, stdout=logf, stderr=subprocess.STDOUT, cwd=str(Path(a.server).parent))
        base = f"http://127.0.0.1:{port}"
        t = time.time()
        while True:
            if p.poll() is not None:
                sys.exit(f"llama-server exited ({p.returncode}); see teacher_server.log")
            try:
                if urllib.request.urlopen(base + "/health", timeout=3).status == 200:
                    break
            except Exception:   # noqa: BLE001 - loading
                pass
            if time.time() - t > 600:
                p.kill()
                sys.exit("llama-server not ready in 10 min")
            time.sleep(1)
        say(f"server ready after {time.time() - t:.0f} s")
        lock = threading.Lock()
        stats = {"clips": 0, "audio_s": 0.0, "fail": 0, "out_tok": 0}

        def one(r):
            b64, dur = wav_b64(inp / r["audio"])
            msgs = [{"role": "system", "content": r.get("system", "")},
                    {"role": "user", "content": [{"type": "input_audio", "input_audio": {"data": b64, "format": "wav"}}]}]
            if a.prefill:
                msgs.append({"role": "assistant", "content": a.prefill})
            body = json.dumps({"messages": msgs, "temperature": 0, "max_tokens": a.max_tokens}).encode()
            t1 = time.time()
            o = json.loads(urllib.request.urlopen(urllib.request.Request(base + "/v1/chat/completions", body, {"Content-Type": "application/json"}),
                                                  timeout=600).read())
            raw = o["choices"][0]["message"]["content"] or ""
            lang = re.match(r"^\s*language (\w+)<asr_text>", raw)
            text = re.sub(r"^\s*language \w+<asr_text>", "", raw).strip()
            row = {"id": r["id"], "source": r.get("source"), "duration_s": round(dur, 3), "teacher": text,
                   "lang": lang.group(1) if lang else ("English" if a.prefill.startswith("language English") else None),
                   "model": model_id, "ms": round((time.time() - t1) * 1000), "out_tok": (o.get("usage") or {}).get("completion_tokens"),
                   "finish": o["choices"][0].get("finish_reason")}
            return row, dur

        t_start = time.time()
        with open(dst, "a", encoding="utf-8") as f, ThreadPoolExecutor(a.slots) as ex:
            futs = [ex.submit(one, r) for r in todo]
            for k, fu in enumerate(futs, 1):
                try:
                    row, dur = fu.result()
                except Exception as e:   # noqa: BLE001 - one bad clip must not stop the shard
                    stats["fail"] += 1
                    say("clip failed:", todo[k - 1]["id"], repr(e)[:200])
                    continue
                with lock:
                    f.write(json.dumps(row, ensure_ascii=False) + "\n")
                    f.flush()
                    stats["clips"] += 1; stats["audio_s"] += dur; stats["out_tok"] += row["out_tok"] or 0
                if k % 50 == 0 or k == len(futs):
                    el = time.time() - t_start
                    say(f"{k}/{len(futs)} clips, {stats['audio_s'] / 3600:.2f} h of audio in {el / 60:.1f} min "
                        f"= {stats['audio_s'] / max(el, 1):.1f}x real time, {stats['clips'] / max(el, 1) * 3600:.0f} clips/h")
        el = time.time() - t_start
        p.terminate()
        try:
            p.wait(20)
        except subprocess.TimeoutExpired:
            p.kill()
        rtfx = stats["audio_s"] / max(el, 1e-9) if stats["clips"] else 0
        cph = stats["clips"] / max(el, 1e-9) * 3600 if stats["clips"] else 0
        st = {"shard_clips": len(rows), "written_now": stats["clips"], "failed_now": stats["fail"], "written_total": len(done) + stats["clips"],
              "audio_hours_now": round(stats["audio_s"] / 3600, 3), "wall_minutes": round(el / 60, 1), "slots": a.slots,
              "x_real_time": round(rtfx, 1), "clips_per_hour": round(cph), "out_tok_per_s": round(stats["out_tok"] / max(el, 1e-9), 1),
              "model": model_id, "prefill": a.prefill,
              "estimate_all_phase1_hours_by_audio": round(PHASE1_HOURS / rtfx, 1) if rtfx else None,
              "estimate_all_phase1_hours_by_clips": round(PHASE1_CLIPS / cph, 1) if cph else None,
              "machine": subprocess.run(["sysctl", "-n", "machdep.cpu.brand_string", "hw.memsize"], capture_output=True, text=True).stdout.split("\n")[:2]}
        (out.parent / "teacher_stats.json").write_text(json.dumps(st, indent=1), encoding="utf-8")
        with open(out.parent / "summary.md", "a", encoding="utf-8") as f:
            f.write(f"P2d teacher outputs: {st['written_now']} clips now ({st['written_total']} of {len(rows)} in the shard), "
                    f"{st['audio_hours_now']} h of audio in {st['wall_minutes']} min = {st['x_real_time']}x real time, "
                    f"{st['clips_per_hour']} clips/h, {stats['fail']} failed. All of Phase 1 (92,085 clips, 581 h) at this pace: "
                    f"~{st['estimate_all_phase1_hours_by_audio']} h of idle time.\n")
        say("STATS", json.dumps(st))
        return 0 if stats["fail"] == 0 else 2


    if __name__ == "__main__":
        sys.exit(main())
  F_TESTS_CI_KIT_SCRIPTS_P1_AUTHOR_PY: |
    """CI stand-in for the kit's author.py (the real one is private): the same command line and output rows for what
    label.py uses, so the Mac job's plumbing (llama.cpp, model download, server, resume) is tested end to end."""
    import argparse, json, sys, urllib.request
    from concurrent.futures import ThreadPoolExecutor
    from pathlib import Path


    def load_brief(path):
        t = Path(path).read_text(encoding="utf-8")
        return t.split("=====")[1].strip() if t.count("=====") >= 2 else t.strip()


    def user_msg(verbatim, alt=None):
        return "Transcript:\n" + verbatim


    if __name__ == "__main__":
        ap = argparse.ArgumentParser()
        for f in ["--in", "--out", "--backend", "--base-url", "--model", "--tag", "--brief", "--brief-extra", "--extra"]:
            ap.add_argument(f)
        for f in ["--shots", "--concurrency", "--batch", "--max-model-len"]:
            ap.add_argument(f, type=int, default=1)
        a = ap.parse_args()
        sysmsg = load_brief(a.brief) + "\n\n" + load_brief(a.brief_extra)
        extra = json.loads(a.extra or "{}")
        out = Path(a.out); out.mkdir(parents=True, exist_ok=True)
        for shard in sorted(Path(getattr(a, "in")).glob("*.jsonl")):
            dst = out / shard.name
            done = {json.loads(l)["id"] for l in open(dst, encoding="utf-8")} if dst.exists() else set()
            rows = [json.loads(l) for l in open(shard, encoding="utf-8") if l.strip()]
            todo = [r for r in rows if r["id"] not in done]
            def one(r):
                body = dict({"model": a.model, "messages": [{"role": "system", "content": sysmsg}, {"role": "user", "content": user_msg(r["verbatim"])}],
                             "max_tokens": 120, "temperature": 0.2, "top_p": 0.9}, **extra)
                rq = urllib.request.Request(a.base_url + "/chat/completions", data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
                o = json.loads(urllib.request.urlopen(rq, timeout=600).read())
                return {"id": r["id"], "finished": o["choices"][0]["message"]["content"], "model": a.tag, "out_tok": o["usage"]["completion_tokens"]}
            with ThreadPoolExecutor(a.concurrency) as ex, open(dst, "a", encoding="utf-8") as f:
                for row in ex.map(one, todo):
                    f.write(json.dumps(row) + "\n")
            print(f"{shard.name}: {len(todo)} written, {len(done)} were done", flush=True)
