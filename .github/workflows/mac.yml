# Diagnosis only (public branch mac-mic-diag): what macOS's privacy service (TCC) does when the
# PUBLISHED Typd 0.2.6 asks for the microphone at its first launch, on macOS 14, 15, 26 and 27.
#
# A Mac user on macOS 27 could not give Typd the microphone: Typd was not in Privacy & Security >
# Microphone. This downloads the public dmg (sha256 checked against the CI record), installs it in
# /Applications as a user would, launches it through LaunchServices on a fresh TCC state and records
# tccd's own log lines for the request: a prompt, or a policy refusal with no prompt and no record.
# The same app re-signed several ways is the comparison: ad hoc; Typd's certificate with the
# microphone entitlement (no hardened runtime); hardened runtime with and without it. It also reads
# the shipped icon.icns with Apple's iconutil and shows what iconutil itself writes.
#
# Started by hand only (gh workflow run mac.yml --ref mac-mic-diag). Builds nothing, publishes
# nothing, uploads nothing. Only the signing step gets the certificate secrets; its keychain is
# deleted at the end.

name: macOS

on:
  workflow_dispatch:
    inputs:
      wait:
        description: Seconds to watch each launch
        type: string
        default: '25'

permissions:
  contents: read

jobs:
  mic:
    if: github.repository == 'SameRainbows/typd-app'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DMG_URL: https://typd-collect.mehmetdedeler.com/download/Typd-0.2.6-mac-arm64.dmg
      DMG_SHA256: 7f1da973c286cf8053ce6126954f27b3f9f383da24fcd86ca695a68a566ccbeb
      WAIT: ${{ inputs.wait || '25' }}
    steps:
      - name: Check out this commit (plain git, no token)
        run: |
          set -e
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='%H %s'

      - name: Node.js 24 (nodejs.org, sha256 pinned)
        env:
          NODE_VERSION: v24.22.0
          NODE_SHA256: 6a9724d9b50a5f22b4816cded441b5a8d9ddae546191a5e5b7efa5a5e2ee26d5   # node-v24.22.0-darwin-arm64.tar.gz
        run: |
          set -e
          f="node-$NODE_VERSION-darwin-arm64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://nodejs.org/dist/$NODE_VERSION/$f"
          echo "$NODE_SHA256  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-$NODE_VERSION-darwin-arm64/bin" >> "$GITHUB_PATH"

      - name: The machine
        run: |
          set +e +o pipefail
          sw_vers; uname -a; csrutil status || true; id
          ls -la "$HOME/Library/Application Support/com.apple.TCC/" 2>&1 || true
          sudo find /private/var/containers/Data/ProtectedSystem -name 'TCC.db' 2>/dev/null | head || true
          tccutil --help 2>&1 | head -20 || true

      - name: The published 0.2.6 dmg (sha256 checked), installed in /Applications
        run: |
          set -e
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/Typd.dmg" "$DMG_URL"
          echo "$DMG_SHA256  $RUNNER_TEMP/Typd.dmg" | shasum -a 256 -c -
          mnt="$RUNNER_TEMP/dmg"; mkdir -p "$mnt"
          hdiutil attach "$RUNNER_TEMP/Typd.dmg" -nobrowse -readonly -mountpoint "$mnt"
          ditto "$mnt/Typd.app" /Applications/Typd.app
          hdiutil detach "$mnt"
          ditto /Applications/Typd.app "$RUNNER_TEMP/shipped/Typd.app"
          xattr -lr /Applications/Typd.app | head -5 || true

      - name: The shipped app's signature, entitlements, flags, Info.plists
        run: |
          set +e +o pipefail
          APP=/Applications/Typd.app
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -3
          codesign -dvvv "$APP" 2>&1 | grep -vE '^(Sealed|Page size|CDHash|Hash type|Internal)'
          echo "--- entitlements (main)"; codesign -d --entitlements - --xml "$APP" 2>&1; echo
          for h in "$APP"/Contents/Frameworks/*.app; do
            echo "--- $(basename "$h"): $(codesign -dv "$h" 2>&1 | grep -E '^(CodeDirectory|Runtime)' | tr '\n' ' ')"
            codesign -d --entitlements - --xml "$h" 2>&1 | head -c 400; echo
            plutil -extract NSMicrophoneUsageDescription raw -o - "$h/Contents/Info.plist" 2>&1 | head -1
          done
          echo "--- designated"; codesign -d -r- "$APP" 2>&1 | grep designated
          echo "--- main Info.plist usage keys"; plutil -p "$APP/Contents/Info.plist" | grep -E 'Usage|CFBundleIdentifier|LSUIElement|CFBundleIcon'
          spctl --assess --type execute -vv "$APP" 2>&1 || true

      - name: The shipped icon.icns, read by Apple's iconutil; what iconutil writes itself
        run: |
          set +e +o pipefail
          APP=/Applications/Typd.app
          cat > "$RUNNER_TEMP/icns.py" <<'EOF'
          import struct, sys
          b = open(sys.argv[1], 'rb').read(); o = 8
          while o < len(b):
              t, l = b[o:o+4].decode('latin1'), struct.unpack('>I', b[o+4:o+8])[0]
              d = b[o+8:o+l]
              kind = 'png %dx%d' % struct.unpack('>II', d[16:24]) if d[:4] == b'\x89PNG' else ('ARGB' if d[:4] == b'ARGB' else 'raw %d B' % len(d))
              print('  %s %7d %s' % (t, l, kind)); o += l
          EOF
          echo "--- shipped icon.icns entries"; python3 "$RUNNER_TEMP/icns.py" "$APP/Contents/Resources/icon.icns"
          rm -rf "$RUNNER_TEMP/shipped.iconset"
          iconutil -c iconset "$APP/Contents/Resources/icon.icns" -o "$RUNNER_TEMP/shipped.iconset" 2>&1 || echo "iconutil could not read it"
          for f in "$RUNNER_TEMP/shipped.iconset"/*.png; do [ -e "$f" ] && echo "  $(basename "$f"): $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}')"; done
          echo "--- an iconset made from assets/typd.png with sips, then iconutil -c icns"
          s="$RUNNER_TEMP/typd.iconset"; mkdir -p "$s"
          for n in 16 32 128 256 512; do
            sips -z $n $n assets/typd.png --out "$s/icon_${n}x${n}.png" >/dev/null
            sips -z $((n*2)) $((n*2)) assets/typd.png --out "$s/icon_${n}x${n}@2x.png" >/dev/null
          done
          iconutil -c icns "$s" -o "$RUNNER_TEMP/typd.icns"
          python3 "$RUNNER_TEMP/icns.py" "$RUNNER_TEMP/typd.icns"
          shasum -a 256 "$RUNNER_TEMP/typd.icns"

      - name: Typd's signing certificate, in a keychain of its own (for the re-signed variants)
        env:
          MAC_CODESIGN_P12: ${{ secrets.MAC_CODESIGN_P12 }}
          MAC_CODESIGN_P12_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
        run: |
          bash scripts/mac-signing-import.sh

      - name: Variants of the same app, re-signed
        run: |
          set -e
          V="$RUNNER_TEMP/variants"; mkdir -p "$V"
          ent() {   # ent <file> <keys...>
            f="$1"; shift
            { echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0"><dict>'
              for k in "$@"; do echo "<key>$k</key><true/>"; done
              echo '</dict></plist>'; } > "$f"
            plutil -lint "$f"
          }
          ELECTRON="com.apple.security.cs.allow-jit com.apple.security.cs.allow-unsigned-executable-memory com.apple.security.cs.disable-library-validation com.apple.security.automation.apple-events"
          ent "$V/mic.plist" com.apple.security.device.audio-input
          ent "$V/rt-mic.plist" $ELECTRON com.apple.security.device.audio-input
          ent "$V/rt-nomic.plist" $ELECTRON
          ID="$TYPD_MAC_SIGN_IDENTITY"; KC="$TYPD_MAC_SIGN_KEYCHAIN"
          mk() {   # mk <name> <codesign args...>
            name=$1; shift
            ditto "$RUNNER_TEMP/shipped/Typd.app" "$V/$name/Typd.app"
            codesign --force --deep "$@" "$V/$name/Typd.app"
            codesign --verify --deep --strict "$V/$name/Typd.app"
            echo "$name: $(codesign -dv "$V/$name/Typd.app" 2>&1 | grep -E '^CodeDirectory' ) | $(codesign -d -r- "$V/$name/Typd.app" 2>&1 | grep designated | cut -c1-90)"
          }
          mk adhoc --sign -
          mk cert-mic --sign "$ID" --keychain "$KC" --timestamp=none --entitlements "$V/mic.plist"
          mk runtime-mic --sign "$ID" --keychain "$KC" --timestamp=none --options runtime --entitlements "$V/rt-mic.plist"
          mk runtime-nomic --sign "$ID" --keychain "$KC" --timestamp=none --options runtime --entitlements "$V/rt-nomic.plist"

      - name: Ask for the microphone, fresh TCC state each time (tccd's own log)
        run: |
          set +e +o pipefail
          cat > "$RUNNER_TEMP/wins.swift" <<'EOF'
          import CoreGraphics
          import Foundation
          let list = (CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]]) ?? []
          for w in list {
            let owner = w[kCGWindowOwnerName as String] as? String ?? "?"
            let layer = w[kCGWindowLayer as String] as? Int ?? 0
            let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
            if layer >= 0 && owner != "Window Server" && owner != "Dock" { print("  window: \(owner) layer \(layer) \(b["Width"] ?? 0)x\(b["Height"] ?? 0) at \(b["X"] ?? 0),\(b["Y"] ?? 0)") }
          }
          EOF
          swiftc -O "$RUNNER_TEMP/wins.swift" -o "$RUNNER_TEMP/wins" 2>&1 | tail -3
          NEWDB=$(sudo find /private/var/containers/Data/ProtectedSystem -name 'TCC.db' -path '*com.apple.TCC*' 2>/dev/null | head -n 1)
          dbs() {
            for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "$NEWDB" "/Library/Application Support/com.apple.TCC/TCC.db"; do
              [ -n "$db" ] || continue
              r=$(sudo sqlite3 "$db" "SELECT service||' auth_value='||auth_value||' reason='||auth_reason FROM access WHERE client LIKE 'ai.typd%';" 2>&1 | tr '\n' ';')
              echo "  TCC.db $(echo "$db" | sed 's#.*/ProtectedSystem/#<ProtectedSystem>/#'): ${r:-no rows for ai.typd.app}"
            done
          }
          try() {   # try <label> <app folder>
            label=$1; src=$2
            echo "=================== $label"
            pkill -f /Applications/Typd.app/Contents/MacOS/Typd 2>/dev/null; sleep 1
            rm -rf /Applications/Typd.app; ditto "$src" /Applications/Typd.app
            /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/Typd.app || true
            echo "  $(codesign -dv /Applications/Typd.app 2>&1 | grep -E '^CodeDirectory')"
            tccutil reset Microphone ai.typd.app 2>&1 | sed 's/^/  /'
            tccutil reset All ai.typd.app >/dev/null 2>&1 || true
            rm -rf "$HOME/Library/Application Support/typd"
            dbs
            sudo log stream --level debug --style compact --predicate 'subsystem == "com.apple.TCC" OR process == "tccd"' > "$RUNNER_TEMP/tcc-$label.log" 2>&1 &
            lp=$!
            sleep 2
            out="$RUNNER_TEMP/typd-$label.out"
            open /Applications/Typd.app --env TYPD_DEBUG=1 --env TYPD_NO_MODEL_UPDATE=1 --env TYPD_NO_APP_UPDATE=1 --env TYPD_NO_WALKTHROUGH=1 --env TYPD_NO_SHARE=1 --stdout "$out" --stderr "$out.err"
            sleep "$WAIT"
            echo "  -- on-screen windows while Typd waits"; "$RUNNER_TEMP/wins" | grep -viE 'menubar|Control Center|SystemUIServer|Notification Center|Wallpaper' | head -20
            pgrep -fl /Applications/Typd.app/Contents/MacOS/Typd | head -2 | sed 's/^/  running: /'
            pkill -f /Applications/Typd.app/Contents/MacOS/Typd 2>/dev/null; sleep 3
            sudo kill $lp 2>/dev/null; sleep 1
            echo "  -- tccd about the microphone and Typd"
            grep -iE 'kTCCServiceMicrophone|AUTHREQ_(PROMPTING|RESULT)|disallow|Refusing|prompt' "$RUNNER_TEMP/tcc-$label.log" | grep -viE 'kTCCServiceListenEvent|kTCCServicePostEvent' | cut -c1-420 | head -40
            echo "  -- tccd about Accessibility (the key's event tap asks too)"
            grep -iE 'kTCCServiceAccessibility' "$RUNNER_TEMP/tcc-$label.log" | grep -iE 'AUTHREQ_(PROMPTING|RESULT)|prompt' | cut -c1-300 | head -6
            echo "  -- Typd's own lines"
            grep -hE '^\[typd:(permissions|life|hotkey)\]' "$out" "$out.err" 2>/dev/null | head -20
            dbs
          }
          try shipped "$RUNNER_TEMP/shipped/Typd.app"
          try adhoc "$RUNNER_TEMP/variants/adhoc/Typd.app"
          try cert-mic "$RUNNER_TEMP/variants/cert-mic/Typd.app"
          try runtime-nomic "$RUNNER_TEMP/variants/runtime-nomic/Typd.app"
          try runtime-mic "$RUNNER_TEMP/variants/runtime-mic/Typd.app"
          try shipped-again "$RUNNER_TEMP/shipped/Typd.app"

      - name: Remove the signing keychain
        if: always()
        run: bash scripts/mac-signing-import.sh --delete
