          { echo WORKER_USER=typdworker; echo IDLE_MINUTES=0; echo BUSY_CPU_PERCENT=1000; echo BUSY_GPU_PERCENT=100
            echo CHECK_SECONDS=5; echo RESPECT_VIDEO=0; } | sudo tee /Users/Shared/mr/ci-gate.conf
          cd /tmp && sudo -u typdworker -H env TYPD_WORKER_CONF=/Users/Shared/mr/ci-gate.conf /Library/TypdWorker/bin/idlegate check

      - name: The app (the CI build draft) and a shard of public-domain speech as the Mac job gets it
        run: |
          set -e
          R=$GITHUB_RUN_ID
          gh release download build-40047208604 --repo "$GITHUB_REPOSITORY" --pattern Typd-0.2.11-mac-arm64.dmg --dir "$RUNNER_TEMP/rel"
          sudo cp "$RUNNER_TEMP/rel/Typd-0.2.11-mac-arm64.dmg" /Users/Shared/mr/; sudo chmod 644 /Users/Shared/mr/Typd-0.2.11-mac-arm64.dmg
          S="$RUNNER_TEMP/shard"; mkdir -p "$S/audio"
          curl -fsSL -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          test "$(shasum -a 256 "$RUNNER_TEMP/jfk.wav" | cut -d' ' -f1)" = 59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e
          for k in 1 2 3 4 5 6; do afconvert -f flac -d flac "$RUNNER_TEMP/jfk.wav" "$S/audio/ci_t$k.flac" || { python3 -m pip install -q --user --break-system-packages soundfile numpy; python3 -c "import soundfile as sf, sys; w, sr = sf.read(sys.argv[1]); sf.write(sys.argv[2], w, sr, format='FLAC')" "$RUNNER_TEMP/jfk.wav" "$S/audio/ci_t$k.flac"; }; echo "{"id": "ci_t$k", "source": "public_domain", "duration_s": 11.0, "audio": "audio/ci_t$k.flac"}" >> "$S/manifest.jsonl"; done
          ls -la "$S/audio"; tar cf "$RUNNER_TEMP/teacher-in-ci$R.tar" -C "$S" .
          echo "CI test input" > "$RUNNER_TEMP/notes.md"
          export GITHUB_TOKEN="$GH_TOKEN"; . "$M/jobs/lib.sh"
          draft_release "teacher-in-ci$R" "CI teacher input $R" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/teacher-in-ci$R.tar"
          cd /tmp; sudo -u typdworker -H env GITHUB_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_API_URL="$GITHUB_API_URL" \
