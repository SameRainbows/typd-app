# Can an 8 GB Apple-silicon Mac run the full model (P2d, 1.7B)? Typd 0.2.11 gives the full model only to Macs
# with 16 GB or more. This job measures it on a GitHub macOS arm64 runner (an M1 virtual machine with ~7 GB,
# a stand-in for an 8 GB Mac), with Typd's own code end to end:
#   - the shipped 0.2.11 Mac build (the CI draft build-40047208604, the same dmg as the live download);
#   - the models fetched by the app's own updater (src/main/modelUpdate.js createUpdater, the public routes,
#     the signed manifest, every sha256 checked): the full model (p2d_1p7b) and the light one;
#   - dictation through the app's pipeline (pipeline/index.js run(), local.js starting llama-server), the
#     audio fed 256 ms at a time in real time as the overlay sends it (openStream), so "work while you talk"
#     runs as in the app; release-to-text is timed from the last chunk to the finished text.
# Modes: P2d in low-memory mode (TYPD_LOW_MEMORY=1), P2d in normal mode (=0), the light model as 0.2.11 runs it
# on an 8 GB Mac (low-memory mode). Each once on a quiet machine and once "busy": another process holding
# hog_gb GB of incompressible memory and touching it every 5 s (a browser). Before each server start the file
# cache is purged (a cold start). Memory: llama-server RSS and physical footprint (Metal allocations
# included; vmmap's peak), the system's pressure level, free %, compressor, swap, page-ins.
#
# Speech, public domain only: whisper.cpp's jfk.wav (11 s) and two short pieces and one 36 s piece of a US
# presidential radio address (Wikimedia Commons, 1 Nov 2008), cut at pauses.
#
# Only a maintainer can start it (gh workflow run mac.yml --ref mem8gb-0.2.11). It builds nothing and
# publishes nothing; logs go to a DRAFT release mem8gb-<run id> (maintainers only).

name: 8 GB Mac memory test (P2d vs light, 0.2.11)

on:
  workflow_dispatch:
    inputs:
      hog_gb:
        description: GB of other memory held during the busy runs
        type: string
        default: '2.5'
      idle_s:
        description: Seconds idle between the server start and the first dictation
        type: string
        default: '30'

permissions:
  contents: read

env:
  BUILD_RELEASE: build-40047208604
  DMG_NAME: Typd-0.2.11-mac-arm64.dmg
  DMG_SHA: e1d7f4bde9e10f8810f9a9a1555be18e4b01769157761475cd64625aa2806c5b
  JFK_URL: https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
  JFK_SHA: 59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e
  RADIO_URL: https://upload.wikimedia.org/wikipedia/commons/2/22/George_W._Bush%27s_weekly_radio_address_%28November_1%2C_2008%29.oga
  RADIO_SHA: b844a36b9b0c0d777c64f1d62356bf0b6cad6a0f753627f5a7e7abd17c843f0c

  CLIPS_PY: |
    # The radio address (44.1 kHz Vorbis) to 16 kHz mono 16-bit, cut at pauses (sample offsets at 16 kHz).
    import sys, wave, hashlib, numpy as np, soundfile as sf
    from scipy.signal import resample_poly
    src, outdir = sys.argv[1], sys.argv[2]
    x, sr = sf.read(src, dtype='float64', always_2d=True)
    assert sr == 44100, sr
    y = resample_poly(x.mean(axis=1), 160, 441)
    cuts = {'short5a': (461760, 544000), 'short5b': (630720, 720960), 'long36': (1027520, 1608000)}
    for name, (a, b) in cuts.items():
        s = np.clip(np.rint(y[a:b] * 32768.0), -32768, 32767).astype('<i2')
        with wave.open(f'{outdir}/{name}.wav', 'wb') as w:
            w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(s.tobytes())
        print(name, f'{(b - a) / 16000:.2f} s', 'pcm sha256', hashlib.sha256(s.tobytes()).hexdigest())

  HOG_PY: |
    # Another app's memory: hog_gb GB of incompressible bytes, every page read again every 5 s.
    import os, sys, time
    n = int(float(sys.argv[1]) * 1024 ** 3)
    blk = os.urandom(1 << 20)
    buf = bytearray(n)
    for off in range(0, n, 1 << 20):
        m = min(1 << 20, n - off); buf[off:off + m] = blk[:m]
    print(f'hog: {n / 1024 ** 3:.2f} GB allocated and filled', flush=True)
    while True:
        s = 0
        for off in range(0, n, 16384): s += buf[off]
        time.sleep(5)

  SAMPLER_PY: |
    # Every second: llama-server / harness / hog RSS, the system's memory state; every 2 s llama-server's footprint.
    import json, os, re, subprocess, sys, time
    out, phasef, stopf, hogpidf = sys.argv[1:5]
    def sh(*a):
        try: return subprocess.run(a, capture_output=True, text=True, timeout=10).stdout
        except Exception: return ''
    page = int(sh('sysctl', '-n', 'hw.pagesize').strip() or 16384)
    UNIT = {'B': 1 / 1048576, 'KB': 1 / 1024, 'MB': 1, 'GB': 1024}
    def mbof(m): return round(float(m.group(1)) * UNIT[m.group(2)], 1) if m else None
    fp, iog, k = None, None, 0
    f = open(out, 'a')
    while not os.path.exists(stopf):
        t0 = time.time()
        try: phase = open(phasef).read().strip()
        except Exception: phase = 'none'
        try: hogpid = int(open(hogpidf).read().strip())
        except Exception: hogpid = None
        llama = typd = hog = None; lpid = None
        for line in sh('ps', '-axo', 'pid=,rss=,comm=').splitlines():
            p = line.split(None, 2)
            if len(p) < 3: continue
            pid, rss = int(p[0]), int(p[1])
            if p[2].endswith('llama-server'): llama, lpid = (llama or 0) + rss, pid
            elif p[2].endswith('/MacOS/Typd'): typd = (typd or 0) + rss
            elif pid == hogpid: hog = rss
        vm = {}
        for line in sh('vm_stat').splitlines():
            m = re.match(r'^"?([^:"]+)"?:\s+(\d+)\.?$', line.strip())
            if m: vm[m.group(1)] = int(m.group(2))
        sw = re.search(r'used = ([\d.]+)M', sh('sysctl', '-n', 'vm.swapusage'))
        lvl = sh('sysctl', '-n', 'kern.memorystatus_vm_pressure_level').strip()
        free = sh('sysctl', '-n', 'kern.memorystatus_level').strip()
        if lpid and k % 2 == 0:
            o = sh('footprint', str(lpid))
            if not os.path.exists(out + '.footprint.txt'): open(out + '.footprint.txt', 'w').write(o)
            fp = mbof(re.search(r'Footprint:\s*([\d.]+)\s*(B|KB|MB|GB)', o))
            iog = mbof(re.search(r'([\d.]+)\s*(B|KB|MB|GB)\s+[\d.]+\s*(?:B|KB|MB|GB)\s+[\d.]+\s*(?:B|KB|MB|GB)\s+\d+\s+IOAccelerator', o))
        elif not lpid: fp = iog = None
        pg = lambda key: round(vm.get(key, 0) * page / 1048576)
        f.write(json.dumps({'t': round(t0, 2), 'phase': phase, 'llama_rss_mb': llama and round(llama / 1024), 'llama_fp_mb': fp,
            'llama_ioaccel_mb': iog, 'typd_rss_mb': typd and round(typd / 1024), 'hog_rss_mb': hog and round(hog / 1024),
            'free_mb': pg('Pages free'), 'active_mb': pg('Pages active'), 'inactive_mb': pg('Pages inactive'),
            'wired_mb': pg('Pages wired down'), 'compressor_mb': pg('Pages occupied by compressor'),
            'file_mb': pg('File-backed pages'), 'anon_mb': pg('Anonymous pages'),
            'pageins': vm.get('Pageins', 0), 'pageouts': vm.get('Pageouts', 0), 'swapins': vm.get('Swapins', 0),
            'swapouts': vm.get('Swapouts', 0), 'swap_used_mb': float(sw.group(1)) if sw else None,
            'pressure': int(lvl) if lvl.isdigit() else None, 'free_pct': int(free) if free.isdigit() else None, 'page': page}) + '\n')
        f.flush(); k += 1
        time.sleep(max(0.05, 1 - (time.time() - t0)))

  BENCH_JS: |
    'use strict';
    // Typd's own code, run by the app's runtime (ELECTRON_RUN_AS_NODE=1) from its app.asar.
    //   fetch <full|light> <modelsDir>     the app's model updater, public routes (signed manifest, sha256s)
    //   run <json>                          one server start: warm, idle, dictations, the server's peak memory
    const fs = require('fs'), path = require('path'), cp = require('child_process');
    const ASAR = process.env.APP_ASAR;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const now = () => Date.now();
    const mark = (f, s) => { if (f) fs.writeFileSync(f, s); };
    function readWav(f) {
      const b = fs.readFileSync(f);
      let p = 12, fmt = null, data = null;
      while (p + 8 <= b.length) {
        const id = b.toString('ascii', p, p + 4), n = b.readUInt32LE(p + 4);
        if (id === 'fmt ') fmt = { tag: b.readUInt16LE(p + 8), ch: b.readUInt16LE(p + 10), sr: b.readUInt32LE(p + 12), bits: b.readUInt16LE(p + 22) };
        if (id === 'data') { data = b.subarray(p + 8, Math.min(b.length, p + 8 + n)); break; }
        p += 8 + n + (n & 1);
      }
      if (!fmt || !data || fmt.tag !== 1 || fmt.bits !== 16 || fmt.sr !== 16000) throw new Error('want 16 kHz 16-bit PCM: ' + f);
      const frames = Math.floor(data.length / (2 * fmt.ch));
      const s = new Float32Array(frames);
      for (let i = 0; i < frames; i++) {
        let v = 0;
        for (let c = 0; c < fmt.ch; c++) v += data.readInt16LE((i * fmt.ch + c) * 2);
        s[i] = v / fmt.ch / 32768;
      }
      return { samples: s, sampleRate: fmt.sr };
    }
    async function fetchModel(variant, modelsDir) {
      const mu = require(path.join(ASAR, 'src', 'main', 'modelUpdate.js'));
      fs.mkdirSync(modelsDir, { recursive: true });
      const appVersion = JSON.parse(fs.readFileSync(path.join(ASAR, 'package.json'), 'utf8')).version;
      const t0 = now();
      let last = '';
      const upd = mu.createUpdater({
        config: { endpoint: mu.ENDPOINT, key: null }, modelsDir, bundledDir: path.join(modelsDir, 'none'), appVersion,
        variant: () => variant, networkCost: async () => 'unmetered', automatic: () => false, askFirst: () => false,
        switchModel: async () => {}, log: (...m) => console.log('[typd:models]', ...m)
      });
      upd.onChange((l) => { if (l && l !== last) { last = l; if (!/\d+ ?%/.test(l) || /0 ?%/.test(l)) console.log(`[line +${((now() - t0) / 1000).toFixed(1)}s] ${l}`); } });
      upd.start();
      while (now() - t0 < 30 * 60e3) {
        await sleep(1000);
        const act = mu.activeModel(modelsDir);
        if (!act) continue;
        upd.stop();
        const m = JSON.parse(fs.readFileSync(path.join(act.dir, 'manifest.json'), 'utf8'));
        const r = { variant, app: appVersion, version: act.version, dir: act.dir, seconds: (now() - t0) / 1000,
          files: m.files.map((x) => ({ name: x.name, size: x.size, sha256: x.sha256 })), model_json: JSON.parse(fs.readFileSync(path.join(act.dir, 'model.json'), 'utf8')) };
        console.log('FETCHED ' + JSON.stringify(r));
        process.exit(0);
      }
      console.error('no model after 30 min: ' + last);
      process.exit(1);
    }
    function vmmap(pid) {
      if (!pid) return null;
      try {
        const o = cp.execFileSync('sudo', ['-n', 'vmmap', '-summary', String(pid)], { encoding: 'utf8', timeout: 90000, maxBuffer: 64 << 20 });
        const g = (re) => { const m = re.exec(o); return m ? m[1] : null; };
        return { footprint: g(/Physical footprint:\s+(\S+)/), peak: g(/Physical footprint \(peak\):\s+(\S+)/),
          lines: o.split('\n').filter((l) => /IOAccelerator|IOKit|mapped file|MALLOC_LARGE|MALLOC_SMALL|VM_ALLOCATE|TOTAL/i.test(l)).slice(0, 30) };
      } catch (e) { return { error: String(e.message || e).slice(0, 300) }; }
    }
    async function once(pipe, audio, how) {
      const SR = 16000, CH = 4096;   // 256 ms, as the overlay sends it
      const ctl = new AbortController();
      const t0 = now();
      pipe.wake('');
      let stream = null;
      if (how === 'rt') {
        stream = pipe.openStream(ctl.signal, () => '');
        for (let i = 0; i < audio.samples.length; i += CH) {
          const due = t0 + ((Math.min(audio.samples.length, i + CH)) / SR) * 1000;
          const w = due - now(); if (w > 0) await sleep(w);
          if (stream) stream.push(audio.samples.slice(i, Math.min(audio.samples.length, i + CH)));
        }
      }
      const rel = now();
      let first = null, text = '', err = null;
      try {
        for await (const ev of pipe.run({ audio, contextBlock: '', signal: ctl.signal, stream })) {
          if (ev.type === 'partial' && first === null) first = now() - rel;
          if (ev.type === 'done') text = ev.text;
        }
      } catch (e) { err = String((e && e.message) || e); }
      const row = { releaseToTextMs: now() - rel, firstPartialMs: first, lateMs: how === 'rt' ? Math.round(rel - t0 - audio.samples.length / SR * 1000) : null, text, err };
      if (stream && stream.plan) row.plan = stream.plan;
      if (stream && stream.timings) row.requests = stream.timings.map((t) => ({ kind: t.kind, ms: t.ms, audioS: t.audioS, startS: t.startS, error: t.error }));
      return row;
    }
    async function runPhase(c) {
      Object.assign(process.env, { TYPD_MODEL_DIR: c.modelDir, TYPD_LOW_MEMORY: c.low, TYPD_DEBUG: '1', TYPD_NO_MODEL_UPDATE: '1',
        TYPD_LLAMA_SERVER: process.env.TYPD_LLAMA_SERVER || path.join(path.dirname(ASAR), 'llama', 'llama-server') });
      const pipe = require(path.join(ASAR, 'src', 'main', 'pipeline', 'index.js'));
      const local = require(path.join(ASAR, 'src', 'main', 'pipeline', 'local.js'));
      const res = { label: c.label, set: c.set, low: c.low, model: path.basename(c.modelDir), clips: [] };
      mark(c.phaseFile, c.label + ':warm');
      let t = now();
      try { await local.warm(); } catch (e) { res.warmError = String((e && e.message) || e); }
      res.warmMs = now() - t;
      Object.assign(res, { lowMemory: local.lowMemory, device: local.device, context: local.CONTEXT, pid: local.SERVER_PID, longLimits: local.longLimits(),
        args: local.serverArgs('99').filter((a) => !a.includes('/')).join(' '), conv: local.serverEnv({}, '99').MTMD_QWEN3A_CONV_GROUP || null });
      console.log('WARM ' + JSON.stringify(res));
      if (res.warmError) { fs.writeFileSync(c.out, JSON.stringify(res, null, 1)); process.exit(3); }
      res.afterWarm = vmmap(res.pid);
      mark(c.phaseFile, c.label + ':idle');
      await sleep(c.idleS * 1000);
      const plan = c.set === 'A'
        ? [['short5a', 'rt', 'cold'], ['short5a', 'rt', 'warm'], ['short5b', 'rt', 'warm'], ['jfk', 'rt', 'warm'], ['jfk', 'rt', 'warm2']]
        : [['long36', 'rt', 'cold'], ['long36', 'rt', 'warm'], ['long36', 'batch', 'warm']];
      for (const [name, how, tag] of plan) {
        const audio = readWav(c.clips[name]);
        mark(c.phaseFile, `${c.label}:${name}:${how}:${tag}`);
        const row = { clip: name, how, tag, seconds: +(audio.samples.length / 16000).toFixed(2), ...(await once(pipe, audio, how)) };
        res.clips.push(row);
        console.log('DICTATION ' + JSON.stringify(row));
        mark(c.phaseFile, c.label + ':gap');
        await sleep(3000);
      }
      res.end = vmmap(res.pid);
      mark(c.phaseFile, c.label + ':stop');
      local.stop();
      await sleep(2000);
      mark(c.phaseFile, 'none');
      fs.writeFileSync(c.out, JSON.stringify(res, null, 1));
      process.exit(res.clips.some((x) => x.err || !x.text) ? 2 : 0);
    }
    const [cmd, ...a] = process.argv.slice(2);
    (cmd === 'fetch' ? fetchModel(a[0], a[1]) : runPhase(JSON.parse(a[0])))
      .catch((e) => { console.error('bench failed: ' + ((e && e.stack) || e)); process.exit(1); });

  SUMMARY_PY: |
    import glob, json, os, re, sys
    L = sys.argv[1]
    S = [json.loads(l) for l in open(f'{L}/samples.jsonl') if l.strip()]
    order = [f'{v}/{m}/{s}' for v in ('quiet', 'busy') for m in ('p2d_low', 'p2d_normal', 'light_low') for s in ('A', 'B')]
    out = []
    def p(*a): out.append(' '.join(str(x) for x in a))
    def mx(rows, k): v = [r[k] for r in rows if r.get(k) is not None]; return max(v) if v else None
    def mn(rows, k): v = [r[k] for r in rows if r.get(k) is not None]; return min(v) if v else None
    base = [r for r in S if r['phase'] == 'baseline']
    if base:
        b = base[-1]; p(f"baseline (no Typd): free {b['free_mb']} MB, active {b['active_mb']}, inactive {b['inactive_mb']}, wired {b['wired_mb']}, compressor {b['compressor_mb']}, swap {b['swap_used_mb']} MB, free% {b['free_pct']}, pressure {b['pressure']}")
    p('| run | device | warm s | server RSS peak MB | footprint peak MB (vmmap) | Metal (IOAccelerator) MB | harness RSS MB | pressure max | free% min | compressor max MB | swap used max MB (start) | page-ins MB | swap-outs MB | hog RSS min MB | latencies (release->text ms) |')
    p('|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|')
    texts = []
    for lab in order:
        f = f"{L}/phase-{lab.replace('/', '_')}.json"
        if not os.path.exists(f): p(f'| {lab} | (no result) |'); continue
        r = json.load(open(f))
        rows = [x for x in S if x['phase'].startswith(lab + ':')]
        if not rows: p(f'| {lab} | (no samples) |'); continue
        pg = rows[0]['page'] / 1048576
        pi = round((rows[-1]['pageins'] - rows[0]['pageins']) * pg); so = round((rows[-1]['swapouts'] - rows[0]['swapouts']) * pg)
        vm = (r.get('end') or {}).get('peak'); ioa = mx(rows, 'llama_ioaccel_mb')
        lat = '; '.join(f"{c['clip']}/{c['how']}/{c['tag']} {c['releaseToTextMs']}" + (f" ({c['plan']['steps']} steps)" if c.get('plan') and c['plan'].get('steps') else '') for c in r['clips'])
        p(f"| {lab} | {r.get('device')} {'low' if (r.get('lowMemory') or {}).get('on') else 'normal'} | {round(r['warmMs'] / 1000, 1)} | {mx(rows, 'llama_rss_mb')} | {vm} (sampled {mx(rows, 'llama_fp_mb')}) | {ioa} | {mx(rows, 'typd_rss_mb')} | {mx(rows, 'pressure')} | {mn(rows, 'free_pct')} | {mx(rows, 'compressor_mb')} | {mx(rows, 'swap_used_mb')} ({rows[0]['swap_used_mb']}) | {pi} | {so} | {mn(rows, 'hog_rss_mb')} | {lat} |")
        for c in r['clips']:
            texts.append(f"{lab} {c['clip']} {c['how']} {c['tag']} {c['releaseToTextMs']} ms: {c['text'] or c['err']}")
    p(''); p('texts:'); out.extend(texts)
    p(''); p('server settings:')
    for lab in order:
        f = f"{L}/phase-{lab.replace('/', '_')}.json"
        if os.path.exists(f):
            r = json.load(open(f)); p(f"{lab}: {r.get('lowMemory')} ctx {r.get('context')} conv {r.get('conv')} longLimits {r.get('longLimits')} args: {r.get('args')}")
    print('\n'.join(out))

jobs:
  mac:
    if: github.repository == 'SameRainbows/typd-app'
    runs-on: macos-15
    timeout-minutes: 170
    permissions:
      contents: write   # the build's draft release, and the draft that keeps the logs
    steps:
      - name: Check out this commit (plain git, no token)
        run: |
          set -e
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='%H %s'

      - name: The machine
        run: |
          set +e
          L="$RUNNER_TEMP/m8"; mkdir -p "$L"
          {
            sw_vers; uname -m; sysctl -n machdep.cpu.brand_string
            echo "memory: $(( $(sysctl -n hw.memsize) / 1048576 )) MB, cpus: $(sysctl -n hw.ncpu), page $(sysctl -n hw.pagesize)"
            system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Chipset|Metal|Cores|Resolution' | sed 's/^ *//'
            echo "iogpu.wired_limit_mb: $(sysctl -n iogpu.wired_limit_mb 2>&1)"
            echo "swap: $(sysctl -n vm.swapusage)"; echo "pressure level: $(sysctl -n kern.memorystatus_vm_pressure_level), free%: $(sysctl -n kern.memorystatus_level)"
            top -l 1 -n 0 | grep -E 'PhysMem|Processes'
            vm_stat
            df -h / | tail -1
            ps -axo rss=,comm= | sort -rn | head -12
          } 2>&1 | tee "$L/machine.txt"

      - name: Typd 0.2.11 (the shipped Mac build), its SHA-256 checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          L="$RUNNER_TEMP/m8"; D="$RUNNER_TEMP/rel"; mkdir -p "$D"
          gh release download "$BUILD_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --pattern "$DMG_NAME" --dir "$D"
          got=$(shasum -a 256 "$D/$DMG_NAME" | cut -d' ' -f1)
          grep -q "$got" "$D/SHA256SUMS"; test "$got" = "$DMG_SHA"
          echo "$DMG_NAME sha256 $got (= the live public download)" | tee "$L/app.txt"
          MNT=$(hdiutil attach -nobrowse -noautoopen "$D/$DMG_NAME" | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -1)
          ditto "$MNT/Typd.app" "$RUNNER_TEMP/Typd.app"; hdiutil detach "$MNT" -quiet || true
          R="$RUNNER_TEMP/Typd.app/Contents/Resources"
          { defaults read "$RUNNER_TEMP/Typd.app/Contents/Info.plist" CFBundleShortVersionString; ls "$R/llama"; cat "$R/llama/PATCHED.json" 2>/dev/null; } 2>&1 | tee -a "$L/app.txt"
          echo "APP=$RUNNER_TEMP/Typd.app/Contents/MacOS/Typd" >> "$GITHUB_ENV"
          echo "APP_ASAR=$R/app.asar" >> "$GITHUB_ENV"

      - name: Real speech (public domain), cut at pauses
        run: |
          set -e
          L="$RUNNER_TEMP/m8"; C="$RUNNER_TEMP/clips"; mkdir -p "$C"
          curl -fsSL -o "$C/jfk.wav" "$JFK_URL"
          curl -fsSL -A 'typd-app-ci/1.0 (memory test; github.com/SameRainbows/typd-app)' -o "$C/radio.oga" "$RADIO_URL"
          test "$(shasum -a 256 "$C/jfk.wav" | cut -d' ' -f1)" = "$JFK_SHA"
          test "$(shasum -a 256 "$C/radio.oga" | cut -d' ' -f1)" = "$RADIO_SHA"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q numpy==2.4.6 scipy==1.17.1 soundfile==0.14.0 || "$RUNNER_TEMP/venv/bin/pip" install -q numpy scipy soundfile
          "$RUNNER_TEMP/venv/bin/pip" list 2>/dev/null | grep -iE '^(numpy|scipy|soundfile) '
          printf '%s' "$CLIPS_PY" > "$RUNNER_TEMP/clips.py"
          "$RUNNER_TEMP/venv/bin/python" -I "$RUNNER_TEMP/clips.py" "$C/radio.oga" "$C" | tee "$L/clips.txt"
          echo "jfk 11.00 s sha256 $JFK_SHA" | tee -a "$L/clips.txt"

      - name: The models, through the app's own updater (public routes)
        run: |
          set -e
          L="$RUNNER_TEMP/m8"; M="$RUNNER_TEMP/models"
          printf '%s' "$BENCH_JS" > "$RUNNER_TEMP/bench.js"
          for v in full light; do
            ELECTRON_RUN_AS_NODE=1 perl -e 'alarm shift; exec @ARGV' 1900 "$APP" "$RUNNER_TEMP/bench.js" fetch $v "$M/$v" 2>&1 | tee "$L/fetch-$v.log" | grep -vE 'progress' | tail -12
          done
          grep -h '^FETCHED' "$L"/fetch-*.log > "$L/fetched.jsonl"
          for v in full light; do d=$(ls -d "$M/$v"/*/ | grep -v partial | head -1); echo "$v: $d"; ls -la "$d"; done

      - name: Measure (quiet, then busy)
        env:
          HOG_GB: ${{ inputs.hog_gb }}
          IDLE_S: ${{ inputs.idle_s }}
        run: |
          set +e
          L="$RUNNER_TEMP/m8"; M="$RUNNER_TEMP/models"; C="$RUNNER_TEMP/clips"
          printf '%s' "$SAMPLER_PY" > "$RUNNER_TEMP/sampler.py"; printf '%s' "$HOG_PY" > "$RUNNER_TEMP/hog.py"
          echo baseline > "$L/phase"; rm -f "$L/stop" "$L/hog.pid"
          sudo nohup python3 "$RUNNER_TEMP/sampler.py" "$L/samples.jsonl" "$L/phase" "$L/stop" "$L/hog.pid" > "$L/sampler.out" 2>&1 &
          sleep 15
          FULL=$(ls -d "$M/full"/*/ | grep -v partial | head -1); LIGHT=$(ls -d "$M/light"/*/ | grep -v partial | head -1)
          CL="{\"short5a\":\"$C/short5a.wav\",\"short5b\":\"$C/short5b.wav\",\"jfk\":\"$C/jfk.wav\",\"long36\":\"$C/long36.wav\"}"
          for variant in quiet busy; do
            if [ $variant = busy ]; then
              echo hog > "$L/phase"
              python3 "$RUNNER_TEMP/hog.py" "$HOG_GB" > "$L/hog.out" 2>&1 &
              echo $! > "$L/hog.pid"; sleep 40; cat "$L/hog.out"
            fi
            for mdl in p2d_low p2d_normal light_low; do
              case $mdl in p2d_low) dir=$FULL; low=1;; p2d_normal) dir=$FULL; low=0;; light_low) dir=$LIGHT; low=1;; esac
              for set in A B; do
                lab="$variant/$mdl/$set"; f="${lab//\//_}"
                echo "purge" > "$L/phase"; sudo purge; sleep 3
                echo "=== $lab $(date -u +%H:%M:%S) free% $(sysctl -n kern.memorystatus_level) swap $(sysctl -n vm.swapusage | grep -oE 'used = [0-9.]+M')"
                cfg="{\"label\":\"$lab\",\"set\":\"$set\",\"low\":\"$low\",\"modelDir\":\"${dir%/}\",\"out\":\"$L/phase-$f.json\",\"clips\":$CL,\"idleS\":$IDLE_S,\"phaseFile\":\"$L/phase\"}"
                ELECTRON_RUN_AS_NODE=1 perl -e 'alarm shift; exec @ARGV' 1200 "$APP" "$RUNNER_TEMP/bench.js" run "$cfg" > "$L/run-$f.out" 2> "$L/run-$f.err"
                echo "exit $?"
                grep -E '^(WARM|DICTATION) ' "$L/run-$f.out" | cut -c1-400
                pkill -f 'Resources/llama/llama-server' 2>/dev/null; sleep 2
              done
            done
            if [ $variant = busy ]; then kill "$(cat "$L/hog.pid")" 2>/dev/null; rm -f "$L/hog.pid"; fi
          done
          echo none > "$L/phase"; sleep 3; touch "$L/stop"; sleep 3
          wc -l "$L/samples.jsonl"; cat "$L/sampler.out"

      - name: Summary
        if: always()
        run: |
          set +e
          L="$RUNNER_TEMP/m8"
          printf '%s' "$SUMMARY_PY" > "$RUNNER_TEMP/summary.py"
          python3 "$RUNNER_TEMP/summary.py" "$L" | tee "$L/summary.md"
          echo "--- llama.cpp memory lines (first server start of each run)"
          for e in "$L"/run-*.err; do echo "$(basename "$e"):"; grep -E 'recommendedMaxWorkingSetSize|has unified memory|GPU name|buffer size|using [A-Za-z]+ backend|CPU fallback|failed to allocate|out of memory' "$e" | sed -E 's/^[^a-zA-Z]*//' | sort | uniq -c | head -16; done
          echo "--- end-of-run vmmap (peak) per run"
          for f in "$L"/phase-*.json; do python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(r['label'], 'afterWarm', (r.get('afterWarm') or {}).get('footprint'), 'end', (r.get('end') or {}).get('footprint'), 'peak', (r.get('end') or {}).get('peak')); [print('   ', l) for l in ((r.get('end') or {}).get('lines') or [])[:12]]" "$f"; done

      - name: Keep the logs in a draft release (maintainers only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          L="$RUNNER_TEMP/m8"
          tar czf "$RUNNER_TEMP/mem8gb.tar.gz" -C "$L" .
          ls -la "$RUNNER_TEMP/mem8gb.tar.gz"
          tag="mem8gb-${GITHUB_RUN_ID}"
          gh release create "$tag" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "8 GB Mac memory test ${GITHUB_RUN_ID} (logs only)" \
            --notes "Draft (maintainers only): logs of the 8 GB Mac memory test (P2d vs light, Typd 0.2.11) on a macos-15 runner. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$RUNNER_TEMP/mem8gb.tar.gz"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true

      - name: Stop everything
        if: always()
        run: |
          touch "$RUNNER_TEMP/m8/stop" 2>/dev/null || true
          pkill -f 'Resources/llama/llama-server' || true
          pkill -f hog.py || true
