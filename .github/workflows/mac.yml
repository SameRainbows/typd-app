  F_README: |
    Typd Worker (test build for GitHub's macOS runners; the real README is not part of the test).

jobs:
  gate:
    if: github.repository == 'SameRainbows/typd-app' && contains(inputs.parts, 'gate')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write   # the draft release with the logs
    steps:
      - name: Unpack the files under test
        run: |
          set -e
          M="$RUNNER_TEMP/mr"; mkdir -p "$M" "$RUNNER_TEMP/logs"
          while read -r v p; do [ -n "$v" ] || continue; mkdir -p "$M/$(dirname "$p")"; printf '%s' "${!v}" > "$M/$p"; done <<< "$F_MANIFEST"
          chmod 755 "$M"/src/idlegate "$M"/src/*.sh "$M"/src/typd-worker "$M"/src/runner-service "$M"/jobs/*.sh "$M"/tests/*.sh
          echo "M=$M" >> "$GITHUB_ENV"; echo "L=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; /bin/bash --version | head -1

      - name: The gate's logic (simulated conditions, macOS's /bin/bash 3.2)
        run: |
          /bin/bash "$M/tests/gate_test.sh" "$M/src/idlegate" 2>&1 | tee "$L/gate_test.txt"
          test "${PIPESTATUS[0]}" = 0

      - name: The real readings on this VM
        run: |
          set +e
          { echo "== idlegate check (defaults)"; /bin/bash "$M/src/idlegate" check
            echo "== pmset -g batt"; pmset -g batt; echo "== pmset -g therm"; pmset -g therm
            echo "== pmset -g assertions"; pmset -g assertions | head -40
            echo "== HIDIdleTime"; ioreg -c IOHIDSystem -r -d 1 -k HIDIdleTime | grep HIDIdleTime
            echo "== console user: $(stat -f %Su /dev/console)"; ioreg -n Root -d 1 | grep -E 'IOConsoleUsers|CGSSession' | cut -c1-400
            echo "== GPU"; ioreg -r -d 1 -w 0 -c IOAccelerator | grep -oE '"[A-Za-z ]+ Utilization %"=[0-9]+'
            echo "== GPU clients"; ioreg -l -w 0 -r -c IOAccelerator | grep -E 'IOUserClientCreator|accumulatedGPUTime|AppUsage' | cut -c1-300 | head -30
            echo "== memory pressure $(sysctl -n kern.memorystatus_vm_pressure_level), free% $(sysctl -n kern.memorystatus_level)"
            echo "== ps (top CPU)"; ps -axo uid=,%cpu=,comm= | sort -k2 -rn | head -8
          } 2>&1 | tee "$L/readings.txt"

      - name: Build the input watch and the installer (as for the owner, with the CI settings)
        run: |
          set -e
          cd "$M"
          swiftc -O -target arm64-apple-macos13.0 src/input-watch.swift -o typd-input-watch
          swiftc -O tests/synth.swift -o synth
          file typd-input-watch; otool -L typd-input-watch; shasum -a 256 typd-input-watch | tee "$L/typd-input-watch.sha256"
          python3 build.py --src src --conf tests/ci.conf --helper typd-input-watch --readme tests/README-ci.md --out dist | tee "$L/build.txt"

      - name: The input watch on this VM (devices, permission)
        run: |
          set +e
          "$M/typd-input-watch" --list 2>&1 | tee "$L/devices.txt"
          "$M/typd-input-watch" --access
          mkdir -p "$RUNNER_TEMP/iw"; "$M/typd-input-watch" --dir "$RUNNER_TEMP/iw" 2> "$L/input-watch-direct.log" & p=$!
          sleep 8; cat "$RUNNER_TEMP/iw/activity"; kill $p; cat "$L/input-watch-direct.log"
          cp "$M/typd-input-watch" "$L/"

      - name: Keep the logs in a draft release (maintainers only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "$RUNNER_TEMP"; tar czf "macrunner-gate-${{ matrix.os }}.tar.gz" -C "$L" .
          gh release create "macrunner-${GITHUB_RUN_ID}-gate-${{ matrix.os }}" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mac worker test gate-${{ matrix.os }} ${GITHUB_RUN_ID} (logs)" --notes "Draft: logs of the Mac worker test (gate-${{ matrix.os }}). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "macrunner-gate-${{ matrix.os }}.tar.gz" $(ls "$L"/*.png "$M/typd-input-watch" 2>/dev/null)

  install:
    if: github.repository == 'SameRainbows/typd-app' && contains(inputs.parts, 'install')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write   # the draft release with the logs
    steps:
      - name: Unpack the files under test
        run: |
          set -e
          M="$RUNNER_TEMP/mr"; mkdir -p "$M" "$RUNNER_TEMP/logs"
          while read -r v p; do [ -n "$v" ] || continue; mkdir -p "$M/$(dirname "$p")"; printf '%s' "${!v}" > "$M/$p"; done <<< "$F_MANIFEST"
          chmod 755 "$M"/src/idlegate "$M"/src/*.sh "$M"/src/typd-worker "$M"/src/runner-service "$M"/jobs/*.sh "$M"/tests/*.sh
          echo "M=$M" >> "$GITHUB_ENV"; echo "L=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; /bin/bash --version | head -1

      - name: Build the input watch and the installer (as for the owner, with the CI settings)
        run: |
          set -e
          cd "$M"
          swiftc -O -target arm64-apple-macos13.0 src/input-watch.swift -o typd-input-watch
          swiftc -O tests/synth.swift -o synth
          file typd-input-watch; otool -L typd-input-watch; shasum -a 256 typd-input-watch | tee "$L/typd-input-watch.sha256"
          python3 build.py --src src --conf tests/ci.conf --helper typd-input-watch --readme tests/README-ci.md --out dist | tee "$L/build.txt"

      - name: Install, check, repair, Gatekeeper, uninstall, again
        run: |
          /bin/bash "$M/tests/install_test.sh" "$M/dist" "$L" "$M/synth" 2>&1 | tee "$L/install_test.txt"
          test "${PIPESTATUS[0]}" = 0

      - name: Keep the logs in a draft release (maintainers only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "$RUNNER_TEMP"; tar czf "macrunner-install-${{ matrix.os }}.tar.gz" -C "$L" .
          gh release create "macrunner-${GITHUB_RUN_ID}-install-${{ matrix.os }}" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mac worker test install-${{ matrix.os }} ${GITHUB_RUN_ID} (logs)" --notes "Draft: logs of the Mac worker test (install-${{ matrix.os }}). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "macrunner-install-${{ matrix.os }}.tar.gz" $(ls "$L"/*.png "$M/typd-input-watch" 2>/dev/null)

  bench:
    if: github.repository == 'SameRainbows/typd-app' && contains(inputs.parts, 'bench')
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write   # the CI build's draft (the dmg), the results draft, the logs
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Unpack the files under test
        run: |
          set -e
          M="$RUNNER_TEMP/mr"; mkdir -p "$M" "$RUNNER_TEMP/logs"
          while read -r v p; do [ -n "$v" ] || continue; mkdir -p "$M/$(dirname "$p")"; printf '%s' "${!v}" > "$M/$p"; done <<< "$F_MANIFEST"
