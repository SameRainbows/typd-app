  F_SRC_INPUT_WATCH_SWIFT: |
    // Typd Worker Input Watch: notes WHEN real keyboard, mouse and trackpad hardware was last used. Never what.
    //
    // It asks IOKit's HID manager for keyboard, mouse and trackpad devices and gets a callback for each input value
    // from those devices. Input that programs post (CGEventPost: AI agents, automation, remote control) never comes
    // from an IOHIDDevice, so it is never seen here. Virtual HID devices (a driver that pretends to be a keyboard)
    // are left out too. For every real input it keeps only the time and the kind (keyboard or pointer); the key or
    // the movement itself is dropped at once. About every 5 s (only when something changed) and every 30 s it writes:
    //
    //   <dir>/activity     version, started, heartbeat, access, last_keyboard, last_pointer (unix seconds),
    //                      devices_counted, devices_ignored, screen_locked, display_asleep, thermal
    //
    // macOS needs Input Monitoring permission for this (System Settings > Privacy & Security > Input Monitoring).
    // Without it the file says access=denied and the worker uses a simpler check instead.
    //
    //   typd-input-watch [--dir DIR]     run (a LaunchAgent in the owner's login session)
    //   typd-input-watch --list          the devices it sees and whether they count, then exit
    //   typd-input-watch --access        print granted / denied / unknown, then exit
    //
    // Build: swiftc -O -target arm64-apple-macos13.0 input-watch.swift -o typd-input-watch

    import CoreGraphics
    import Foundation
    import IOKit
    import IOKit.hid

    var outDir = "/Users/Shared/TypdWorker/input"
    var mode = "run"
    var args = CommandLine.arguments.dropFirst().makeIterator()
    while let a = args.next() {
      switch a {
      case "--dir": outDir = args.next() ?? outDir
      case "--list": mode = "list"
      case "--access": mode = "access"
      default: FileHandle.standardError.write("unknown option \(a)\n".data(using: .utf8)!); exit(64)
      }
    }

    func note(_ s: String) {
      let f = ISO8601DateFormatter()
      FileHandle.standardError.write("\(f.string(from: Date())) \(s)\n".data(using: .utf8)!)
    }

    func accessName() -> String {
      switch IOHIDCheckAccess(kIOHIDRequestTypeListenEvent) {
      case kIOHIDAccessTypeGranted: return "granted"
      case kIOHIDAccessTypeDenied: return "denied"
      default: return "unknown"
      }
    }

    if mode == "access" { print(accessName()); exit(0) }

    // ---------------------------------------------------------------------------------------------- devices
    struct Dev { let counted: Bool; let kind: String; let why: String }
    var devices: [UnsafeMutableRawPointer: Dev] = [:]

    func prop(_ d: IOHIDDevice, _ k: String) -> Any? { IOHIDDeviceGetProperty(d, k as CFString) }

    func classify(_ d: IOHIDDevice) -> Dev {
      let page = (prop(d, kIOHIDPrimaryUsagePageKey) as? Int) ?? 0
      let usage = (prop(d, kIOHIDPrimaryUsageKey) as? Int) ?? 0
      let transport = (prop(d, kIOHIDTransportKey) as? String) ?? ""
      let builtIn = (prop(d, kIOHIDBuiltInKey) as? Bool) ?? false
      let product = (prop(d, kIOHIDProductKey) as? String) ?? ""
      let virtualFlag = ["VirtualHIDevice", "HIDVirtualDevice", "VirtualDevice"].contains { (prop(d, $0) as? Bool) == true }
      let kind = (page == 0x01 && (usage == 0x06 || usage == 0x07)) ? "keyboard" : "pointer"
      let t = transport.lowercased()
      if virtualFlag || t.contains("virtual") || product.lowercased().contains("virtual") {
        return Dev(counted: false, kind: kind, why: "virtual device (\(transport.isEmpty ? "no transport" : transport))")
      }
      if builtIn { return Dev(counted: true, kind: kind, why: "built-in (\(transport))") }
      let real = ["usb", "bluetooth", "bluetooth low energy", "bluetoothlowenergy", "spi", "i2c", "fifo", "aid", "airpod"]
      if real.contains(t) { return Dev(counted: true, kind: kind, why: "hardware, \(transport)") }
      return Dev(counted: true, kind: kind, why: "unknown transport '\(transport)', counted to be safe")
    }

    let matching: [[String: Int]] = [
      [kIOHIDDeviceUsagePageKey: 0x01, kIOHIDDeviceUsageKey: 0x06],   // keyboard
      [kIOHIDDeviceUsagePageKey: 0x01, kIOHIDDeviceUsageKey: 0x07],   // keypad
      [kIOHIDDeviceUsagePageKey: 0x01, kIOHIDDeviceUsageKey: 0x02],   // mouse
      [kIOHIDDeviceUsagePageKey: 0x01, kIOHIDDeviceUsageKey: 0x01],   // pointer
      [kIOHIDDeviceUsagePageKey: 0x0D, kIOHIDDeviceUsageKey: 0x05],   // touch pad
    ]

    let manager = IOHIDManagerCreate(kCFAllocatorDefault, IOOptionBits(kIOHIDOptionsTypeNone))
    IOHIDManagerSetDeviceMatchingMultiple(manager, matching as CFArray)

    if mode == "list" {
      let r = IOHIDManagerOpen(manager, IOOptionBits(kIOHIDOptionsTypeNone))
      let set = IOHIDManagerCopyDevices(manager) as? Set<IOHIDDevice> ?? []
      print("access: \(accessName()); open: \(String(format: "0x%08x", r)); devices: \(set.count)")
      for d in set {
        let c = classify(d)
        let page = (prop(d, kIOHIDPrimaryUsagePageKey) as? Int) ?? 0, usage = (prop(d, kIOHIDPrimaryUsageKey) as? Int) ?? 0
        print("  \(c.counted ? "COUNTED" : "ignored") \(c.kind) usage \(page):\(usage) - \(c.why) - \((prop(d, kIOHIDProductKey) as? String) ?? "?")")
      }
      exit(0)
    }

    // ---------------------------------------------------------------------------------------------- state
    let started = Int(Date().timeIntervalSince1970)
    var lastKeyboard = 0, lastPointer = 0, dirty = true, lastWrite = 0.0
    var access = accessName()

    func writeState() {
      let now = Int(Date().timeIntervalSince1970)
      var locked = 0
      if let s = CGSessionCopyCurrentDictionary() as? [String: Any], (s["CGSSessionScreenIsLocked"] as? Bool) == true { locked = 1 }
      let asleep = CGDisplayIsAsleep(CGMainDisplayID()) != 0 ? 1 : 0
      let thermal: String
      switch ProcessInfo.processInfo.thermalState {
      case .nominal: thermal = "nominal"
      case .fair: thermal = "fair"
      case .serious: thermal = "serious"
      case .critical: thermal = "critical"
      @unknown default: thermal = "unknown"
      }
      let counted = devices.values.filter { $0.counted }.count
      let text = """
        version=1
        started=\(started)
        heartbeat=\(now)
        access=\(access)
        last_keyboard=\(lastKeyboard)
        last_pointer=\(lastPointer)
        devices_counted=\(counted)
        devices_ignored=\(devices.count - counted)
        screen_locked=\(locked)
        display_asleep=\(asleep)
        thermal=\(thermal)

        """
      let tmp = outDir + "/.activity.tmp", dst = outDir + "/activity"
      if FileManager.default.createFile(atPath: tmp, contents: text.data(using: .utf8), attributes: [.posixPermissions: 0o640]) {
        _ = rename(tmp, dst)
      } else {
        note("cannot write \(dst)")
      }
      dirty = false
      lastWrite = Date().timeIntervalSince1970
    }

    // ---------------------------------------------------------------------------------------------- callbacks
    let matched: IOHIDDeviceCallback = { _, _, _, device in
      let c = classify(device)
      devices[Unmanaged.passUnretained(device).toOpaque()] = c
      note("device \(c.counted ? "counted" : "ignored"): \(c.kind), \(c.why), \((prop(device, kIOHIDProductKey) as? String) ?? "?")")
      dirty = true
    }
    let removed: IOHIDDeviceCallback = { _, _, _, device in
      devices.removeValue(forKey: Unmanaged.passUnretained(device).toOpaque())
      dirty = true
    }
    let input: IOHIDValueCallback = { _, _, _, value in
      let element = IOHIDValueGetElement(value)
      let device = IOHIDElementGetDevice(element)
      guard let dev = devices[Unmanaged.passUnretained(device).toOpaque()], dev.counted else { return }
      guard IOHIDValueGetIntegerValue(value) != 0 else { return }   // key-ups, zero motion: not new activity
      let page = IOHIDElementGetUsagePage(element), usage = IOHIDElementGetUsage(element)
      let now = Int(Date().timeIntervalSince1970)
      if dev.kind == "keyboard" {
        // keys (page 7, 0x04...0xE7) and media keys (page 0x0C); anything else on a keyboard is ignored
        if (page == 0x07 && usage >= 0x04 && usage <= 0xE7) || page == 0x0C { if now != lastKeyboard { lastKeyboard = now; dirty = true } }
      } else {
        if now != lastPointer { lastPointer = now; dirty = true }
      }
    }

    do {   // the output folder must exist (the installer makes it, owner-writable, readable by the worker)
      var isDir: ObjCBool = false
      if !FileManager.default.fileExists(atPath: outDir, isDirectory: &isDir) || !isDir.boolValue {
        note("no folder \(outDir)"); exit(1)
      }
    }

    if access != "granted" {
      note("Input Monitoring: \(access); asking macOS (System Settings > Privacy & Security > Input Monitoring)")
      _ = IOHIDRequestAccess(kIOHIDRequestTypeListenEvent)
      access = accessName()
    }
    if access == "granted" {
      IOHIDManagerRegisterDeviceMatchingCallback(manager, matched, nil)
      IOHIDManagerRegisterDeviceRemovalCallback(manager, removed, nil)
      IOHIDManagerRegisterInputValueCallback(manager, input, nil)
      IOHIDManagerScheduleWithRunLoop(manager, CFRunLoopGetCurrent(), CFRunLoopMode.defaultMode.rawValue)
      let r = IOHIDManagerOpen(manager, IOOptionBits(kIOHIDOptionsTypeNone))
      if r != kIOReturnSuccess {
        note(String(format: "IOHIDManagerOpen failed: 0x%08x", r))
        access = "denied"
      } else {
        note("watching (access granted)")
      }
    }
    writeState()

    let timer = Timer(timeInterval: 5, repeats: true) { _ in
      let now = Date().timeIntervalSince1970
      if access != "granted" {
        access = accessName()
        if access == "granted" { note("access granted; restarting to start watching"); writeState(); exit(0) }   // launchd starts it again
      }
      if dirty || now - lastWrite >= 30 { writeState() }
    }
    RunLoop.current.add(timer, forMode: .default)
    signal(SIGTERM) { _ in exit(0) }
    RunLoop.current.run()
  F_BUILD_PY: |
    """Build the two files to send: `Install Typd Worker.command` (one self-contained file: the installer plus every
    file it installs, as plain text, and the input watch program as base64) and `Uninstall Typd Worker.command`, and
    `TypdWorker.zip` with both and the README (the .command files marked executable, as Finder needs them).

        python mac-runner/build.py                 # the owner's: worker.conf, README-<owner>.md, prebuilt/typd-input-watch
        python3 build.py --src src --conf ci.conf --helper ./typd-input-watch --readme README.md --out out   # CI

    The input watch program is built from src/input-watch.swift on GitHub's macOS runner (the test workflow), and its
    SHA-256 goes into the installer, which checks it before installing.
    """
    import argparse, base64, hashlib, os, re, sys, zipfile
    from pathlib import Path

    HERE = Path(__file__).resolve().parent
    EOF_MARK = 'TYPD_PAYLOAD_EOF'
    TEXT = ['install.sh', 'idlegate', 'typd-worker', 'status.sh', 'runner-service', 'com.typd.worker.runner.plist',
            'com.typd.worker.inputwatch.plist', 'Info.plist', 'input-watch.swift', 'uninstall.sh']


    def lf(p):
        t = Path(p).read_text(encoding='utf-8').replace('\r\n', '\n')
        assert '\r' not in t, p
        return t


    def heredoc(dest, text):
        assert EOF_MARK not in text, dest
        if not text.endswith('\n'):
            text += '\n'
        return f"  cat > \"$d/{dest}\" <<'{EOF_MARK}'\n{text}{EOF_MARK}\n"


    def build(src, conf, helper, readme, out):
        src, out = Path(src), Path(out)
        out.mkdir(parents=True, exist_ok=True)
        binary = Path(helper).read_bytes()
        assert binary[:4] in (b'\xcf\xfa\xed\xfe', b'\xca\xfe\xba\xbe'), 'the input watch is not a Mach-O program'
        sha = hashlib.sha256(binary).hexdigest()
        uninstall = lf(src / 'uninstall.sh')
        parts = ['payload_extract() {   # every file the installer installs, as written in mac-runner/src\n', '  local d=$1\n']
        for name in TEXT:
            if name != 'uninstall.sh':
                parts.append(heredoc(name, lf(src / name)))
        parts.append(heredoc('uninstall.command', uninstall))
        parts.append(heredoc('worker.conf', lf(conf)))
        parts.append(heredoc('README.md', lf(readme)))
        parts.append(heredoc('typd-input-watch.sha256', sha))
        b64 = base64.encodebytes(binary).decode('ascii')
        parts.append(f"  # Typd Worker Input Watch, built from input-watch.swift (above) on GitHub's macOS runner; sha256 {sha}\n")
        parts.append(f"  /usr/bin/base64 --decode > \"$d/typd-input-watch\" <<'{EOF_MARK}'\n{b64}{EOF_MARK}\n")
        parts.append('  chmod 755 "$d/install.sh" "$d/idlegate" "$d/typd-worker" "$d/status.sh" "$d/runner-service" "$d/uninstall.command"\n}\n')
        installer = lf(src / 'install.sh')
        assert installer.count('# @@PAYLOAD@@\n') == 1
        installer = installer.replace('# @@PAYLOAD@@\n', ''.join(parts))
        files = {'Install Typd Worker.command': installer, 'Uninstall Typd Worker.command': uninstall}
        for name, text in files.items():
            p = out / name
            p.write_bytes(text.encode('utf-8'))
            os.chmod(p, 0o755)
        z = out / 'TypdWorker.zip'
        with zipfile.ZipFile(z, 'w', zipfile.ZIP_DEFLATED) as zf:
            for name, data, mode in [('Install Typd Worker.command', files['Install Typd Worker.command'], 0o755),
                                     ('Uninstall Typd Worker.command', files['Uninstall Typd Worker.command'], 0o755),
                                     ('README.md', lf(readme), 0o644)]:
                zi = zipfile.ZipInfo('Typd Worker/' + name, date_time=(2026, 10, 25, 12, 0, 0))
                zi.create_system = 3                      # Unix, so the permission bits below count
                zi.external_attr = (0o100000 | mode) << 16
                zi.compress_type = zipfile.ZIP_DEFLATED
                zf.writestr(zi, data.encode('utf-8'))
        for p in [out / n for n in files] + [z]:
            print(f'{p.name}: {p.stat().st_size:,} bytes, sha256 {hashlib.sha256(p.read_bytes()).hexdigest()}')
        print(f'input watch: {len(binary):,} bytes, sha256 {sha}')


    if __name__ == '__main__':
        ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
        ap.add_argument('--src', default=str(HERE / 'src'))
        ap.add_argument('--conf', default=str(HERE / 'worker.conf'))
        ap.add_argument('--helper', default=str(HERE / 'prebuilt' / 'typd-input-watch'))
        ap.add_argument('--readme', default=str(next(iter(sorted(HERE.glob('README-*.md'))), HERE / 'README.md')))
        ap.add_argument('--out', default=str(HERE))
        a = ap.parse_args()
        build(a.src, a.conf, a.helper, a.readme, a.out)
  F_TESTS_CI_CONF: |
    # Test settings for GitHub's macOS runners (never registered anywhere: the test code is fake).
    REPO_URL=https://github.com/SameRainbows/typd-app
    RUNNER_NAME=ci-m5
    RUNNER_LABELS=ci-m5
    RUNNER_VERSION=2.338.1
    RUNNER_SHA256=52c3fb801b931fbd454979bae5ec3443ea3da2c4a1b4c44fa546fb630d61a0a9
    WORKER_USER=typdworker
    IDLE_MINUTES=15
    BUSY_CPU_PERCENT=25
    BUSY_GPU_PERCENT=20
    CHECK_SECONDS=60
    RESPECT_VIDEO=1
  F_TESTS_GATE_TEST_SH: |
    #!/bin/bash
    # The idle gate's logic with simulated conditions (TYPD_GATE_FAKE files), on macOS's own /bin/bash 3.2:
    # the verdicts, waiting, pausing (SIGSTOP) and resuming (SIGCONT) a whole process tree, the two-check rule for
    # soft conditions, the owner's pause, the time limit, evict-and-start-again, and cancel while frozen.
    #   /bin/bash gate_test.sh PATH/TO/idlegate
    set -u
    G=${1:?idlegate}
    T=$(mktemp -d /tmp/gatetest.XXXXXX)
    F=$T/fake; mkdir -p "$F" "$T/shared/control" "$T/jobs"
    cat > "$T/conf" <<EOF
    WORKER_USER=nobody-here
    IDLE_MINUTES=15
    BUSY_CPU_PERCENT=25
    BUSY_GPU_PERCENT=20
    CHECK_SECONDS=1
    SHARED=$T/shared
    LOGDIR=$T
    EOF
    export TYPD_WORKER_CONF=$T/conf TYPD_GATE_FAKE=$F TYPD_GATE_JOBS=$T/jobs TYPD_GATE_LOG=$T/gate.log
    PASS=0; FAILN=0
    ok() { PASS=$((PASS + 1)); echo "PASS $*"; }
    bad() { FAILN=$((FAILN + 1)); echo "FAIL $*"; }
    idle() { echo 3600 > "$F/input_idle"; echo AC > "$F/power"; echo 10 > "$F/cpu"; echo 0 > "$F/gpu"; echo 1 > "$F/mem"; echo nominal > "$F/thermal"; : > "$F/video"; rm -f "$T/shared/control/paused"; }
    stat_of() { ps -o stat= -p "$1" 2>/dev/null | tr -d ' '; }
    waitfor() {   # waitfor SECONDS COMMAND...: true when the command succeeds within the time
      local n=$(( $1 * 5 )); shift
      while [ $n -gt 0 ]; do "$@" && return 0; sleep 0.2; n=$((n - 1)); done; return 1
    }
    is_stopped() { case $(stat_of "$1") in T*) return 0;; esac; return 1; }
    is_running() { case $(stat_of "$1") in ""|T*|Z*) return 1;; esac; return 0; }
    gone() { ! kill -0 "$1" 2>/dev/null; }
    count() { wc -l < "$T/count" 2>/dev/null | tr -d ' '; }

    # 1. verdicts
    idle
    "$G" check > "$T/c.out"; [ $? = 0 ] && grep -q 'verdict: idle' "$T/c.out" && ok "check: idle" || { bad "check: idle"; cat "$T/c.out"; }
    for c in "input_idle 60 someone is using" "power battery on battery" "cpu 900 other programs are busy" "gpu 70 GPU is busy" \
             "mem 2 memory is tight" "thermal serious the Mac is hot" "video Safari a video or call"; do
      set -- $c; idle; echo "$2" > "$F/$1"; shift 2
      "$G" check > "$T/c.out"; rc=$?
      [ $rc = 1 ] && grep -q "verdict: wait - .*$*" "$T/c.out" && ok "check: $*" || { bad "check: $* (rc $rc)"; cat "$T/c.out"; }
    done
    idle; touch "$T/shared/control/paused"
    "$G" check > "$T/c.out"; [ $? = 1 ] && grep -q 'paused by the owner' "$T/c.out" && ok "check: owner's pause" || bad "check: owner's pause"
    idle; echo 2 > "$F/mem"; echo 'TYPD_X=1' >/dev/null
    TYPD_WORKER_CONF=$T/conf "$G" check >/dev/null; [ $? = 1 ] && ok "check: memory warning waits by default" || bad "memory warning"

    # 2. run: waits while busy, starts when idle, freezes the whole tree, continues, finishes with the command's code
    idle; echo 0 > "$F/input_idle"; rm -f "$T/count" "$T/kid.pid" "$T/job.pid"
    cat > "$T/job.sh" <<'EOF'
    #!/bin/bash
    # a parent, a child in the same group and a grandchild in a process group of its own (as a detached server)
    echo $$ > "$1/job.pid"
    perl -e 'setpgrp(0, 0); exec "sleep", "300"' & echo $! > "$1/kid.pid"
    for i in $(seq 1 60); do echo "$i" >> "$1/count"; sleep 0.2; done
    kill "$(cat "$1/kid.pid")" 2>/dev/null
    exit 7
    EOF
    "$G" run --name test1 -- /bin/bash "$T/job.sh" "$T" > "$T/run1.out" 2>&1 &
    GP=$!
    sleep 3; [ ! -f "$T/count" ] && ok "run: waits while the Mac is in use" || bad "run: started while in use"
    idle
    waitfor 8 test -s "$T/count" && ok "run: starts when idle (two good checks)" || bad "run: did not start"
    JP=$(cat "$T/job.pid"); KID=$(cat "$T/kid.pid" 2>/dev/null)
    echo 5 > "$F/input_idle"
    waitfor 5 is_stopped "$JP" && ok "run: input -> the job is frozen (stat $(stat_of "$JP"))" || bad "run: not frozen (stat $(stat_of "$JP"))"
    waitfor 3 is_stopped "$KID" && ok "run: its detached grandchild is frozen too" || bad "run: grandchild not frozen ($(stat_of "$KID"))"
    n1=$(count); sleep 2; n2=$(count)
    [ "$n1" = "$n2" ] && ok "run: no progress while frozen ($n1)" || bad "run: progress while frozen ($n1 -> $n2)"
    idle
    waitfor 6 is_running "$JP" && ok "run: idle again -> continues" || bad "run: did not continue ($(stat_of "$JP"))"
    sleep 1; n3=$(count); [ "$n3" -gt "$n2" ] && ok "run: progress after resume ($n2 -> $n3)" || bad "run: no progress after resume"
    wait $GP; rc=$?
    [ $rc = 7 ] && ok "run: exits with the command's code (7)" || bad "run: exit $rc, want 7"
    grep -q paused "$T/gate.log" && grep -q resumed "$T/gate.log" && ok "log: paused and resumed are logged" || bad "log lines"
    [ -z "$(ls "$T/jobs")" ] && ok "status file removed at the end" || bad "status file left"

    # 3. a soft condition needs two checks in a row; the owner's pause is immediate
    idle; rm -f "$T/count"
    "$G" run --name test2 -- /bin/bash -c "echo \$\$ > $T/job.pid; for i in \$(seq 1 200); do echo \$i >> $T/count; sleep 0.1; done" > "$T/run2.out" 2>&1 &
    GP=$!
    waitfor 8 test -s "$T/count"; JP=$(cat "$T/job.pid")
    echo 900 > "$F/cpu"; sleep 1.3
    is_stopped "$JP" && bad "soft: frozen after one check" || ok "soft: not frozen after one busy check"
    waitfor 4 is_stopped "$JP" && ok "soft: frozen after two busy checks" || bad "soft: not frozen"
    idle; waitfor 6 is_running "$JP" && ok "soft: continues" || bad "soft: did not continue"
    touch "$T/shared/control/paused"
    waitfor 3 is_stopped "$JP" && ok "owner's pause: frozen at once" || bad "owner's pause"
    idle; waitfor 6 is_running "$JP" && ok "owner's resume: continues" || bad "owner's resume"
    kill -TERM $GP; wait $GP; rc=$?
    gone "$JP" && [ $rc = 143 ] && ok "cancel (running): job ended, exit 143" || bad "cancel running: rc $rc"

    # 4. cancel while frozen: TERM + CONT, then KILL; the detached grandchild too
    idle; rm -f "$T/count" "$T/kid.pid" "$T/job.pid"
    "$G" run --name test3 -- /bin/bash "$T/job.sh" "$T" > "$T/run3.out" 2>&1 &
    GP=$!
    waitfor 8 test -s "$T/count"; JP=$(cat "$T/job.pid"); KID=$(cat "$T/kid.pid")
    echo battery > "$F/power"; waitfor 4 is_stopped "$JP"
    kill -TERM $GP; wait $GP; rc=$?
    waitfor 20 gone "$JP" && waitfor 5 gone "$KID" && [ $rc = 143 ] && ok "cancel (frozen): job and grandchild ended, exit 143" || bad "cancel frozen: rc $rc, $(stat_of "$JP") $(stat_of "$KID")"

    # 5. time limit (running time only)
    idle
    "$G" run --name test4 --max-active 3s -- sleep 100 > "$T/run4.out" 2>&1; rc=$?
    [ $rc = 124 ] && ! pgrep -f "^sleep 100" >/dev/null && ok "max-active: stopped, exit 124" || bad "max-active: rc $rc"

    # 6. --evict-after 0: stop (not freeze) when busy, start again from the top when idle
    idle; rm -f "$T/starts" "$T/count"
    "$G" run --name test5 --evict-after 0 -- /bin/bash -c "echo \$\$ > $T/job.pid; echo start >> $T/starts; for i in \$(seq 1 25); do echo \$i >> $T/count; sleep 0.2; done" > "$T/run5.out" 2>&1 &
    GP=$!
    waitfor 8 test -s "$T/count"; JP=$(cat "$T/job.pid"); echo 0 > "$F/input_idle"; sleep 3
    gone "$JP" && ok "evict 0: stopped when the Mac is used" || bad "evict 0: still there"
    idle; wait $GP; rc=$?
    [ $rc = 0 ] && [ "$(wc -l < "$T/starts" | tr -d ' ')" = 2 ] && ok "evict 0: started again and finished (2 starts)" || bad "evict 0: rc $rc, starts $(cat "$T/starts" | wc -l)"

    # 7. --evict-after: frozen too long -> stopped, then started again
    idle; rm -f "$T/starts" "$T/count"
    "$G" run --name test6 --evict-after 3s -- /bin/bash -c "echo start >> $T/starts; for i in \$(seq 1 25); do echo \$i >> $T/count; sleep 0.2; done" > "$T/run6.out" 2>&1 &
    GP=$!
    waitfor 8 test -s "$T/count"; echo 0 > "$F/input_idle"; sleep 7
    grep -q 'paused too long' "$T/gate.log" && ok "evict-after: stopped after being frozen too long" || bad "evict-after: no eviction"
    idle; wait $GP; rc=$?
    [ $rc = 0 ] && [ "$(wc -l < "$T/starts" | tr -d ' ')" = 2 ] && ok "evict-after: started again and finished" || bad "evict-after: rc $rc"

    # 8. --memory ignore lets a job run under memory pressure; critical waits only at critical
    idle; echo 2 > "$F/mem"
    "$G" run --name test7 --memory ignore -- true >/dev/null 2>&1 && ok "memory ignore: runs at warning" || bad "memory ignore"
    "$G" run --name test8 --memory critical -- true >/dev/null 2>&1 && ok "memory critical: runs at warning" || bad "memory critical"

    # 9. "boot it and it works": nobody logged in / the login window, a locked screen, a stale or missing input watch
    idle; rm -f "$F/input_idle"; echo 5 > "$F/hid"; echo no > "$F/locked"
    export TYPD_ACTIVITY=$T/activity; rm -f "$T/activity"
    echo root > "$F/console"
    "$G" check > "$T/c.out"; [ $? = 0 ] && grep -q 'nobody is logged in' "$T/c.out" && ok "login window (no session, no input watch): idle" || { bad "login window"; cat "$T/c.out"; }
    echo someone > "$F/console"
    "$G" check > "$T/c.out"; [ $? = 1 ] && grep -q 'HIDIdleTime' "$T/c.out" && ok "logged in, input 5 s ago, no input watch: waits" || { bad "logged in, recent input"; cat "$T/c.out"; }
    echo yes > "$F/locked"
    "$G" check > "$T/c.out"; [ $? = 0 ] && grep -q 'screen is locked' "$T/c.out" && ok "screen locked: idle" || { bad "locked"; cat "$T/c.out"; }
    echo no > "$F/locked"; now=$(date +%s)
    printf 'version=1\nstarted=%s\nheartbeat=%s\naccess=granted\nlast_keyboard=%s\nlast_pointer=0\n' $((now - 3600)) "$now" $((now - 60)) > "$T/activity"
    "$G" check > "$T/c.out"; [ $? = 1 ] && grep -q 'hardware watch: keyboard' "$T/c.out" && ok "input watch: a real key 1 min ago waits" || { bad "watch recent"; cat "$T/c.out"; }
    printf 'version=1\nstarted=%s\nheartbeat=%s\naccess=granted\nlast_keyboard=%s\nlast_pointer=0\n' $((now - 7200)) "$now" $((now - 1200)) > "$T/activity"
    echo 1 > "$F/hid"
    "$G" check > "$T/c.out"; [ $? = 0 ] && ok "input watch: 20 min without real input is idle although automation input was 1 s ago" || { bad "watch idle"; cat "$T/c.out"; }
    printf 'version=1\nstarted=%s\nheartbeat=%s\naccess=granted\nlast_keyboard=%s\nlast_pointer=0\n' $((now - 7200)) $((now - 900)) $((now - 60)) > "$T/activity"
    echo root > "$F/console"
    "$G" check > "$T/c.out"; [ $? = 0 ] && grep -q 'input watch: stale' "$T/c.out" && ok "logged out (watch stale): the login window counts as idle" || { bad "stale watch at login window"; cat "$T/c.out"; }
    unset TYPD_ACTIVITY; rm -f "$F/hid" "$F/console" "$F/locked"

    # 10. --needs-gb: a job waits while the owner's apps use the memory, starts when there is room
    idle; echo 2000 > "$F/avail_mb"; rm -f "$T/count"
    "$G" run --name test9 --needs-gb 4 -- /bin/bash -c "echo 1 >> $T/count" > "$T/run9.out" 2>&1 &
    GP=$!
    sleep 4; [ ! -f "$T/count" ] && grep -q 'not enough free memory' "$T/gate.log" && ok "needs-gb: waits with 2 GB free" || bad "needs-gb: started without room"
    echo 8000 > "$F/avail_mb"; wait $GP; rc=$?
    [ $rc = 0 ] && [ -f "$T/count" ] && ok "needs-gb: starts with 8 GB free" || bad "needs-gb: rc $rc"
    rm -f "$F/avail_mb"

    echo; echo "gate log:"; sed 's/^/  /' "$T/gate.log" | tail -40
    echo; echo "RESULT: $PASS passed, $FAILN failed"
    rm -rf "$T"
    [ $FAILN = 0 ]
  F_TESTS_INSTALL_TEST_SH: |
    #!/bin/bash
    # End-to-end test of the installer and the uninstaller on a disposable GitHub macOS runner. The runner's own
    # account plays the owner (an administrator). Never a real connection: the code is fake, so GitHub refuses it.
    #   /bin/bash install_test.sh DIST LOGS SYNTH      DIST: build.py's output; SYNTH: the synthetic-input poster
    set -u
    D=${1:?dist}; L=${2:?logs}; SYNTH=${3:-}
    mkdir -p "$L"
    I="$D/Install Typd Worker.command"; U="$D/Uninstall Typd Worker.command"
    export TYPD_WORKER_TEST=1
    PASS=0; FAILN=0
    ok() { PASS=$((PASS + 1)); echo "PASS $*"; }
    bad() { FAILN=$((FAILN + 1)); echo "FAIL $*"; }
    check() { local what=$1; shift; if "$@" >/dev/null 2>&1; then ok "$what"; else bad "$what"; fi; }
    nocheck() { local what=$1; shift; if "$@" >/dev/null 2>&1; then bad "$what"; else ok "$what"; fi; }
    W=typdworker
    FAKE=TYPDTESTFAKECODE7Q3X9K2M4W8XY   # 29 characters, the shape of a registration code; GitHub refuses it
    lim() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # no step may hang on a permission prompt
    shot() { lim 20 screencapture -x "$L/$1.png" 2>/dev/null && echo "screenshot $1.png" || echo "no screenshot ($1)"; }

    echo "== owner: $(id -un), home $(stat -f '%Sp %Su:%Sg' "$HOME"), macOS $(sw_vers -productVersion)"
    echo "secret" > "$HOME/tw-secret.txt"; chmod 644 "$HOME/tw-secret.txt"; mkdir -p "$HOME/tw-project"; chmod 755 "$HOME/tw-project"
    OWNER_HOME_MODE=$(stat -f %Lp "$HOME")
    ac_sleep() { pmset -g custom | awk '/^AC Power:/ {ac = 1; next} /^[A-Za-z].*:$/ {ac = 0} ac && $1 == "sleep" {print $2; exit}'; }
    SLEEP0=$(ac_sleep); [ "$SLEEP0" != 0 ] || { sudo pmset -c sleep 7; SLEEP0=7; }   # a value to restore
    echo "== AC sleep before: $SLEEP0 min; $(fdesetup status 2>&1 | head -1)"

    echo "== 1. dry run and refusals change nothing"
    /bin/bash "$I" --dry-run > "$L/dry.txt" 2>&1; rc=$?
    [ $rc = 0 ] && grep -q 'What this will do' "$L/dry.txt" && grep -q 'dry run' "$L/dry.txt" && ok "dry run prints the plan" || bad "dry run (rc $rc)"
    nocheck "dry run created nothing" test -e /Library/TypdWorker
    TYPD_WORKER_TEST_CODE='not a code!' /bin/bash "$I" > "$L/badcode.txt" 2>&1; rc=$?
    [ $rc = 1 ] && grep -q 'does not look like a connection code' "$L/badcode.txt" && ok "a malformed code is refused" || bad "malformed code (rc $rc)"
    nocheck "a refused code created nothing" id $W

    echo "== 2. install (fake code: everything installed, GitHub refuses the connection)"
    TYPD_WORKER_TEST_CODE=$FAKE TYPD_WORKER_TEST_OPEN=1 TYPD_WORKER_TEST_WAIT=20 TYPD_WORKER_TEST_AWAKE=y /bin/bash "$I" > "$L/install1.txt" 2>&1; rc=$?
    shot settings-input-monitoring
    cat "$L/install1.txt"
    [ $rc = 3 ] && ok "install: finished, reports the code was not accepted (rc 3)" || bad "install rc $rc (want 3)"
    grep -q 'did not accept the connection code' "$L/install1.txt" && ok "install: says so in plain words" || bad "install: no plain message"
    sudo cat /Library/Logs/TypdWorker/install.log > "$L/install.log" 2>&1
    grep -qiE 'http|404|not found|unauthor|invalid|failed' "$L/install.log" && ok "config.sh received the code and GitHub answered (install.log)" || bad "no sign that config.sh used the code"
    sudo grep -rlI "$FAKE" /Library/TypdWorker /Library/Logs/TypdWorker /Users/Shared/TypdWorker /Users/$W /Library/LaunchDaemons "$HOME/Library/LaunchAgents" "/Applications/Typd Worker" 2>/dev/null > "$L/code-hits.txt"
    [ ! -s "$L/code-hits.txt" ] && ok "the code is in no file" || { bad "the code was written to: $(cat "$L/code-hits.txt")"; }

    [ "$(ac_sleep)" = 0 ] && [ "$(cat /Library/TypdWorker/pmset-ac-sleep.prev 2>/dev/null)" = "$SLEEP0" ] && ok "keep awake: AC sleep 0, the old value ($SLEEP0) kept" || bad "keep awake: sleep $(ac_sleep), prev $(cat /Library/TypdWorker/pmset-ac-sleep.prev 2>&1)"
    pmset -g custom | grep -E "^(AC|Battery) Power:|^ (sleep|displaysleep) " | sed "s/^/  /"
    echo "== 3. the account"
    check "account exists" id $W
    [ "$(dscl . -read /Users/$W UserShell | awk '{print $2}')" = /usr/bin/false ] && ok "no login shell" || bad "login shell"
    [ "$(dscl . -read /Users/$W IsHidden 2>/dev/null | awk '{print $2}')" = 1 ] && ok "hidden from the login window" || bad "not hidden"
    nocheck "not an administrator" dseditgroup -o checkmember -m $W admin
    nocheck "not in staff" dseditgroup -o checkmember -m $W staff
    [ "$(id -gn $W)" = $W ] && ok "primary group is its own ($(id -g $W))" || bad "primary group $(id -gn $W)"
    echo "groups of $W: $(id -Gn $W)"
    [ "$(stat -f '%Lp %Su' /Users/$W)" = "700 $W" ] && ok "its home is 700 and its own" || bad "home $(stat -f '%Lp %Su' /Users/$W)"
    nocheck "it cannot use sudo" sudo -n -u $W sudo -n true
    nocheck "it cannot read the owner's file (~/tw-secret.txt, mode 644)" sudo -n -u $W cat "$HOME/tw-secret.txt"
    nocheck "it cannot list the owner's home" sudo -n -u $W ls "$HOME"
    nocheck "it cannot list the owner's 755 project folder" sudo -n -u $W ls "$HOME/tw-project"
    echo "owner home was $OWNER_HOME_MODE, now $(stat -f %Lp "$HOME")"
    nocheck "it cannot change the settings file" sudo -n -u $W /bin/bash -c 'echo x >> /Library/TypdWorker/worker.conf'
    nocheck "it cannot change the gate" sudo -n -u $W /bin/bash -c 'echo x >> /Library/TypdWorker/bin/idlegate'
    nocheck "it cannot write the input watch's file" sudo -n -u $W /bin/bash -c 'echo x > /Users/Shared/TypdWorker/input/activity'

    echo "== 4. the service"
    sudo launchctl print system/com.typd.worker.runner > "$L/daemon.txt" 2>&1
    check "LaunchDaemon loaded" grep -q 'state = running' "$L/daemon.txt"
    pid=$(pgrep -u $W -f runner-service | head -1)
    [ -n "$pid" ] && [ "$(ps -o user= -p "$pid" | tr -d ' ')" = $W ] && ok "runner-service runs as $W (pid $pid)" || bad "runner-service not running as $W"
    sleep 2; cat /Library/Logs/TypdWorker/worker.log
    check "it logs that it is not connected" grep -q 'not connected to GitHub' /Library/Logs/TypdWorker/worker.log
    check "GitHub's runner is unpacked in its home" sudo test -x /Users/$W/actions-runner/run.sh
    [ "$(sudo stat -f %Su /Users/$W/actions-runner/run.sh)" = $W ] && ok "runner files belong to $W" || bad "runner owner"
    grep -E 'UserName|ProgramArguments|RunAtLoad|KeepAlive' -A1 /Library/LaunchDaemons/com.typd.worker.runner.plist | head -12
    sudo lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | awk -v w=$W '$3 == w' > "$L/listen.txt"
    [ ! -s "$L/listen.txt" ] && ok "nothing of $W listens on a port" || bad "$W listens: $(cat "$L/listen.txt")"

    echo "== 5. files and the owner's tools"
    for f in /Library/TypdWorker/bin/idlegate /Library/TypdWorker/bin/typd-worker /Library/TypdWorker/bin/status.sh; do
      [ "$(stat -f '%Su %Lp' "$f")" = "root 755" ] || bad "$f $(stat -f '%Su %Lp' "$f")"
    done; ok "programs root-owned, 755"
    ls -la "/Applications/Typd Worker" /Users/Shared/TypdWorker /Users/Shared/TypdWorker/input /Library/Logs/TypdWorker
    [ "$(stat -f '%Su:%Sg %Lp' /Users/Shared/TypdWorker/input)" = "$(id -un):$W 750" ] && ok "input folder: owner-writable, $W-readable only" || bad "input folder $(stat -f '%Su:%Sg %Lp' /Users/Shared/TypdWorker/input)"
    check "four double-click files and the README in Applications" test -x "/Applications/Typd Worker/Uninstall Typd Worker.command" -a -x "/Applications/Typd Worker/Typd Worker Status.command" -a -f "/Applications/Typd Worker/README.md"
    typd-worker status > "$L/status1.txt" 2>&1; cat "$L/status1.txt"
    check "typd-worker status works for the owner" grep -q 'Right now a job' "$L/status1.txt"
    grep -q '>> Not connected' "$L/status1.txt" && ok "status headline: Not connected (the fake code)" || bad "status headline: $(grep '>>' "$L/status1.txt")"
    grep -q 'Sleep        stays awake while plugged in' "$L/status1.txt" && ok "status shows it stays awake" || bad "status sleep line"
    typd-worker pause; check "pause: flag set without a password" test -e /Users/Shared/TypdWorker/control/paused
    typd-worker status | grep -q 'PAUSED by you' && ok "status shows the pause" || bad "status pause"
    sudo -n -u $W /Library/TypdWorker/bin/idlegate check > "$L/check-paused.txt" 2>&1; grep -q 'paused by the owner' "$L/check-paused.txt" && ok "the gate (as $W) sees the pause" || bad "gate pause"
    typd-worker resume; nocheck "resume: flag gone" test -e /Users/Shared/TypdWorker/control/paused
    sudo -n -u $W /Library/TypdWorker/bin/idlegate check > "$L/check-worker.txt" 2>&1; cat "$L/check-worker.txt"
    typd-worker stop; sleep 2
    ours() { ps -U "$(id -u $W)" -o pid=,comm= 2>/dev/null | awk '$2 !~ /^\/(System|usr\/libexec|usr\/sbin)\//'; }
    ps -U "$(id -u $W)" -o pid=,comm= 2>/dev/null | sed 's/^/  after stop: /'
    [ -z "$(ours)" ] && ok "stop: nothing of Typd Worker runs (macOS's own per-account agents aside)" || bad "stop: still running: $(ours | tr '\n' ' ')"
    sudo launchctl print-disabled system | grep -E 'com.typd.worker.runner' | head -2
    typd-worker status | grep -q '>> Off: stopped by you' && ok "status headline: Off" || bad "status off"
    typd-worker start; sleep 4
    [ -n "$(pgrep -u $W -f runner-service)" ] && ok "start: running again" || bad "start"

    echo "== 6. the input watch (LaunchAgent in the owner's session)"
    launchctl print "gui/$(id -u)/com.typd.worker.inputwatch" > "$L/agent.txt" 2>&1
    check "LaunchAgent loaded in gui/$(id -u)" grep -q 'state = running' "$L/agent.txt"
    codesign -dv "/Library/TypdWorker/Typd Worker Input Watch.app" 2>&1 | grep -E 'Identifier|Signature' | sed 's/^/  /'
    cat /Users/Shared/TypdWorker/input/activity 2>/dev/null; cat "$HOME/Library/Logs/TypdWorker/input-watch.log" 2>/dev/null | tail -5
    check "it writes its file" test -s /Users/Shared/TypdWorker/input/activity
    check "$W can read it" sudo -n -u $W cat /Users/Shared/TypdWorker/input/activity
    "/Library/TypdWorker/Typd Worker Input Watch.app/Contents/MacOS/typd-input-watch" --list 2>&1 | tee "$L/devices.txt"
    echo "-- trying to grant Input Monitoring on this throwaway VM (TCC databases), to test the watch itself"
    for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
      lim 20 sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags) VALUES ('kTCCServiceListenEvent', 'com.typd.worker.inputwatch', 0, 2, 4, 1, 'UNUSED', 0);" 2>&1 | sed "s#^#  $db: #"
    done
    launchctl kickstart -k "gui/$(id -u)/com.typd.worker.inputwatch"; sleep 8
    acc=$(sed -n 's/^access=//p' /Users/Shared/TypdWorker/input/activity)
    echo "access after the TCC attempt: $acc"
    if [ -n "$SYNTH" ]; then
      echo "-- synthetic input (CGEventPost, as an agent or automation would): does it count?"
      hid0=$(ioreg -c IOHIDSystem -r -d 1 -k HIDIdleTime | awk '/HIDIdleTime/ {printf "%d", $NF / 1e9; exit}')
      a0=$(grep -E 'last_(keyboard|pointer)' /Users/Shared/TypdWorker/input/activity | tr '\n' ' ')
      sleep 3; lim 30 "$SYNTH"; sleep 7
      hid1=$(ioreg -c IOHIDSystem -r -d 1 -k HIDIdleTime | awk '/HIDIdleTime/ {printf "%d", $NF / 1e9; exit}')
      a1=$(grep -E 'last_(keyboard|pointer)' /Users/Shared/TypdWorker/input/activity | tr '\n' ' ')
      echo "HIDIdleTime before $hid0 s, after $hid1 s; input watch before: $a0 after: $a1"
      [ "$hid1" -lt 5 ] && echo "  -> the synthetic events reset HIDIdleTime (why HIDIdleTime alone is not enough)"
      if [ "$acc" = granted ]; then
        [ "$a0" = "$a1" ] && ok "synthetic input is NOT counted by the input watch (access granted)" || bad "synthetic input was counted: $a0 -> $a1"
      else
        echo "  (not verifiable here: the watch has no Input Monitoring on this VM)"
      fi
      /Library/TypdWorker/bin/idlegate check | grep 'real input'
    fi

    echo "== 7. run again (repair; no new code: keeps everything)"
    # a runner registered under another name (as the first kit's): an update must keep it
    sudo sed -i '' 's/^RUNNER_NAME=.*/RUNNER_NAME=old-name/' /Library/TypdWorker/worker.conf
    printf '{\n  "agentId": 1,\n  "agentName": "registered-name",\n  "poolId": 1\n}\n' | sudo -u $W tee /Users/$W/actions-runner/.runner >/dev/null
    TYPD_WORKER_TEST_CODE= /bin/bash "$I" > "$L/install2.txt" 2>&1; rc=$?
    cat "$L/install2.txt" | grep -E '^- |already|PROBLEM|Done|Almost'
    [ $rc = 0 ] || [ $rc = 3 ] && ok "second run (an update, no code) finished (rc $rc)" || bad "second run rc $rc"
    grep -q 'already installed (unchanged' "$L/install2.txt" && ok "input watch kept as it was (its switch stays)" || bad "input watch reinstalled"
    [ "$(dscl . -list /Users | grep -cx $W)" = 1 ] && ok "still one account" || bad "accounts"
    grep -q '^RUNNER_NAME=registered-name$' /Library/TypdWorker/worker.conf && ok "update keeps the registered runner name" || bad "runner name: $(grep RUNNER_NAME /Library/TypdWorker/worker.conf)"
    sudo rm -f /Users/$W/actions-runner/.runner

    echo "== 8. Gatekeeper: what the owner meets when the file comes from the internet"
    Q=$L/gk; mkdir -p "$Q"; cp "$I" "$Q/Install Typd Worker.command"; cp "$D/TypdWorker.zip" "$Q/"
    qa="0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)"
    xattr -w com.apple.quarantine "$qa" "$Q/Install Typd Worker.command"; xattr -w com.apple.quarantine "$qa" "$Q/TypdWorker.zip"
    lim 30 spctl -a -t open --context context:primary-signature -vv "$Q/Install Typd Worker.command" > "$Q/spctl-open.txt" 2>&1; echo "spctl (open) rc $?: $(cat "$Q/spctl-open.txt")"
    lim 30 spctl -a -t execute -vv "$Q/Install Typd Worker.command" > "$Q/spctl-exec.txt" 2>&1; echo "spctl (execute) rc $?: $(cat "$Q/spctl-exec.txt")"
    lim 30 syspolicy_check distribution "$Q/Install Typd Worker.command" > "$Q/syspolicy.txt" 2>&1; echo "syspolicy_check: $(head -5 "$Q/syspolicy.txt")"
    mkdir -p "$Q/ditto" "$Q/unzip"
    ditto -x -k "$Q/TypdWorker.zip" "$Q/ditto"; unzip -q "$Q/TypdWorker.zip" -d "$Q/unzip"
    ls -l "$Q/ditto/Typd Worker" "$Q/unzip/Typd Worker"
    echo "quarantine after ditto: $(xattr -p com.apple.quarantine "$Q/ditto/Typd Worker/Install Typd Worker.command" 2>&1)"
    echo "quarantine after unzip: $(xattr -p com.apple.quarantine "$Q/unzip/Typd Worker/Install Typd Worker.command" 2>&1)"
    check "the zip keeps the .command files executable" test -x "$Q/ditto/Typd Worker/Install Typd Worker.command"
    lim 15 open "$Q/Install Typd Worker.command" & sleep 8; shot gatekeeper-double-click   # open waits for the dialog's answer
    lim 30 osascript -e 'tell application "System Events" to get name of every window of every process whose visible is true' > "$Q/windows.txt" 2>&1; cat "$Q/windows.txt"
    lim 30 osascript -e 'tell application "System Events" to get value of static text of window 1 of process "CoreServicesUIAgent"' > "$Q/gk-text.txt" 2>&1; echo "Gatekeeper dialog text: $(cat "$Q/gk-text.txt")"
    pkill -x CoreServicesUIAgent 2>/dev/null; pkill -x Terminal 2>/dev/null
    /bin/bash "$Q/Install Typd Worker.command" --dry-run > "$Q/bash-run.txt" 2>&1 && ok "bash <file> runs it despite the quarantine (the Terminal route)" || bad "bash route"

    echo "== 9. uninstall, then check everything is gone"
    TYPD_WORKER_YES=1 /bin/bash "$U" > "$L/uninstall1.txt" 2>&1; rc=$?
    cat "$L/uninstall1.txt"
    [ $rc = 0 ] && ok "uninstall: finished, checked" || bad "uninstall rc $rc"
    nocheck "account gone" id $W
    nocheck "group gone" dscl . -read /Groups/$W
    for p in /Users/$W /Library/TypdWorker /Library/Logs/TypdWorker /Users/Shared/TypdWorker "/Applications/Typd Worker" \
             /Library/LaunchDaemons/com.typd.worker.runner.plist /usr/local/bin/typd-worker "$HOME/Library/LaunchAgents/com.typd.worker.inputwatch.plist"; do
      nocheck "gone: $p" test -e "$p"
    done
    nocheck "daemon gone" sudo launchctl print system/com.typd.worker.runner
    nocheck "agent gone" launchctl print "gui/$(id -u)/com.typd.worker.inputwatch"
    [ -z "$(pgrep -u $W 2>/dev/null)" ] && ok "no processes left" || bad "processes left"
    check "the owner's files untouched" test -f "$HOME/tw-secret.txt"
    [ "$(ac_sleep)" = "$SLEEP0" ] && ok "uninstall put AC sleep back ($SLEEP0 min)" || bad "AC sleep after uninstall: $(ac_sleep), want $SLEEP0"

    echo "== 10. install and uninstall once more (a clean cycle)"
    TYPD_WORKER_TEST_CODE=$FAKE /bin/bash "$I" > "$L/install3.txt" 2>&1; rc=$?
    [ $rc = 3 ] && id $W >/dev/null 2>&1 && ok "reinstall after uninstall" || bad "reinstall rc $rc"
    TYPD_WORKER_YES=1 /bin/bash "$U" > "$L/uninstall2.txt" 2>&1; rc=$?
    [ $rc = 0 ] && ! id $W >/dev/null 2>&1 && ok "uninstall again" || bad "uninstall again rc $rc"

    rm -rf "$HOME/tw-secret.txt" "$HOME/tw-project"
    echo; echo "RESULT: $PASS passed, $FAILN failed"
    [ $FAILN = 0 ]
  F_TESTS_SYNTH_SWIFT: |
    // Synthetic input, as an AI agent, automation or remote control posts it (CGEventPost at the HID level):
    // mouse moves and Shift presses (Shift types nothing). The test checks that HIDIdleTime resets and the input
    // watch does not count it.
    import CoreGraphics
    import Foundation

    let src = CGEventSource(stateID: .hidSystemState)
    for i in 0..<30 {
      let p = CGPoint(x: 300 + i * 7, y: 300 + i * 3)
      CGEvent(mouseEventSource: src, mouseType: .mouseMoved, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
      usleep(30_000)
    }
    for _ in 0..<3 {
      CGEvent(keyboardEventSource: src, virtualKey: 0x38, keyDown: true)?.post(tap: .cghidEventTap)
      usleep(20_000)
      CGEvent(keyboardEventSource: src, virtualKey: 0x38, keyDown: false)?.post(tap: .cghidEventTap)
      usleep(20_000)
    }
    print("posted 30 mouse moves and 3 Shift presses")
  F_JOBS_LIB_SH: |
    # Shared by the Mac worker's jobs (sourced). Runs as typdworker: no sudo, no git, no Homebrew; /usr/bin/jq (macOS 15+).
    CACHE=${TW_CACHE:-$HOME/typd-cache}
    cd "$HOME" 2>/dev/null || cd /   # never depend on the caller's folder (it may be one this account cannot open)
    UV_VERSION=0.13.5
    UV_SHA=743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73
    API=${GITHUB_API_URL:-https://api.github.com}

    note() { printf '%s %s\n' "$(date '+%H:%M:%S')" "$*"; }
    results_dir() { echo "$HOME/typd-results/${GITHUB_RUN_ID:-local}"; }

    # fetch URL DEST SHA256: download once (resumes a partial file), check the SHA-256, keep it in the cache
    fetch() {
      local url=$1 dest=$2 sha=$3
      if [ -f "$dest" ] && [ -f "$dest.ok" ] && [ "$(cat "$dest.ok")" = "$sha" ]; then return 0; fi
      mkdir -p "$(dirname "$dest")"
      local i
      for i in 1 2 3 4; do
        curl -fL --retry 3 --connect-timeout 30 -C - -A 'typd-mac-worker/1.0' -o "$dest.part" "$url" && break
        note "download attempt $i failed: $url"; sleep $((i * 10))
      done
      local got; got=$(shasum -a 256 "$dest.part" 2>/dev/null | cut -d' ' -f1)
      if [ "$got" != "$sha" ]; then note "checksum mismatch for $url: $got"; rm -f "$dest.part"; return 1; fi
      mv -f "$dest.part" "$dest"; echo "$sha" > "$dest.ok"
    }

    # uv (Astral's Python manager, one static binary): a private Python for the jobs, nothing installed system-wide
    ensure_uv() {
      UV=$CACHE/uv/$UV_VERSION/uv
      if [ ! -x "$UV" ]; then
        fetch "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-aarch64-apple-darwin.tar.gz" "$CACHE/uv/uv-$UV_VERSION.tar.gz" "$UV_SHA" || return 1
        mkdir -p "$CACHE/uv/$UV_VERSION" && tar xzf "$CACHE/uv/uv-$UV_VERSION.tar.gz" -C "$CACHE/uv/$UV_VERSION" --strip-components 1 || return 1
      fi
      export UV_CACHE_DIR=$CACHE/uv/cache UV_PYTHON_INSTALL_DIR=$CACHE/uv/python UV_NO_CONFIG=1 UV_PYTHON_PREFERENCE=only-managed
    }
    # py [--with PKG]... SCRIPT ARGS: run a Python script with uv's Python 3.12 (isolated from the script's folder)
    py() { "$UV" run -q --no-project --python 3.12 "$@"; }

    # Releases of this (private) repository, through the REST API with the job's token (no gh needed)
    gh_api() { curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$@"; }
    release_id() {   # a release by tag; drafts (no tag yet) only through the list, which a write token sees
      local id
      id=$(gh_api "$API/repos/$GITHUB_REPOSITORY/releases/tags/$1" 2>/dev/null | jq -r .id)
      [ -n "$id" ] && [ "$id" != null ] || id=$(gh_api "$API/repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -r --arg t "$1" '[.[] | select(.tag_name == $t)][0].id')
      [ -n "$id" ] && [ "$id" != null ] && echo "$id"
    }
    # release_get TAG ASSET DEST: one asset of a (pre)release
    release_get() {
      local rid aid
      rid=$(release_id "$1") || { note "no release $1"; return 1; }
      aid=$(gh_api "$API/repos/$GITHUB_REPOSITORY/releases/$rid/assets?per_page=100" | jq -r --arg n "$2" '.[] | select(.name == $n) | .id')
      [ -n "$aid" ] || { note "no asset $2 in $1"; return 1; }
      curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/octet-stream' -o "$3" "$API/repos/$GITHUB_REPOSITORY/releases/assets/$aid"
    }
    # draft_release TAG TITLE BODYFILE FILE...: a DRAFT release (only people with write access see it) with the files
    draft_release() {
      local tag=$1 title=$2 body=$3; shift 3
      local rid up f
      rid=$(jq -n --arg t "$tag" --arg n "$title" --rawfile b "$body" --arg c "${GITHUB_SHA:-main}" \
              '{tag_name: $t, name: $n, body: ($b | .[0:120000]), draft: true, target_commitish: $c}' |
            gh_api -X POST "$API/repos/$GITHUB_REPOSITORY/releases" -d @- | jq -r .id) || return 1
      [ -n "$rid" ] && [ "$rid" != null ] || return 1
      for f in "$@"; do
        up="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rid/assets?name=$(basename "$f")"
        curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Content-Type: application/octet-stream' --data-binary @"$f" "$up" | jq -r '"uploaded \(.name) \(.size) bytes"' || return 1
      done
      [ "$(gh_api "$API/repos/$GITHUB_REPOSITORY/releases/$rid" | jq -r .draft)" = true ]
    }

    # ensure_app DIR: Typd's shipped Mac app (the dmg, cached and checked) unpacked into DIR; sets APP, APP_ASAR, LLAMA_SERVER
    ensure_app() {
      : "${DMG_URL:=https://typd-collect.mehmetdedeler.com/download/Typd-0.2.11-mac-arm64.dmg}"
      : "${DMG_SHA:=e1d7f4bde9e10f8810f9a9a1555be18e4b01769157761475cd64625aa2806c5b}"
