    ensure_model() {
      local v=$1 m=${TYPD_MODELS:-$CACHE/models} log=${2:-/dev/null}
      if ! ls -d "$m/$v"/*/ 2>/dev/null | grep -qv partial; then
        note "model $v through the app's updater (public route, signed manifest, sha256 checked)" >&2
        ELECTRON_RUN_AS_NODE=1 perl -e 'alarm shift; exec @ARGV' 3600 "$APP" "$J/bench.js" fetch "$v" "$m/$v" > "$log" 2>&1 || { tail -5 "$log" >&2; return 1; }
      fi
      ls -d "$m/$v"/*/ 2>/dev/null | grep -v partial | head -1
    }
  F_JOBS_BENCH_SH: |
    #!/bin/bash
    # Job (a): Typd on a real Apple-silicon Mac. The shipped app's own pipeline (its llama.cpp on the real Metal GPU),
    # the models fetched by the app's own updater, real speech fed in real time as the overlay sends it (so "work
    # while you talk" runs as in the app); release-to-text latency, cold and warm, short and long clips; the server's
    # peak memory and the system's memory state. The harness is the 8 GB test's (bench.js, sampler.py, summary.py).
    #
    #   bench.sh OUTDIR       PHASE=main (default): every mode in MODES on a quiet Mac
    #                         PHASE=squeeze: the same while another process holds all memory but SQUEEZE_GB
    #                         (an 8 GB Mac's budget on a big Mac; run with idlegate --evict-after 0 --memory ignore)
    # Env: MODES ("p2d_low p2d_normal light_low"), SETS ("A B": A = short clips, B = the 36 s clip), IDLE_S (30),
    #      SQUEEZE_GB (8), CLIPS (all | jfk), DMG_URL/DMG_SHA (the live 0.2.11 download), DMG_FILE (a local copy).
    # Speech is public domain only (whisper.cpp's jfk.wav; a 2008 US presidential radio address, Wikimedia Commons).
    set -u
    J=$(cd "$(dirname "$0")" && pwd)
    . "$J/lib.sh"
    OUT=${1:?output folder}
    : "${MODES:=p2d_low p2d_normal light_low}" "${SETS:=A B}" "${IDLE_S:=30}" "${PHASE:=main}" "${SQUEEZE_GB:=8}" "${CLIPS:=all}"
    JFK_URL=https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
    JFK_SHA=59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e
    RADIO_URL=https://upload.wikimedia.org/wikipedia/commons/2/22/George_W._Bush%27s_weekly_radio_address_%28November_1%2C_2008%29.oga
    RADIO_SHA=b844a36b9b0c0d777c64f1d62356bf0b6cad6a0f753627f5a7e7abd17c843f0c
    L=$OUT/$PHASE
    rm -rf "$L"; mkdir -p "$L"   # a pass the gate stopped starts again clean
    T=$(mktemp -d "${TMPDIR:-/tmp}/typd-bench.XXXXXX")
    finish() {
      touch "$L/stop"; sleep 2
      pkill -f "$T/Typd.app/Contents/Resources/llama/llama-server" 2>/dev/null
      [ -f "$L/hog.pid" ] && kill "$(cat "$L/hog.pid")" 2>/dev/null
      [ -d "$T/mnt" ] && hdiutil detach "$T/mnt" -quiet 2>/dev/null
      rm -rf "$T"
    }
    trap finish EXIT
    ensure_uv || exit 1

    if [ "$PHASE" = main ]; then
      { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string
        echo "memory: $(( $(sysctl -n hw.memsize) / 1048576 )) MB, cpus: $(sysctl -n hw.ncpu) ($(sysctl -n hw.perflevel0.logicalcpu 2>/dev/null) performance)"
        system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Chipset|Metal|Cores' | sed 's/^ *//'
        echo "iogpu.wired_limit_mb: $(sysctl -n iogpu.wired_limit_mb 2>&1)"; pmset -g batt | head -1
        echo "pressure $(sysctl -n kern.memorystatus_vm_pressure_level), free% $(sysctl -n kern.memorystatus_level), swap $(sysctl -n vm.swapusage)"
      } > "$OUT/machine.txt" 2>&1
      cat "$OUT/machine.txt"
    fi

    note "the app"
    ensure_app "$T" | tee "$OUT/app.txt"; [ -x "$T/Typd.app/Contents/MacOS/Typd" ] || exit 1
    APP=$T/Typd.app/Contents/MacOS/Typd; export APP_ASAR=$T/Typd.app/Contents/Resources/app.asar

    note "speech clips"
    C=$CACHE/clips
    fetch "$JFK_URL" "$C/jfk.wav" "$JFK_SHA" || exit 1
    CL="{\"jfk\":\"$C/jfk.wav\""
    if [ "$CLIPS" = all ]; then
      fetch "$RADIO_URL" "$C/radio.oga" "$RADIO_SHA" || exit 1
      [ -f "$C/long36.wav" ] || py --with numpy==2.4.6 --with scipy==1.17.1 --with soundfile==0.14.0 python -I "$J/clips.py" "$C/radio.oga" "$C" | tee "$OUT/clips.txt"
      CL="$CL,\"short5a\":\"$C/short5a.wav\",\"short5b\":\"$C/short5b.wav\",\"long36\":\"$C/long36.wav\""
    else
      CL="$CL,\"short5a\":\"$C/jfk.wav\",\"short5b\":\"$C/jfk.wav\",\"long36\":\"$C/jfk.wav\""   # CI: one clip for all
    fi
    CL="$CL}"

    FULL=""; LIGHT=""
    case " $MODES " in *" p2d_"*) FULL=$(ensure_model full "$OUT/fetch-full.log") || exit 1;; esac
    case " $MODES " in *" light_"*) LIGHT=$(ensure_model light "$OUT/fetch-light.log") || exit 1;; esac
    mdir() { case $1 in p2d_*) echo "$FULL";; *) echo "$LIGHT";; esac; }
    mlow() { case $1 in *_low) echo 1;; *) echo 0;; esac; }

    FAILS=0
    echo baseline > "$L/phase"; rm -f "$L/stop" "$L/hog.pid"
    py python -I "$J/sampler.py" "$L/samples.jsonl" "$L/phase" "$L/stop" "$L/hog.pid" > "$L/sampler.out" 2>&1 &
    sleep 10
    one() {   # $1 label, $2 set, $3 model dir, $4 low
      local f="${1//\//_}"
      echo "gap" > "$L/phase"; sleep 3
      note "=== $1 free% $(sysctl -n kern.memorystatus_level) swap $(sysctl -n vm.swapusage | grep -oE 'used = [0-9.]+M')"
      cfg="{\"label\":\"$1\",\"set\":\"$2\",\"low\":\"$4\",\"modelDir\":\"${3%/}\",\"out\":\"$L/phase-$f.json\",\"clips\":$CL,\"idleS\":$IDLE_S,\"phaseFile\":\"$L/phase\"}"
      ELECTRON_RUN_AS_NODE=1 perl -e 'alarm shift; exec @ARGV' 1200 "$APP" "$J/bench.js" run "$cfg" > "$L/run-$f.out" 2> "$L/run-$f.err"
      local rc=$?
      echo "exit $rc"; [ $rc = 0 ] || { FAILS=$((FAILS + 1)); tail -3 "$L/run-$f.err"; }
      grep -E '^(WARM|DICTATION) ' "$L/run-$f.out" | cut -c1-300
      pkill -f "$T/Typd.app/Contents/Resources/llama/llama-server" 2>/dev/null; sleep 2
    }
    if [ "$PHASE" = squeeze ]; then
      total_mb=$(( $(sysctl -n hw.memsize) / 1048576 ))
      avail_mb=$(vm_stat | awk '/page size of/ {ps = $8} /^Pages (free|inactive|speculative|purgeable):/ {gsub(/\./, "", $NF); s += $NF} END {printf "%d", s * ps / 1048576}')
      hog_mb=$(( total_mb - SQUEEZE_GB * 1024 )); [ $hog_mb -gt $((avail_mb - 1024)) ] && hog_mb=$((avail_mb - 1024))
      echo "squeeze: ${total_mb} MB Mac, ${avail_mb} MB available, another process holds ${hog_mb} MB (target: ${SQUEEZE_GB} GB for everything else)" | tee "$L/squeeze.txt"
      if [ $hog_mb -lt 2048 ]; then
        echo "skipped: less than 2 GB could be held (other apps are using the memory); run it again on a quieter Mac" | tee -a "$L/squeeze.txt"
      else
        echo hog > "$L/phase"
        perl -e 'alarm shift; exec @ARGV' 2400 "$UV" run -q --no-project --python 3.12 python -I "$J/hog.py" "$(awk -v m="$hog_mb" 'BEGIN{printf "%.2f", m / 1024}')" > "$L/hog.out" 2>&1 &
        echo $! > "$L/hog.pid"; sleep 40; cat "$L/hog.out"
        grep -q 'allocated and filled' "$L/hog.out" || { note "the memory holder did not start"; FAILS=$((FAILS + 1)); }
        for mdl in $MODES; do for set in $SETS; do one "squeeze$SQUEEZE_GB/$mdl/$set" "$set" "$(mdir "$mdl")" "$(mlow "$mdl")"; done; done
        kill "$(cat "$L/hog.pid")" 2>/dev/null; rm -f "$L/hog.pid"
      fi
    else
      for mdl in $MODES; do for set in $SETS; do one "quiet/$mdl/$set" "$set" "$(mdir "$mdl")" "$(mlow "$mdl")"; done; done
    fi
    echo none > "$L/phase"; sleep 2; touch "$L/stop"; sleep 3
    py python -I "$J/summary.py" "$L" > "$L/summary.md" 2>&1
    cat "$L/summary.md"
    { echo "## $PHASE"; cat "$L/squeeze.txt" 2>/dev/null; cat "$L/summary.md"; echo; } >> "$OUT/summary.md"
    grep -lE '"err":"[^n]|failed to allocate|out of memory' "$L"/run-*.out "$L"/run-*.err 2>/dev/null && exit 2
    [ "$FAILS" = 0 ] || { note "$FAILS run(s) failed"; exit 2; }
    exit 0
  F_JOBS_BENCH_JS: |
    'use strict';
    // From the 8 GB Mac test (oss/typd-app.mem8gb-0.2.11.mac.yml), unchanged but for vmmap without sudo: on the
    // Mac worker the server runs as the same account (typdworker), so vmmap needs no rights it lacks.
    // Typd's own code, run by the app's runtime (ELECTRON_RUN_AS_NODE=1) from its app.asar.
    //   fetch <full|light> <modelsDir>     the app's model updater, public routes (signed manifest, sha256s)
    //   run <json>                          one server start: warm, idle, dictations, the server's peak memory
    const fs = require('fs'), path = require('path'), cp = require('child_process');
    const ASAR = process.env.APP_ASAR;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const now = () => Date.now();
    const mark = (f, s) => { if (f) fs.writeFileSync(f, s); };
    function readWav(f) {
      const b = fs.readFileSync(f);
      let p = 12, fmt = null, data = null;
      while (p + 8 <= b.length) {
        const id = b.toString('ascii', p, p + 4), n = b.readUInt32LE(p + 4);
        if (id === 'fmt ') fmt = { tag: b.readUInt16LE(p + 8), ch: b.readUInt16LE(p + 10), sr: b.readUInt32LE(p + 12), bits: b.readUInt16LE(p + 22) };
        if (id === 'data') { data = b.subarray(p + 8, Math.min(b.length, p + 8 + n)); break; }
        p += 8 + n + (n & 1);
      }
      if (!fmt || !data || fmt.tag !== 1 || fmt.bits !== 16 || fmt.sr !== 16000) throw new Error('want 16 kHz 16-bit PCM: ' + f);
      const frames = Math.floor(data.length / (2 * fmt.ch));
      const s = new Float32Array(frames);
      for (let i = 0; i < frames; i++) {
        let v = 0;
        for (let c = 0; c < fmt.ch; c++) v += data.readInt16LE((i * fmt.ch + c) * 2);
        s[i] = v / fmt.ch / 32768;
      }
      return { samples: s, sampleRate: fmt.sr };
    }
    async function fetchModel(variant, modelsDir) {
      const mu = require(path.join(ASAR, 'src', 'main', 'modelUpdate.js'));
      fs.mkdirSync(modelsDir, { recursive: true });
      const appVersion = JSON.parse(fs.readFileSync(path.join(ASAR, 'package.json'), 'utf8')).version;
      const t0 = now();
      let last = '';
      const upd = mu.createUpdater({
        config: { endpoint: mu.ENDPOINT, key: null }, modelsDir, bundledDir: path.join(modelsDir, 'none'), appVersion,
        variant: () => variant, networkCost: async () => 'unmetered', automatic: () => false, askFirst: () => false,
        switchModel: async () => {}, log: (...m) => console.log('[typd:models]', ...m)
      });
      upd.onChange((l) => { if (l && l !== last) { last = l; if (!/\d+ ?%/.test(l) || /0 ?%/.test(l)) console.log(`[line +${((now() - t0) / 1000).toFixed(1)}s] ${l}`); } });
      upd.start();
      while (now() - t0 < 30 * 60e3) {
        await sleep(1000);
        const act = mu.activeModel(modelsDir);
        if (!act) continue;
        upd.stop();
        const m = JSON.parse(fs.readFileSync(path.join(act.dir, 'manifest.json'), 'utf8'));
        const r = { variant, app: appVersion, version: act.version, dir: act.dir, seconds: (now() - t0) / 1000,
          files: m.files.map((x) => ({ name: x.name, size: x.size, sha256: x.sha256 })), model_json: JSON.parse(fs.readFileSync(path.join(act.dir, 'model.json'), 'utf8')) };
        console.log('FETCHED ' + JSON.stringify(r));
        process.exit(0);
      }
      console.error('no model after 30 min: ' + last);
      process.exit(1);
    }
    function vmmap(pid) {
      if (!pid) return null;
      try {
        const o = cp.execFileSync('vmmap', ['-summary', String(pid)], { encoding: 'utf8', timeout: 90000, maxBuffer: 64 << 20 });
        const g = (re) => { const m = re.exec(o); return m ? m[1] : null; };
        return { footprint: g(/Physical footprint:\s+(\S+)/), peak: g(/Physical footprint \(peak\):\s+(\S+)/),
          lines: o.split('\n').filter((l) => /IOAccelerator|IOKit|mapped file|MALLOC_LARGE|MALLOC_SMALL|VM_ALLOCATE|TOTAL/i.test(l)).slice(0, 30) };
      } catch (e) { return { error: String(e.message || e).slice(0, 300) }; }
    }
    async function once(pipe, audio, how) {
      const SR = 16000, CH = 4096;   // 256 ms, as the overlay sends it
      const ctl = new AbortController();
      const t0 = now();
      pipe.wake('');
      let stream = null;
      if (how === 'rt') {
        stream = pipe.openStream(ctl.signal, () => '');
        for (let i = 0; i < audio.samples.length; i += CH) {
          const due = t0 + ((Math.min(audio.samples.length, i + CH)) / SR) * 1000;
          const w = due - now(); if (w > 0) await sleep(w);
          if (stream) stream.push(audio.samples.slice(i, Math.min(audio.samples.length, i + CH)));
        }
      }
      const rel = now();
      let first = null, text = '', err = null;
      try {
        for await (const ev of pipe.run({ audio, contextBlock: '', signal: ctl.signal, stream })) {
          if (ev.type === 'partial' && first === null) first = now() - rel;
          if (ev.type === 'done') text = ev.text;
        }
      } catch (e) { err = String((e && e.message) || e); }
      const row = { releaseToTextMs: now() - rel, firstPartialMs: first, lateMs: how === 'rt' ? Math.round(rel - t0 - audio.samples.length / SR * 1000) : null, text, err };
      if (stream && stream.plan) row.plan = stream.plan;
      if (stream && stream.timings) row.requests = stream.timings.map((t) => ({ kind: t.kind, ms: t.ms, audioS: t.audioS, startS: t.startS, error: t.error }));
      return row;
    }
    async function runPhase(c) {
      Object.assign(process.env, { TYPD_MODEL_DIR: c.modelDir, TYPD_LOW_MEMORY: c.low, TYPD_DEBUG: '1', TYPD_NO_MODEL_UPDATE: '1',
        TYPD_LLAMA_SERVER: process.env.TYPD_LLAMA_SERVER || path.join(path.dirname(ASAR), 'llama', 'llama-server') });
      const pipe = require(path.join(ASAR, 'src', 'main', 'pipeline', 'index.js'));
      const local = require(path.join(ASAR, 'src', 'main', 'pipeline', 'local.js'));
      const res = { label: c.label, set: c.set, low: c.low, model: path.basename(c.modelDir), clips: [] };
      mark(c.phaseFile, c.label + ':warm');
      let t = now();
      try { await local.warm(); } catch (e) { res.warmError = String((e && e.message) || e); }
      res.warmMs = now() - t;
      Object.assign(res, { lowMemory: local.lowMemory, device: local.device, context: local.CONTEXT, pid: local.SERVER_PID, longLimits: local.longLimits(),
        args: local.serverArgs('99').filter((a) => !a.includes('/')).join(' '), conv: local.serverEnv({}, '99').MTMD_QWEN3A_CONV_GROUP || null });
      console.log('WARM ' + JSON.stringify(res));
      if (res.warmError) { fs.writeFileSync(c.out, JSON.stringify(res, null, 1)); process.exit(3); }
      res.afterWarm = vmmap(res.pid);
      if (c.set === 'M') {   // buffer sizes only (LLAMA_LOG_VERBOSITY=4 from the caller): the self-test was the one request
        local.stop(); await sleep(2000); mark(c.phaseFile, 'none');
        fs.writeFileSync(c.out, JSON.stringify(res, null, 1)); process.exit(0);
      }
      mark(c.phaseFile, c.label + ':idle');
      await sleep(c.idleS * 1000);
      const plan = c.set === 'A'
        ? [['short5a', 'rt', 'cold'], ['short5a', 'rt', 'warm'], ['short5b', 'rt', 'warm'], ['jfk', 'rt', 'warm'], ['jfk', 'rt', 'warm2']]
        : [['long36', 'rt', 'cold'], ['long36', 'rt', 'warm'], ['long36', 'batch', 'warm']];
      for (const [name, how, tag] of plan) {
        const audio = readWav(c.clips[name]);
        mark(c.phaseFile, `${c.label}:${name}:${how}:${tag}`);
        const row = { clip: name, how, tag, seconds: +(audio.samples.length / 16000).toFixed(2), ...(await once(pipe, audio, how)) };
        res.clips.push(row);
        console.log('DICTATION ' + JSON.stringify(row));
        mark(c.phaseFile, c.label + ':gap');
        await sleep(3000);
      }
      res.end = vmmap(res.pid);
      mark(c.phaseFile, c.label + ':stop');
      local.stop();
      await sleep(2000);
      mark(c.phaseFile, 'none');
      fs.writeFileSync(c.out, JSON.stringify(res, null, 1));
      process.exit(res.clips.some((x) => x.err || !x.text) ? 2 : 0);
    }
    const [cmd, ...a] = process.argv.slice(2);
    (cmd === 'fetch' ? fetchModel(a[0], a[1]) : runPhase(JSON.parse(a[0])))
      .catch((e) => { console.error('bench failed: ' + ((e && e.stack) || e)); process.exit(1); });
  F_JOBS_CLIPS_PY: |
    # The radio address (44.1 kHz Vorbis) to 16 kHz mono 16-bit, cut at pauses (sample offsets at 16 kHz).
    import sys, wave, hashlib, numpy as np, soundfile as sf
    from scipy.signal import resample_poly
    src, outdir = sys.argv[1], sys.argv[2]
    x, sr = sf.read(src, dtype='float64', always_2d=True)
    assert sr == 44100, sr
    y = resample_poly(x.mean(axis=1), 160, 441)
    cuts = {'short5a': (461760, 544000), 'short5b': (630720, 720960), 'long36': (1027520, 1608000)}
    for name, (a, b) in cuts.items():
        s = np.clip(np.rint(y[a:b] * 32768.0), -32768, 32767).astype('<i2')
        with wave.open(f'{outdir}/{name}.wav', 'wb') as w:
            w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(s.tobytes())
        print(name, f'{(b - a) / 16000:.2f} s', 'pcm sha256', hashlib.sha256(s.tobytes()).hexdigest())
  F_JOBS_HOG_PY: |
    # Another app's memory: hog_gb GB of incompressible bytes, every page read again every 5 s.
    import os, sys, time
    n = int(float(sys.argv[1]) * 1024 ** 3)
    blk = os.urandom(1 << 20)
    buf = bytearray(n)
    for off in range(0, n, 1 << 20):
        m = min(1 << 20, n - off); buf[off:off + m] = blk[:m]
    print(f'hog: {n / 1024 ** 3:.2f} GB allocated and filled', flush=True)
    while True:
        s = 0
        for off in range(0, n, 16384): s += buf[off]
        time.sleep(5)
