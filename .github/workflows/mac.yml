    """Job (b): write finished-dictation labels for a shard of text inputs with Gemma-4-26B-A4B + the author LoRA v3,
    on this Mac's GPU. The Kaggle route (kaggle/gemma_easy/main.py) moved to llama.cpp's Metal build: bartowski's
    Q4_K_M GGUF, the LoRA as a runtime GGUF adapter, llama-server on 127.0.0.1 only, and the kit's own author.py
    (--backend openai --shots 0 --brief-extra AUTHOR_V2_ADDENDUM.md, T 0.2, top_p 0.9, thinking off).
    Text in, text out: the inputs are transcripts (no audio), the outputs are author rows.

        label.py --kit KIT --in INDIR --out OUTDIR [--cache DIR] [--slots 6] [--qcheck 50] [--ngl 99]

    author.py is resumable per item, so a run that the idle gate stops (--evict-after) continues where it was.
    """
    import argparse, difflib, hashlib, json, os, re, shutil, subprocess, sys, tarfile, time, urllib.request
    from pathlib import Path

    T0 = time.time()
    LLAMA = {"tag": "b11721", "sha": "2ace55512ee1ab4e2703f80c135c2a92d40d3367a5b3a98d21b103ffa7f0eb82"}
    MODEL = {"repo": "bartowski/google_gemma-4-26B-A4B-it-GGUF", "file": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf",
             "sha": "a07f72221e8e3f77455ab0d7f7652d01a9f63c262b954aa6932a53275a0e895a"}
    TAG = "gemma4_lora3_q4km_mac"


    def say(*a):
        print(time.strftime("%H:%M:%S") + f" [{time.time() - T0:6.0f}s] " + " ".join(str(x) for x in a), flush=True)


    def sha256(p):
        h = hashlib.sha256()
        with open(p, "rb") as f:
            for b in iter(lambda: f.read(1 << 24), b""):
                h.update(b)
        return h.hexdigest()


    def fetch(url, dest, sha):
        """Download once into the cache (curl resumes a partial file), check the SHA-256."""
        dest = Path(dest)
        ok = Path(str(dest) + ".ok")
        if dest.exists() and ok.exists() and ok.read_text().strip() == sha:
            return dest
        dest.parent.mkdir(parents=True, exist_ok=True)
        part = Path(str(dest) + ".part")
        for k in range(4):
            t = time.time()
            r = subprocess.run(["curl", "-fL", "--retry", "3", "--connect-timeout", "30", "-C", "-", "-sS", "-o", str(part), url])
            if r.returncode == 0:
                say(f"downloaded {dest.name}: {part.stat().st_size / 1e9:.2f} GB in {time.time() - t:.0f} s")
                break
            say("download failed, retrying:", url)
            time.sleep(10 * (k + 1))
        got = sha256(part) if part.exists() else ""
        if got != sha:
            part.unlink(missing_ok=True)
            sys.exit(f"checksum mismatch for {url}: {got}")
        part.rename(dest)
        ok.write_text(sha)
        return dest


    def llama_server(cache, tag, sha):
        d = cache / "llama" / tag
        exe = next(iter(sorted(d.rglob("llama-server"))), None) if d.exists() else None
        if exe is None:
            tgz = fetch(f"https://github.com/ggml-org/llama.cpp/releases/download/{tag}/llama-{tag}-bin-macos-arm64.tar.gz",
                        cache / "llama" / f"llama-{tag}-bin-macos-arm64.tar.gz", sha)
            with tarfile.open(tgz) as t:
                t.extractall(d, filter="data")
            exe = next(iter(sorted(d.rglob("llama-server"))))
        return exe


    class Server:
        def __init__(self, exe, model, lora, tpl, port, log):
            self.exe, self.model, self.lora, self.tpl, self.port, self.logp, self.p = exe, model, lora, tpl, port, log, None
            self.help = subprocess.run([str(exe), "--help"], capture_output=True, text=True).stdout

        def has(self, flag):
            return re.search(r"(^|[\s,])" + re.escape(flag) + r"([\s,=\[]|$)", self.help, re.M) is not None

        def start(self, c, ngl):
            a = [str(self.exe), "-m", str(self.model), "-ngl", str(ngl), "--parallel", str(c["slots"]),
                 "-c", str(c["slots"] * c["ctx"]), "-b", "2048", "-ub", str(c.get("ub", 1024)),
                 "--host", "127.0.0.1", "--port", str(self.port), "--jinja"]
            if self.lora:
                a += ["--lora", str(self.lora)]
            if self.tpl:
                a += ["--chat-template-file", str(self.tpl)]
            for flag, *v in [("--swa-full",), ("--cache-ram", "0"), ("--no-webui",), ("--metrics",)]:
                if self.has(flag):
                    a += [flag, *v]
            if c.get("kv") and self.has("--cache-type-k"):
                a += ["--cache-type-k", c["kv"], "--cache-type-v", c["kv"]]
            if c.get("fa") and self.has("-fa"):
                a += ["-fa", c["fa"]]
            say("server:", " ".join(a[1:]))
            self.logf = open(self.logp, "a")
            self.p = subprocess.Popen(a, stdout=self.logf, stderr=subprocess.STDOUT)
            t0 = time.time()
            while time.time() - t0 < 1800:
                if self.p.poll() is not None:
                    say("server exited", self.p.returncode, "|", self.tail(8))
                    return False
                try:
                    if urllib.request.urlopen(self.base() + "/health", timeout=5).status == 200:
                        say(f"server ready after {time.time() - t0:.0f} s")
                        return True
                except Exception:   # noqa: BLE001 - still loading
                    pass
                time.sleep(3)
            return False

        def base(self):
            return f"http://127.0.0.1:{self.port}"

        def tail(self, n=10):
            try:
                return " || ".join(l.strip()[:200] for l in open(self.logp, errors="replace").read().splitlines()[-n:])
            except OSError:
                return ""

        def stop(self):
            if self.p and self.p.poll() is None:
                self.p.terminate()
                try:
                    self.p.wait(30)
                except subprocess.TimeoutExpired:
                    self.p.kill()
            self.p = None


    def post(base, path, body, timeout=600):
        rq = urllib.request.Request(base + path, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
        return json.loads(urllib.request.urlopen(rq, timeout=timeout).read())


    def smoke(kit, base, gemma4):
        """One real item, and (for Gemma 4) the rendered prompt checked against the training prompt's format."""
        sys.path.insert(0, str(kit / "scripts/p1"))
        import author as A   # noqa: E402 - the kit's own
        brief = A.load_brief(kit / "docs/AUTHOR_BRIEF.md") + "\n\n" + A.load_brief(kit / "prompts/p1/AUTHOR_V2_ADDENDUM.md")
        src = next(iter(sorted((kit / "in/q50").glob("*.jsonl"))), None) or next(iter(sorted((kit / "in").rglob("*.jsonl"))))
        item = json.loads(open(src, encoding="utf-8").readline())
        msgs = [{"role": "system", "content": brief}, {"role": "user", "content": A.user_msg(item["verbatim"])}]
        ok = True
        if gemma4:
            pr = post(base, "/apply-template", {"messages": msgs, "chat_template_kwargs": {"enable_thinking": False}}).get("prompt", "")
            ok = pr.startswith("<bos><|turn>system\n") and pr.endswith("<turn|>\n<|turn>model\n<|channel>thought\n<channel|>")
            say("TEMPLATE_OK" if ok else "TEMPLATE_MISMATCH", repr(pr[:40]), "...", repr(pr[-70:]))
        t = time.time()
        o = post(base, "/v1/chat/completions", {"model": "m", "messages": msgs, "max_tokens": 300, "temperature": 0.2, "top_p": 0.9,
                                                "chat_template_kwargs": {"enable_thinking": False}})
        say(f"smoke {time.time() - t:.1f} s:", json.dumps(o.get("usage")), "| out:", (o["choices"][0]["message"].get("content") or "")[:200])
        return ok


    def run_author(kit, base, a_in, a_out, conc, tag):
        cmd = [sys.executable, "-I", str(kit / "scripts/p1/author.py"), "--in", str(a_in), "--out", str(a_out), "--backend", "openai",
               "--base-url", base + "/v1", "--model", "m", "--tag", tag, "--shots", "0",
               "--brief", str(kit / "docs/AUTHOR_BRIEF.md"), "--brief-extra", str(kit / "prompts/p1/AUTHOR_V2_ADDENDUM.md"),
               "--concurrency", str(conc), "--extra", json.dumps({"top_k": 0, "min_p": 0.0, "cache_prompt": True}),
               "--batch", "400", "--max-model-len", "6000"]
        say("author:", " ".join(cmd[3:]))
        p = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, env=dict(os.environ, PYTHONUNBUFFERED="1"))
        for line in p.stdout:
            say("  |", line.rstrip()[:240])
        p.wait()
        say("author rc", p.returncode)
        return p.returncode


    def qsim(kit, out_dir):
        """Word similarity of this run's texts to the Colab FP8 run's (ref_timing.jsonl in the kit), as on Kaggle."""
        ref_p = kit / "ref_timing.jsonl"
        if not ref_p.exists():
            return None
        ref = {}
        for l in open(ref_p, encoding="utf-8"):
            r = json.loads(l)
            ref[r["id"]] = r["ref"]
        w = lambda t: re.findall(r"[a-z0-9']+", (t or "").lower().replace("’", "'"))   # noqa: E731
        sims = []
        for f in sorted(Path(out_dir).glob("*.jsonl")):
            if f.name.startswith("_"):
                continue
            for l in open(f, encoding="utf-8"):
                try:
                    r = json.loads(l)
                except ValueError:
                    continue
                if r.get("id") in ref:
                    a, b = w(r.get("finished")), w(ref[r["id"]])
                    sims.append(1.0 if not a and not b else difflib.SequenceMatcher(None, a, b, autojunk=False).ratio())
        if not sims:
            return None
        sims.sort()
        n = len(sims)
        s = {"n": n, "mean": round(sum(sims) / n, 4), "median": round(sims[n // 2], 4), "min": round(sims[0], 3),
             "below_0.95": sum(x < 0.95 for x in sims), "below_0.90": sum(x < 0.90 for x in sims)}
        say("QCHECK_SIM", json.dumps(s), "(Colab FP8 texts as reference; Kaggle Q4_K_M got mean 0.99)")
        return s


    def server_stats(log):
        try:
            txt = open(log, errors="replace").read()
        except OSError:
            return {}
        pe = [(float(a), int(b)) for a, b in re.findall(r"prompt eval time =\s*([\d.]+) ms /\s*(\d+) tokens", txt)]
        ev = [(float(a), int(b)) for a, b in re.findall(r"\beval time =\s*([\d.]+) ms /\s*(\d+) (?:tokens|runs)", txt)]
        s = {"requests": len(pe), "full_reprocessing": len(re.findall(r"forcing full prompt re-processing", txt))}
        if pe:
            s["prompt_tokens_per_request"] = round(sum(b for _, b in pe) / len(pe))
        if ev:
            s["gen_tok_s_per_request"] = round(sum(b for _, b in ev) / max(sum(a for a, _ in ev), 1) * 1000, 1)
        return s


    def count_rows(d):
        return sum(sum(1 for _ in open(f, encoding="utf-8")) for f in Path(d).glob("*.jsonl") if not f.name.startswith("_")) if Path(d).exists() else 0


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--kit", required=True)
        ap.add_argument("--in", dest="inp", required=True)
        ap.add_argument("--out", required=True)
        ap.add_argument("--cache", default=str(Path.home() / "typd-cache"))
        ap.add_argument("--slots", type=int, default=6)
        ap.add_argument("--qcheck", type=int, default=0, help="first: this many timing-set items vs the Colab texts")
        ap.add_argument("--ngl", default="99")
        ap.add_argument("--model-repo", default=MODEL["repo"])
        ap.add_argument("--model-file", default=MODEL["file"])
