          rc=$?; tail -25 "$L/install.txt"; test $rc = 3 || exit 1
          sudo mkdir -p /Users/Shared/mr && sudo cp -R "$M/jobs" "$M/tests" /Users/Shared/mr/ && sudo chmod -R a+rX /Users/Shared/mr
          { echo WORKER_USER=typdworker; echo IDLE_MINUTES=0; echo BUSY_CPU_PERCENT=1000; echo BUSY_GPU_PERCENT=100
            echo CHECK_SECONDS=5; echo RESPECT_VIDEO=0; } | sudo tee /Users/Shared/mr/ci-gate.conf
          cd /tmp && sudo -u typdworker -H env TYPD_WORKER_CONF=/Users/Shared/mr/ci-gate.conf /Library/TypdWorker/bin/idlegate check

      - name: Typd 0.2.11's dmg (the CI build draft = the live download)
        run: |
          set -e
          gh release download build-40047208604 --repo "$GITHUB_REPOSITORY" --pattern Typd-0.2.11-mac-arm64.dmg --dir "$RUNNER_TEMP/rel"
          sudo cp "$RUNNER_TEMP/rel/Typd-0.2.11-mac-arm64.dmg" /Users/Shared/mr/; sudo chmod 644 /Users/Shared/mr/Typd-0.2.11-mac-arm64.dmg

      - name: Job (a) as typdworker through the gate (light model, JFK; quiet, then small-memory)
        run: |
          set +e
          OUT=/Users/typdworker/typd-results/$GITHUB_RUN_ID
          E="TYPD_WORKER_CONF=/Users/Shared/mr/ci-gate.conf MODES=light_low CLIPS=jfk IDLE_S=5 DMG_FILE=/Users/Shared/mr/Typd-0.2.11-mac-arm64.dmg"
          cd /tmp && sudo -u typdworker -H env $E /Library/TypdWorker/bin/idlegate run --name "ci bench" --needs-gb 2 --nice 0 --max-active 40m -- /bin/bash /Users/Shared/mr/jobs/bench.sh "$OUT" 2>&1 | tee "$L/bench-main.txt"
          a=${PIPESTATUS[0]}
          cd /tmp && sudo -u typdworker -H env $E PHASE=squeeze SQUEEZE_GB=5 SETS=A /Library/TypdWorker/bin/idlegate run --name "ci bench squeeze" --evict-after 0 --memory ignore --nice 0 --max-active 30m -- /bin/bash /Users/Shared/mr/jobs/bench.sh "$OUT" 2>&1 | tee "$L/bench-squeeze.txt"
          b=${PIPESTATUS[0]}
          sudo cp -R "$OUT" "$L/results"; sudo chown -R "$(id -un)" "$L/results"
          echo "main $a, squeeze $b"; test $a = 0 && test $b = 0

      - name: The results job's script (publish.sh as typdworker -> a draft release)
        run: |
          set -e
          cd /tmp; sudo -u typdworker -H env GITHUB_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_API_URL="$GITHUB_API_URL" GITHUB_SERVER_URL="$GITHUB_SERVER_URL" /bin/bash /Users/Shared/mr/jobs/publish.sh mac-bench-ci "CI test of the Mac job (a)"
          gh release view "mac-bench-ci-$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '{isDraft, assets: [.assets[].name]}'
          sudo test ! -e "/Users/typdworker/typd-results/$GITHUB_RUN_ID" && echo "local results removed after publishing"

      - name: Keep the logs in a draft release (maintainers only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "$RUNNER_TEMP"; tar czf "macrunner-bench.tar.gz" -C "$L" .
          gh release create "macrunner-${GITHUB_RUN_ID}-bench" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mac worker test bench ${GITHUB_RUN_ID} (logs)" --notes "Draft: logs of the Mac worker test (bench). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "macrunner-bench.tar.gz" $(ls "$L"/*.png "$M/typd-input-watch" 2>/dev/null)

  label:
    if: github.repository == 'SameRainbows/typd-app' && contains(inputs.parts, 'label')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write   # the test's input drafts, the output draft, the logs
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Unpack the files under test
        run: |
          set -e
          M="$RUNNER_TEMP/mr"; mkdir -p "$M" "$RUNNER_TEMP/logs"
          while read -r v p; do [ -n "$v" ] || continue; mkdir -p "$M/$(dirname "$p")"; printf '%s' "${!v}" > "$M/$p"; done <<< "$F_MANIFEST"
          chmod 755 "$M"/src/idlegate "$M"/src/*.sh "$M"/src/typd-worker "$M"/src/runner-service "$M"/jobs/*.sh "$M"/tests/*.sh
          echo "M=$M" >> "$GITHUB_ENV"; echo "L=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; /bin/bash --version | head -1

      - name: Build the input watch and the installer (as for the owner, with the CI settings)
        run: |
          set -e
          cd "$M"
          swiftc -O -target arm64-apple-macos13.0 src/input-watch.swift -o typd-input-watch
          swiftc -O tests/synth.swift -o synth
          file typd-input-watch; otool -L typd-input-watch; shasum -a 256 typd-input-watch | tee "$L/typd-input-watch.sha256"
          python3 build.py --src src --conf tests/ci.conf --helper typd-input-watch --readme tests/README-ci.md --out dist | tee "$L/build.txt"

      - name: Install Typd Worker (fake code; everything but the GitHub connection)
        run: |
          set +e
          TYPD_WORKER_TEST=1 TYPD_WORKER_TEST_CODE=TYPDTESTFAKECODE7Q3X9K2M4W8XY /bin/bash "$M/dist/Install Typd Worker.command" > "$L/install.txt" 2>&1
          rc=$?; tail -25 "$L/install.txt"; test $rc = 3 || exit 1
          sudo mkdir -p /Users/Shared/mr && sudo cp -R "$M/jobs" "$M/tests" /Users/Shared/mr/ && sudo chmod -R a+rX /Users/Shared/mr
          { echo WORKER_USER=typdworker; echo IDLE_MINUTES=0; echo BUSY_CPU_PERCENT=1000; echo BUSY_GPU_PERCENT=100
            echo CHECK_SECONDS=5; echo RESPECT_VIDEO=0; } | sudo tee /Users/Shared/mr/ci-gate.conf
          cd /tmp && sudo -u typdworker -H env TYPD_WORKER_CONF=/Users/Shared/mr/ci-gate.conf /Library/TypdWorker/bin/idlegate check

      - name: Inputs as the Mac job gets them (this run's draft releases, through lib.sh)
        run: |
          set -e
          R=$GITHUB_RUN_ID
          tar czf "$RUNNER_TEMP/ci-kit-$R.tar.gz" -C "$M/tests/ci_kit" .
          mkdir -p "$RUNNER_TEMP/in"; cp "$M/tests/ci_kit/in/q50/q50_0000.jsonl" "$RUNNER_TEMP/in/ci_0000.jsonl"
          tar czf "$RUNNER_TEMP/gemma-in-ci$R.tar.gz" -C "$RUNNER_TEMP/in" .
          echo "CI test input" > "$RUNNER_TEMP/notes.md"
          export GITHUB_TOKEN="$GH_TOKEN"; . "$M/jobs/lib.sh"
          draft_release "ci-kit-$R" "CI kit $R" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/ci-kit-$R.tar.gz"
          draft_release "gemma-in-ci$R" "CI input $R" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/gemma-in-ci$R.tar.gz"
          cd /tmp && sudo -u typdworker -H env GITHUB_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_API_URL="$GITHUB_API_URL" \
            /bin/bash /Users/Shared/mr/jobs/label.sh fetch "ci$R" "ci-kit-$R" 2>&1 | tee "$L/label-fetch.txt"

      - name: Job (b) refuses on this 7 GB VM (it needs 48 GB)
        run: |
          set +e
          cd /tmp; sudo -u typdworker -H /bin/bash /Users/Shared/mr/jobs/label.sh run "ci$GITHUB_RUN_ID" 2 0 2>&1 | tee "$L/label-refusal.txt"
          test "${PIPESTATUS[0]}" = 3 && grep -q "needs 48 GB or more" "$L/label-refusal.txt"

      - name: Job (b) as typdworker through the gate (Gemma 3 270M stand-in, no LoRA, 3 rows), then again (resume)
        run: |
          set +e
          R=$GITHUB_RUN_ID
          for k in 1 2; do
            cd /tmp && sudo -u typdworker -H env TYPD_WORKER_CONF=/Users/Shared/mr/ci-gate.conf GITHUB_RUN_ID="$R" LABEL_ARGS="--model-repo ggml-org/gemma-3-270m-it-GGUF --model-file gemma-3-270m-it-Q8_0.gguf --model-sha 0ef57d2c838458a1952664260dcba38e5bdda37494f3af732f06e4add24068e3" TYPD_LABEL_MIN_GB=0 \
              /Library/TypdWorker/bin/idlegate run --name "ci label $k" --evict-after 20m --max-active 30m -- /bin/bash /Users/Shared/mr/jobs/label.sh run "ci$R" 2 0 2>&1 | tee "$L/label-run$k.txt"
            echo "run $k: ${PIPESTATUS[0]}"
          done
          sudo sh -c "cat /Users/typdworker/typd-results/$R/out/*.jsonl" | tee "$L/label-out.jsonl"
          grep -q '3 were done' "$L/label-run2.txt" && echo "resume: the second run wrote nothing new"
          test "$(wc -l < "$L/label-out.jsonl" | tr -d ' ')" = 3

      - name: The results job's script (publish.sh as typdworker -> a draft release), then clean up
        run: |
          set -e
          R=$GITHUB_RUN_ID
          cd /tmp && sudo -u typdworker -H env GITHUB_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$R" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_API_URL="$GITHUB_API_URL" GITHUB_SERVER_URL="$GITHUB_SERVER_URL" /bin/bash /Users/Shared/mr/jobs/publish.sh "gemma-out-ci$R" "CI test of the Mac job (b)"
          gh release view "gemma-out-ci$R-$R" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '{isDraft, assets: [.assets[].name]}'
          gh release delete "ci-kit-$R" --yes --repo "$GITHUB_REPOSITORY"; gh release delete "gemma-in-ci$R" --yes --repo "$GITHUB_REPOSITORY"

      - name: Keep the logs in a draft release (maintainers only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "$RUNNER_TEMP"; tar czf "macrunner-label.tar.gz" -C "$L" .
          gh release create "macrunner-${GITHUB_RUN_ID}-label" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mac worker test label ${GITHUB_RUN_ID} (logs)" --notes "Draft: logs of the Mac worker test (label). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "macrunner-label.tar.gz" $(ls "$L"/*.png "$M/typd-input-watch" 2>/dev/null)

  teacher:
